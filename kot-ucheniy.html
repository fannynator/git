// CDN для Three.js
const THREE_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';

let THREE_LOADED = false;
let THREE_LOADING = false;

function loadThree() {
    return new Promise((resolve, reject) => {
        if (typeof THREE !== 'undefined' && THREE.Scene) {
            THREE_LOADED = true;
            resolve();
            return;
        }
        if (THREE_LOADING) {
            // Ждём
            const check = setInterval(() => {
                if (typeof THREE !== 'undefined' && THREE.Scene) {
                    clearInterval(check);
                    THREE_LOADED = true;
                    resolve();
                }
            }, 100);
            return;
        }
        THREE_LOADING = true;
        const script = document.createElement('script');
        script.src = THREE_CDN;
        script.onload = () => {
            THREE_LOADED = true;
            resolve();
        };
        script.onerror = () => reject(new Error('Не удалось загрузить Three.js'));
        document.head.appendChild(script);
    });
}

// ─── Класс Cat3D ────────────────────────────────────────────────

class Cat3D {
    /**
     * @param {HTMLElement} container - DOM-элемент для вставки сцены
     * @param {object} state - ссылка на state из state.js
     * @param {function} saveState - функция saveState из state.js
     * @param {function} showToast - функция показа тостов
     */
    constructor(container, state, saveState) {
        this.container = container;
        this.state = state;
        this.saveState = saveState;
        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.catGroup = new THREE.Group(); // заглушка
        this.hatGroup = new THREE.Group();
        this.glassesGroup = new THREE.Group();
        this.accessoryGroup = new THREE.Group();
        this.particles = [];
        this.clock = new THREE.Clock();
        this.animTime = 0;
        this.width = 250;
        this.height = 250;
        this.isDisposed = false;
        this._mouseX = 0;
        this._mouseY = 0;
        this._targetRotX = 0;
        this._targetRotY = 0;
        this._currentRotX = 0;
        this._currentRotY = 0;
        this._isDragging = false;
        this._blinkTimer = 0;
        this._blinkInterval = 4;
        this._isBlinking = false;
        this._tailWave = 0;
        this._earTwitchTimer = 0;
        this._jumpOffset = 0;
        this._spinAngle = 0;

        this.hatParts = {};
        this.glassesParts = {};
        this.accessoryParts = {};

        // Инициализация
        this.init();
    }

    async init() {
        await loadThree();
        if (this.isDisposed) return;

        this.width = this.container.clientWidth || 250;
        this.height = this.container.clientHeight || 250;

        this.setupScene();
        this.buildCat();
        this.setupLights();
        this.setupInteraction();
        this.startLoop();

        // Применяем сохранённое состояние
        this.applyActiveItems();
    }

    setupScene() {
        this.scene = new THREE.Scene();

        this.camera = new THREE.PerspectiveCamera(45, this.width / this.height, 0.1, 100);
        this.camera.position.set(0, 0, 7);
        this.camera.lookAt(0, 0, 0);

        this.renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true,
            powerPreference: 'high-performance'
        });
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setClearColor(0x000000, 0);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        this.container.innerHTML = '';
        this.container.appendChild(this.renderer.domElement);
        this.renderer.domElement.style.display = 'block';
        this.renderer.domElement.style.width = '100%';
        this.renderer.domElement.style.height = '100%';
        this.renderer.domElement.style.cursor = 'grab';
    }

    setupLights() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        this.scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 5, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 512;
        dirLight.shadow.mapSize.height = 512;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        this.scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffeedd, 0.3);
        fillLight.position.set(-3, -2, 3);
        this.scene.add(fillLight);
    }

    // ─── Построение кота ──────────────────────────────────────────

    buildCat() {
        const furColor = SKIN_TYPES.orange.hex;
        const bellyColor = '#FEF3C7';

        // Группа кота
        this.catGroup = new THREE.Group();

        // ─── ТЕЛО ───
        const bodyGeo = new THREE.SphereGeometry(0.9, 16, 16);
        bodyGeo.scale(1, 1.1, 0.8);
        const bodyMat = new THREE.MeshToonMaterial({ color: furColor });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        bodyMesh.position.y = -1.0;
        bodyMesh.castShadow = true;
        bodyMesh.receiveShadow = true;
        this.catGroup.add(bodyMesh);
        this.bodyMesh = bodyMesh;

        // Пузико
        const bellyGeo = new THREE.SphereGeometry(0.6, 12, 12);
        bellyGeo.scale(1, 0.85, 0.6);
        const bellyMat = new THREE.MeshToonMaterial({ color: bellyColor });
        const bellyMesh = new THREE.Mesh(bellyGeo, bellyMat);
        bellyMesh.position.set(0, -1.05, 0.55);
        this.catGroup.add(bellyMesh);

        // ─── ГОЛОВА ───
        const headGroup = new THREE.Group();
        headGroup.position.y = 0.05;

        const headGeo = new THREE.SphereGeometry(0.65, 16, 16);
        headGeo.scale(1, 0.95, 0.9);
        const headMat = new THREE.MeshToonMaterial({ color: furColor });
        const headMesh = new THREE.Mesh(headGeo, headMat);
        headMesh.castShadow = true;
        headGroup.add(headMesh);

        // Щёки
        const cheekGeo = new THREE.SphereGeometry(0.22, 12, 12);
        const cheekMat = new THREE.MeshToonMaterial({ color: bellyColor });
        const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
        cheekL.position.set(-0.4, -0.08, 0.45);
        headGroup.add(cheekL);
        const cheekR = new THREE.Mesh(cheekGeo, cheekMat);
        cheekR.position.set(0.4, -0.08, 0.45);
        headGroup.add(cheekR);

        // Нос
        const noseGeo = new THREE.SphereGeometry(0.08, 8, 8);
        const noseMat = new THREE.MeshToonMaterial({ color: '#F472B6' });
        const noseMesh = new THREE.Mesh(noseGeo, noseMat);
        noseMesh.position.set(0, -0.02, 0.62);
        headGroup.add(noseMesh);

        // Блик на носу
        const noseShineGeo = new THREE.SphereGeometry(0.03, 6, 6);
        const noseShineMat = new THREE.MeshToonMaterial({ color: '#FFFFFF' });
        const noseShine = new THREE.Mesh(noseShineGeo, noseShineMat);
        noseShine.position.set(0.01, 0.02, 0.69);
        headGroup.add(noseShine);

        // Рот (w-улыбка) — два маленьких изогнутых цилиндра
        const mouthColor = '#BE185D';
        const mouthMat = new THREE.MeshToonMaterial({ color: mouthColor });

        // Левая часть рта
        const mouthGeo1 = new THREE.TorusGeometry(0.08, 0.02, 8, 8, Math.PI);
        const mouth1 = new THREE.Mesh(mouthGeo1, mouthMat);
        mouth1.position.set(-0.08, -0.14, 0.62);
        mouth1.rotation.set(0, 0, -Math.PI / 6);
        headGroup.add(mouth1);

        // Правая часть
        const mouthGeo2 = new THREE.TorusGeometry(0.08, 0.02, 8, 8, Math.PI);
        const mouth2 = new THREE.Mesh(mouthGeo2, mouthMat);
        mouth2.position.set(0.08, -0.14, 0.62);
        mouth2.rotation.set(0, 0, Math.PI / 6);
        headGroup.add(mouth2);

        // Центр
        const mouthGeo3 = new THREE.TorusGeometry(0.05, 0.02, 8, 8, Math.PI);
        const mouth3 = new THREE.Mesh(mouthGeo3, mouthMat);
        mouth3.position.set(0, -0.2, 0.62);
        mouth3.rotation.set(0, 0, Math.PI);
        headGroup.add(mouth3);

        // Усы — 4 тонких цилиндра с каждой стороны
        const whiskerMat = new THREE.MeshToonMaterial({ color: '#CBD5E1' });
        const whiskerGeo = new THREE.CylinderGeometry(0.01, 0.01, 0.5, 6);
        const whiskerPositions = [
            { x: 0.25, y: 0.05, z: 0.5, ry: 0, rz: 0.5 },
            { x: 0.28, y: 0.0, z: 0.5, ry: 0, rz: 0.3 },
            { x: 0.3, y: -0.05, z: 0.5, ry: 0, rz: 0.1 },
            { x: 0.28, y: -0.1, z: 0.5, ry: 0, rz: -0.1 },
            { x: -0.25, y: 0.05, z: 0.5, ry: 0, rz: -0.5 },
            { x: -0.28, y: 0.0, z: 0.5, ry: 0, rz: -0.3 },
            { x: -0.3, y: -0.05, z: 0.5, ry: 0, rz: -0.1 },
            { x: -0.28, y: -0.1, z: 0.5, ry: 0, rz: 0.1 }
        ];
        whiskerPositions.forEach(wp => {
            const w = new THREE.Mesh(whiskerGeo, whiskerMat);
            w.position.set(wp.x, wp.y, wp.z);
            w.rotation.z = wp.rz;
            headGroup.add(w);
        });

        // ─── ГЛАЗА ───
        this.eyeGroup = new THREE.Group();
        this.eyeLeft = this.buildEye();
        this.eyeLeft.position.set(-0.22, 0.12, 0.55);
        this.eyeRight = this.buildEye();
        this.eyeRight.position.set(0.22, 0.12, 0.55);
        this.eyeGroup.add(this.eyeLeft);
        this.eyeGroup.add(this.eyeRight);
        headGroup.add(this.eyeGroup);

        this.headGroup = headGroup;
        this.catGroup.add(headGroup);

        // ─── УШИ ───
        this.earsGroup = new THREE.Group();
        this.earLeft = this.buildEar();
        this.earLeft.position.set(-0.38, 0.55, -0.05);
        this.earLeft.rotation.z = 0.3;
        this.earRight = this.buildEar();
        this.earRight.position.set(0.38, 0.55, -0.05);
        this.earRight.rotation.z = -0.3;
        this.earsGroup.add(this.earLeft);
        this.earsGroup.add(this.earRight);
        this.catGroup.add(this.earsGroup);

        // ─── ЛАПЫ (передние) ───
        this.pawsGroup = new THREE.Group();
        const pawGeo = new THREE.CylinderGeometry(0.18, 0.2, 0.7, 12);
        const pawMat = new THREE.MeshToonMaterial({ color: furColor });
        const pawL = new THREE.Mesh(pawGeo, pawMat);
        pawL.position.set(-0.35, -1.5, 0.3);
        pawL.castShadow = true;
        const pawR = new THREE.Mesh(pawGeo, pawMat);
        pawR.position.set(0.35, -1.5, 0.3);
        pawR.castShadow = true;
        this.pawsGroup.add(pawL);
        this.pawsGroup.add(pawR);

        // Подушечки на лапах (розовые сферы-сплюснутые)
        const padGeo = new THREE.SphereGeometry(0.08, 8, 8);
        padGeo.scale(1, 0.5, 1);
        const padMat = new THREE.MeshToonMaterial({ color: '#FECACA' });
        const padPositions = [
            { x: -0.35, y: -1.85, z: 0.45 },
            { x: 0.35, y: -1.85, z: 0.45 }
        ];
        padPositions.forEach(pp => {
            const pad = new THREE.Mesh(padGeo, padMat);
            pad.position.set(pp.x, pp.y, pp.z);
            pad.rotation.x = Math.PI / 2;
            this.pawsGroup.add(pad);
        });

        this.catGroup.add(this.pawsGroup);

        // ─── ХВОСТ ───
        this.tailGroup = new THREE.Group();
        const tailCurve = new THREE.CubicBezierCurve3(
            new THREE.Vector3(0, -1.2, -0.5),
            new THREE.Vector3(0.3, -0.5, -0.8),
            new THREE.Vector3(-0.1, 0.3, -0.6),
            new THREE.Vector3(0.1, 0.8, -0.5)
        );
        const tailGeo = new THREE.TubeGeometry(tailCurve, 16, 0.08, 8, false);
        // Переменный радиус
        const tailPositions = tailGeo.attributes.position;
        for (let i = 0; i < tailPositions.count; i++) {
            const t = i / tailPositions.count;
            const scale = 1.0 - t * 0.5;
            tailPositions.setX(i, tailPositions.getX(i) * (1 + t * 0.2));
        }
        tailGeo.computeVertexNormals();

        const tailMat = new THREE.MeshToonMaterial({ color: furColor });
        const tailMesh = new THREE.Mesh(tailGeo, tailMat);
        tailMesh.castShadow = true;
        this.tailGroup.add(tailMesh);

        // Тёмный кончик
        const tipGeo = new THREE.SphereGeometry(0.07, 8, 8);
        const tipMat = new THREE.MeshToonMaterial({ color: '#B45309' });
        const tipMesh = new THREE.Mesh(tipGeo, tipMat);
        const tipPoint = tailCurve.getPoint(1);
        tipMesh.position.copy(tipPoint);
        this.tailGroup.add(tipMesh);

        this.catGroup.add(this.tailGroup);

        this.scene.add(this.catGroup);

        // Группы для аксессуаров
        this.hatGroup = new THREE.Group();
        this.glassesGroup = new THREE.Group();
        this.accessoryGroup = new THREE.Group();
        this.headGroup.add(this.hatGroup);
        this.headGroup.add(this.glassesGroup);
        this.catGroup.add(this.accessoryGroup);

        // ─── ТЕНЬ (plane) ───
        const shadowGeo = new THREE.PlaneGeometry(1.8, 1.2);
        const shadowMat = new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.15,
            side: THREE.DoubleSide
        });
        const shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
        shadowPlane.rotation.x = -Math.PI / 2;

        shadowPlane.receiveShadow = true;
        this.scene.add(shadowPlane);

    buildEye() {
        const group = new THREE.Group();

        // Белок
        const whiteGeo = new THREE.SphereGeometry(0.13, 12, 12);
        const whiteMat = new THREE.MeshToonMaterial({ color: '#FFFFFF' });
        const white = new THREE.Mesh(whiteGeo, whiteMat);
        group.add(white);

        // Радужка
        const irisGeo = new THREE.SphereGeometry(0.08, 10, 10);
        const irisMat = new THREE.MeshToonMaterial({ color: '#10B981' });
        const iris = new THREE.Mesh(irisGeo, irisMat);
        iris.position.z = 0.08;
        group.add(iris);

        // Зрачок
        const pupilGeo = new THREE.SphereGeometry(0.04, 8, 8);
        const pupilMat = new THREE.MeshToonMaterial({ color: '#000000' });
        const pupil = new THREE.Mesh(pupilGeo, pupilMat);
        pupil.position.z = 0.12;
        group.add(pupil);

        // Блик
        const shineGeo = new THREE.SphereGeometry(0.025, 6, 6);
        const shineMat = new THREE.MeshToonMaterial({ color: '#FFFFFF' });
        const shine = new THREE.Mesh(shineGeo, shineMat);
        shine.position.set(0.03, 0.03, 0.15);
        group.add(shine);

        return group;
    }

    buildEar() {
        const group = new THREE.Group();

        // Внешнее ухо
        const outerGeo = new THREE.ConeGeometry(0.22, 0.5, 8, 1);
        const outerMat = new THREE.MeshToonMaterial({ color: '#F59E0B' });
        const outer = new THREE.Mesh(outerGeo, outerMat);
        outer.castShadow = true;
        group.add(outer);

        // Внутреннее ухо
        const innerGeo = new THREE.ConeGeometry(0.13, 0.35, 8, 1);
        const innerMat = new THREE.MeshToonMaterial({ color: '#FECACA' });
        const inner = new THREE.Mesh(innerGeo, innerMat);
        inner.position.y = -0.03;
        inner.position.z = 0.05;
        group.add(inner);

        return group;
    }

    // ─── Аксессуары ───────────────────────────────────────────────

    clearGroup(group) {
        while (group.children.length > 0) {
            const child = group.children[0];
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
                if (Array.isArray(child.material)) {
                    child.material.forEach(m => m.dispose());
                } else {
                    child.material.dispose();
                }
            }
            group.remove(child);
        }
    }

    setHat(type) {
        this.clearGroup(this.hatGroup);
        if (type === 'none') return;

        if (type === 'cap') {
            // Кепка
            const brimGeo = new THREE.CylinderGeometry(0.4, 0.45, 0.1, 16);
            const brimMat = new THREE.MeshToonMaterial({ color: '#1E40AF' });
            const brim = new THREE.Mesh(brimGeo, brimMat);
            brim.position.y = 0.65;
            this.hatGroup.add(brim);

            const topGeo = new THREE.SphereGeometry(0.35, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2);
            const topMat = new THREE.MeshToonMaterial({ color: '#2563EB' });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 0.7;
            this.hatGroup.add(top);

            const buttonGeo = new THREE.SphereGeometry(0.06, 8, 8);
            const buttonMat = new THREE.MeshToonMaterial({ color: '#1E3A8A' });
            const button = new THREE.Mesh(buttonGeo, buttonMat);
            button.position.y = 0.95;
            this.hatGroup.add(button);
        } else if (type === 'grad') {
            // Выпускная шапочка

            const baseMat = new THREE.MeshToonMaterial({ color: '#111827' });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.72;
            this.hatGroup.add(base);

            const topGeo = new THREE.CylinderGeometry(0.2, 0.25, 0.2, 12);
            const topMat = new THREE.MeshToonMaterial({ color: '#111827' });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 0.85;
            this.hatGroup.add(top);

            // Кисточка
            const tasselGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.3, 6);
            const tasselMat = new THREE.MeshToonMaterial({ color: '#FBBF24' });
            const tassel = new THREE.Mesh(tasselGeo, tasselMat);
            tassel.position.set(0.1, 0.7, 0);
            tassel.rotation.z = 0.5;
            this.hatGroup.add(tassel);
        } else if (type === 'crown') {
            // Корона
            const baseGeo = new THREE.TorusGeometry(0.3, 0.05, 8, 24);
            const baseMat = new THREE.MeshToonMaterial({ color: '#FBBF24' });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.68;
            this.hatGroup.add(base);

            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const spikeGeo = new THREE.ConeGeometry(0.05, 0.2, 6);
                const spike = new THREE.Mesh(spikeGeo, baseMat);
                spike.position.set(
                    Math.cos(angle) * 0.3,
                    0.78,
                    Math.sin(angle) * 0.3
                );
                this.hatGroup.add(spike);
            }

            const jewelGeo = new THREE.SphereGeometry(0.05, 8, 8);
            const jewelMat = new THREE.MeshToonMaterial({ color: '#EF4444' });
            const jewel = new THREE.Mesh(jewelGeo, jewelMat);
            jewel.position.y = 0.88;
            this.hatGroup.add(jewel);
        } else if (type === 'wizard') {
            // Колпак волшебника
            const coneGeo = new THREE.ConeGeometry(0.28, 0.7, 12, 1);
            const coneMat = new THREE.MeshToonMaterial({ color: '#7C3AED' });
            const cone = new THREE.Mesh(coneGeo, coneMat);
            cone.position.y = 0.85;
            this.hatGroup.add(cone);

            const brimGeo = new THREE.TorusGeometry(0.32, 0.06, 8, 24);
            const brimMat = new THREE.MeshToonMaterial({ color: '#5B21B6' });
            const brim = new THREE.Mesh(brimGeo, brimMat);
            brim.position.y = 0.58;
            this.hatGroup.add(brim);

            // Звёздочка
            for (let i = 0; i < 5; i++) {
                const starGeo = new THREE.SphereGeometry(0.02, 4, 4);
                const starMat = new THREE.MeshToonMaterial({ color: '#FBBF24' });
                const star = new THREE.Mesh(starGeo, starMat);
                star.position.set(
                    (Math.random() - 0.5) * 0.4,
                    0.7 + Math.random() * 0.5,
                    (Math.random() - 0.5) * 0.4
                );
                this.hatGroup.add(star);
            }
        } else if (type === 'tophat') {
            // Цилиндр
            const topGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.45, 16);
            const topMat = new THREE.MeshToonMaterial({ color: '#111827' });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 0.85;
            this.hatGroup.add(top);

            const brimGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.06, 24);
            const brimMat = new THREE.MeshToonMaterial({ color: '#1F2937' });
            const brim = new THREE.Mesh(brimGeo, brimMat);
            brim.position.y = 0.6;
            this.hatGroup.add(brim);

            const bandGeo = new THREE.TorusGeometry(0.26, 0.03, 8, 24);
            const bandMat = new THREE.MeshToonMaterial({ color: '#7C3AED' });
            const band = new THREE.Mesh(bandGeo, bandMat);
            band.rotation.x = Math.PI / 2;
            band.position.y = 0.75;
            this.hatGroup.add(band);
        }

    setGlasses(type) {
        this.clearGroup(this.glassesGroup);
        if (type === 'none') return;

        const frameGeo = new THREE.TorusGeometry(0.2, 0.03, 8, 16);

        if (type === 'round') {
            const frameMat = new THREE.MeshToonMaterial({ color: '#374151' });
            const frameL = new THREE.Mesh(frameGeo, frameMat);
            frameL.position.set(-0.2, 0.12, 0.6);
            this.glassesGroup.add(frameL);
            const frameR = new THREE.Mesh(frameGeo, frameMat);
            frameR.position.set(0.2, 0.12, 0.6);
            this.glassesGroup.add(frameR);

            const bridgeGeo = new THREE.BoxGeometry(0.1, 0.03, 0.03);

            bridge.position.set(0, 0.12, 0.6);

        } else if (type === 'cool') {
            // Стильные (треугольные/wayfarer)

            const boxGeo = new THREE.BoxGeometry(0.35, 0.2, 0.04);
            const boxL = new THREE.Mesh(boxGeo, frameMat);
            boxL.position.set(-0.2, 0.12, 0.6);

            const boxR = new THREE.Mesh(boxGeo, frameMat);

                    const rodGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.18, 6);
                    const rod = new THREE.Mesh(rodGeo, starFrameMat);
                    rod.position.set(sign * 0.2 + Math.cos(angle) * 0.1, 0.12 + Math.sin(angle) * 0.1, 0.6);
                    rod.rotation.z = angle + Math.PI / 2;
                    this.glassesGroup.add(rod);
                }
            }
            const bridgeGeo = new THREE.BoxGeometry(0.08, 0.03, 0.03);
            const bridge = new THREE.Mesh(bridgeGeo, starFrameMat);
            bridge.position.set(0, 0.12, 0.6);
            this.glassesGroup.add(bridge);

            // 3D-очки (квадратные)
            const d3Mat = new THREE.MeshToonMaterial({ color: '#EF4444' });
            const boxGeo = new THREE.BoxGeometry(0.25, 0.18, 0.05);
            const boxL = new THREE.Mesh(boxGeo, d3Mat);
            boxL.position.set(-0.2, 0.12, 0.6);
            this.glassesGroup.add(boxL);
            const boxR = new THREE.Mesh(boxGeo, d3Mat);
            boxR.position.set(0.2, 0.12, 0.6);
            this.glassesGroup.add(boxR);

            // Синяя линза
            const lensGeo = new THREE.BoxGeometry(0.2, 0.13, 0.03);
            const lensMat = new THREE.MeshToonMaterial({ color: '#3B82F6', transparent: true, opacity: 0.5 });
            const lensL = new THREE.Mesh(lensGeo, lensMat);
            lensL.position.set(-0.2, 0.12, 0.63);
            this.glassesGroup.add(lensL);
            const lensR = new THREE.Mesh(lensGeo, lensMat);
            lensR.position.set(0.2, 0.12, 0.63);
            this.glassesGroup.add(lensR);

            const bridgeGeo = new THREE.BoxGeometry(0.08, 0.03, 0.03);
            const bridge = new THREE.Mesh(bridgeGeo, d3Mat);
            bridge.position.set(0, 0.12, 0.6);
            this.glassesGroup.add(bridge);
        }
    }

    setSkin(hex) {
        const color = new THREE.Color(hex);
        this.updateGroupColor(this.catGroup, color, ['#FEF3C7', '#FECACA', '#F472B6', '#BE185D', '#CBD5E1', '#B45309', '#10B981', '#FFFFFF', '#000000']);
    }

    updateGroupColor(group, color, exclude) {
        group.traverse(child => {
            if (child.isMesh && child.material && child.material.color) {
                const hex = '#' + child.material.color.getHexString();
                if (!exclude.some(e => e.toUpperCase() === hex.toUpperCase())) {
                    child.material.color.copy(color);
                }
            }
        });
    }

    setAccessory(type) {
        this.clearGroup(this.accessoryGroup);
        if (type === 'none') return;

        if (type === 'bowtie') {
            // Бабочка
            const bowMat = new THREE.MeshToonMaterial({ color: '#EF4444' });
            const wingGeo = new THREE.BoxGeometry(0.2, 0.1, 0.04);
            const wingL = new THREE.Mesh(wingGeo, bowMat);
            wingL.position.set(-0.15, -0.75, 0.7);
            wingL.rotation.z = -0.3;
            this.accessoryGroup.add(wingL);
            const wingR = new THREE.Mesh(wingGeo, bowMat);
            wingR.position.set(0.15, -0.75, 0.7);
            wingR.rotation.z = 0.3;
            this.accessoryGroup.add(wingR);
            const knotGeo = new THREE.SphereGeometry(0.06, 8, 8);
            const knot = new THREE.Mesh(knotGeo, bowMat);
            knot.position.set(0, -0.75, 0.72);
            this.accessoryGroup.add(knot);
        } else if (type === 'collar') {
            // Ошейник
            const collarGeo = new THREE.TorusGeometry(0.35, 0.04, 8, 16);
            const collarMat = new THREE.MeshToonMaterial({ color: '#FBBF24' });
            const collar = new THREE.Mesh(collarGeo, collarMat);
            collar.position.y = -0.55;
            collar.rotation.x = Math.PI / 2;
            this.accessoryGroup.add(collar);

            const bellGeo = new THREE.SphereGeometry(0.07, 8, 8);
            const bellMat = new THREE.MeshToonMaterial({ color: '#FBBF24' });
            const bell = new THREE.Mesh(bellGeo, bellMat);
            bell.position.set(0, -0.85, 0.35);
            this.accessoryGroup.add(bell);
        } else if (type === 'fish') {
            // Рыбка в лапах
            const fishGroup = new THREE.Group();
            const bodyGeo = new THREE.SphereGeometry(0.1, 8, 8);
            bodyGeo.scale(1, 0.6, 1.5);
            const bodyMat = new THREE.MeshToonMaterial({ color: '#3B82F6' });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            fishGroup.add(body);

            const tailGeo = new THREE.ConeGeometry(0.08, 0.15, 6);
            const tail = new THREE.Mesh(tailGeo, bodyMat);
            tail.position.z = -0.2;
            tail.rotation.x = Math.PI / 2;
            fishGroup.add(tail);

            fishGroup.position.set(0, -1.75, 0.6);
            fishGroup.rotation.z = 0.3;
            this.accessoryGroup.add(fishGroup);
        } else if (type === 'book') {
            // Книжка
            const bookGroup = new THREE.Group();
            const coverGeo = new THREE.BoxGeometry(0.2, 0.02, 0.28);
            const coverMat = new THREE.MeshToonMaterial({ color: '#7C3AED' });
            const cover = new THREE.Mesh(coverGeo, coverMat);
            bookGroup.add(cover);
            const pageGeo = new THREE.BoxGeometry(0.18, 0.01, 0.26);
            const pageMat = new THREE.MeshToonMaterial({ color: '#FEF3C7' });
            const page = new THREE.Mesh(pageGeo, pageMat);
            page.position.y = 0.02;
            bookGroup.add(page);
            bookGroup.position.set(0.3, -1.65, 0.5);
            bookGroup.rotation.z = 0.4;
            bookGroup.rotation.x = -0.2;
            this.accessoryGroup.add(bookGroup);
        } else if (type === 'particles') {
            // Звёздочки (частицы)
            for (let i = 0; i < 12; i++) {
                const starGeo = new THREE.SphereGeometry(0.03, 4, 4);
                const starMat = new THREE.MeshToonMaterial({ color: '#FBBF24' });
                const star = new THREE.Mesh(starGeo, starMat);
                star.position.set(
                    (Math.random() - 0.5) * 1.5,
                    -0.5 + Math.random() * 1.5,
                    (Math.random() - 0.5) * 1.5
                );
                star.userData = {
                    baseX: star.position.x,
                    baseY: star.position.y,
                    baseZ: star.position.z,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 1.5,
                    amplitude: 0.1 + Math.random() * 0.3
                };
                this.accessoryGroup.add(star);
                this.particles.push(star);
            }

    // ─── Взаимодействие ───────────────────────────────────────────

    setupInteraction() {
        const canvas = this.renderer.domElement;

        // Мышь
        canvas.addEventListener('mousemove', (e) => {
            if (!this._isDragging) {
                const rect = canvas.getBoundingClientRect();
                this._mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                this._mouseY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                this._targetRotX = this._mouseY * 0.5;
                this._targetRotY = this._mouseX * 0.8;
            }
        });

        canvas.addEventListener('mousedown', () => { this._isDragging = true; canvas.style.cursor = 'grabbing'; });
        canvas.addEventListener('mouseup', () => { this._isDragging = false; canvas.style.cursor = 'grab'; });
        canvas.addEventListener('mouseleave', () => {
            this._isDragging = false;
            canvas.style.cursor = 'grab';
            this._targetRotX = 0;
            this._targetRotY = 0;
        });

        // Touch
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            this._mouseX = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
            this._mouseY = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
            this._targetRotX = this._mouseY * 0.5;
            this._targetRotY = this._mouseX * 0.8;
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            this._targetRotX = 0;
            this._targetRotY = 0;
        });

        // Клик — погладить
        canvas.addEventListener('click', (e) => {
            if (!this._isDragging) {
                this.pet();
            }
        });

        // Ресайз
        window.addEventListener('resize', () => {
            if (this.isDisposed) return;
            this.width = this.container.clientWidth || 250;
            this.height = this.container.clientHeight || 250;
            this.renderer.setSize(this.width, this.height);
            this.camera.aspect = this.width / this.height;
            this.camera.updateProjectionMatrix();
        });
    }

    pet() {
        this._jumpOffset = 0.15;
        setTimeout(() => { this._jumpOffset = 0; }, 300);

        if (typeof window !== 'undefined' && window.onKittyPet) {
            window.onKittyPet();
        }
    }

    spin() {
        this._spinAngle = 0;
        const spinDuration = 800;
        const startTime = performance.now();
        const doSpin = (now) => {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / spinDuration, 1);
            this._spinAngle = progress * Math.PI * 2;
            if (progress < 1) {
                requestAnimationFrame(doSpin);
            } else {
                this._spinAngle = 0;
            }
        };
        requestAnimationFrame(doSpin);
    }

    sparkle() {
        // Искры вокруг кота
        const sparkCount = 20;
        for (let i = 0; i < sparkCount; i++) {
            const sparkGeo = new THREE.SphereGeometry(0.03, 4, 4);
            const colors = ['#FBBF24', '#F59E0B', '#EF4444', '#3B82F6', '#10B981', '#8B5CF6'];
            const sparkMat = new THREE.MeshToonMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
            const spark = new THREE.Mesh(sparkGeo, sparkMat);
            spark.position.set(
                (Math.random() - 0.5) * 2,
                -0.5 + Math.random() * 2,
                (Math.random() - 0.5) * 2
            );
            spark.userData = {
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.05,
                    0.02 + Math.random() * 0.05,
                    (Math.random() - 0.5) * 0.05
                ),
                life: 1.0,
                decay: 0.01 + Math.random() * 0.02
            };
            this.scene.add(spark);
            this._tempSparks = this._tempSparks || [];
            this._tempSparks.push(spark);
        }
    }

    // ─── Игровой цикл ─────────────────────────────────────────────

    startLoop() {
        const animate = () => {
            if (this.isDisposed) return;
            requestAnimationFrame(animate);

            const dt = Math.min(this.clock.getDelta(), 0.1);
            this.animTime += dt;

            // Вращение (плавное)
            this._currentRotX += (this._targetRotX - this._currentRotX) * 0.1;
            this._currentRotY += (this._targetRotY - this._currentRotY) * 0.1;
            this.catGroup.rotation.x = this._currentRotX * Math.PI / 6;
            this.catGroup.rotation.y = this._currentRotY * Math.PI / 4 + this._spinAngle;

            // Дыхание
            const breath = 1 + Math.sin(this.animTime * 2.1) * 0.02;
            this.catGroup.scale.setScalar(breath);

            // Прыжок
            this.catGroup.position.y = this._jumpOffset * Math.sin(Math.min(this._jumpOffset > 0 ? this.animTime * 15 : 0, Math.PI));

            // Моргание
            this._blinkTimer += dt;
            if (this._blinkTimer > this._blinkInterval && !this._isBlinking) {
                this._isBlinking = true;
                this._blinkTimer = 0;
                this._blinkInterval = 3 + Math.random() * 5;
                setTimeout(() => { this._isBlinking = false; }, 150);
            }
            const blinkScale = this._isBlinking ? 
                (Math.sin(this._blinkTimer * 25) > 0 ? 0.1 : 1) : 1;
            if (this.eyeLeft) this.eyeLeft.scale.y = blinkScale;
            if (this.eyeRight) this.eyeRight.scale.y = blinkScale;

            // Хвост
            if (this.tailGroup) {
                this._tailWave += dt * 3;
                this.tailGroup.rotation.z = Math.sin(this._tailWave) * 0.15;
                this.tailGroup.rotation.x = Math.cos(this._tailWave * 0.7) * 0.1;
            }

            // Уши
            this._earTwitchTimer += dt;
            if (this._earTwitchTimer > 6) {
                this._earTwitchTimer = 0;
                if (this.earLeft && this.earRight) {
                    const origL = this.earLeft.rotation.z;
                    const origR = this.earRight.rotation.z;
                    const twitch = () => {
                        if (this.isDisposed) return;
                        const t = (Date.now() % 300) / 300;
                        this.earLeft.rotation.z = origL + Math.sin(t * Math.PI * 4) * 0.15;
                        this.earRight.rotation.z = origR - Math.sin(t * Math.PI * 4) * 0.15;
                        if (t < 1) requestAnimationFrame(twitch);
                        else {
                            this.earLeft.rotation.z = origL;
                            this.earRight.rotation.z = origR;
                        }
                    };
                    twitch();
                }
            }

            // Частицы
            if (this.particles.length > 0) {
                this.particles.forEach(p => {
                    p.position.x = p.userData.baseX + Math.sin(this.animTime * p.userData.speed + p.userData.phase) * p.userData.amplitude;
                    p.position.y = p.userData.baseY + Math.cos(this.animTime * p.userData.speed * 0.7 + p.userData.phase) * p.userData.amplitude;
                });
            }

            // Временные искры
            if (this._tempSparks && this._tempSparks.length > 0) {
                this._tempSparks = this._tempSparks.filter(spark => {
                    spark.userData.life -= spark.userData.decay;
                    spark.material.opacity = spark.userData.life;
                    spark.material.transparent = true;
                    spark.position.add(spark.userData.velocity);
                    if (spark.userData.life <= 0) {
                        this.scene.remove(spark);
                        spark.geometry.dispose();
                        spark.material.dispose();
                        return false;
                    }
                    return true;
                });
            }

            this.renderer.render(this.scene, this.camera);
        };
        requestAnimationFrame(animate);
    }

    // ─── Применение сохранённого состояния ─────────────────────────

    applyActiveItems() {
        if (!this.state.activeItems) return;
        const { hat, glasses, skin, accessory } = this.state.activeItems;
        if (hat) this.setHat(hat);
        if (glasses) this.setGlasses(glasses);
        if (skin) this.setSkin(SKIN_TYPES[skin]?.hex || SKIN_TYPES.orange.hex);
        if (accessory) this.setAccessory(accessory);
    }

    // ─── Очистка ──────────────────────────────────────────────────

    dispose() {
        this.isDisposed = true;
        if (this.renderer) {
            this.renderer.dispose();
            this.renderer.domElement.remove();
        }
        // Очистка сцены
        if (this.scene) {
            this.scene.traverse(child => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => m.dispose());
                    } else {
                        child.material.dispose();
                    }
                }
            });
        }
    }
}

// js/components/lesson.js










const LESSON_STORAGE_KEY = STORAGE_KEY + '_lesson_progress';
let stepHistory = [];

function generateLesson(skillId, subject) {
    if (subject === 'math') return generateMathLesson(skillId);
    return generateRusLesson(skillId);
}

function saveLessonProgress() {
    if (!state.currentLesson) return;
    const progress = {
        skillId: state.lessonSkillId, subject: state.subject,
        step: state.lessonStep, tasks: state.lessonTasks,
        correct: state.lessonCorrect, wrong: state.lessonWrong,
        stepHistory: stepHistory,
        hintsRemaining: state.lessonHintsRemaining,
        hintUsed: state.lessonHintUsed
    };
    localStorage.setItem(LESSON_STORAGE_KEY, JSON.stringify(progress));
}

function loadLessonProgress() {
    const saved = localStorage.getItem(LESSON_STORAGE_KEY);
    if (!saved) return false;
    try {
        const progress = JSON.parse(saved);
        if (!progress.skillId || !progress.tasks || progress.tasks.length === 0) return false;
        state.currentLesson = progress.skillId; state.lessonSkillId = progress.skillId;
        state.lessonStep = progress.step; state.lessonTasks = progress.tasks;
        state.lessonCorrect = progress.correct; state.lessonWrong = progress.wrong;
        stepHistory = progress.stepHistory || [];
        if (progress.hintsRemaining !== undefined) state.lessonHintsRemaining = progress.hintsRemaining;
        if (progress.hintUsed !== undefined) state.lessonHintUsed = progress.hintUsed;
        return true;
    } catch (e) { return false; }
}

function clearLessonProgress() { localStorage.removeItem(LESSON_STORAGE_KEY); }

function initStepHistory() {
    const total = state.lessonTasks.length;
    stepHistory = new Array(total).fill('pending');
}

function updateProgressBar() {
    const total = state.lessonTasks.length;
    const done = state.lessonStep;
    const percent = total > 0 ? Math.round((done / total) * 100) : 0;
    const bar = $('#lessonProgressBar');
    if (bar) { bar.style.width = percent + '%'; bar.classList.toggle('complete', percent >= 100); }
}

function renderDots() {
    const container = $('#lessonSteps');
    if (!container) return;
    const total = state.lessonTasks.length;
    let html = '';
    for (let i = 0; i < total; i++) {
        let dotClass = 'lstep-dot';
        if (stepHistory[i] === 'correct') dotClass += ' done';
        else if (stepHistory[i] === 'wrong') dotClass += ' wrong';
        else if (i === state.lessonStep && stepHistory[i] === 'pending') dotClass += ' current';
        html += `<span class="${dotClass}"></span>`;
    }
    container.innerHTML = html;
}

function initLessonHints() {
    state.lessonHintsRemaining = 2;
    state.lessonHintUsed = false;
    const btn = $('#lessonHintBtn');
    if (btn) btn.classList.remove('used');
}

function useHint() {
    if (state.lessonHintsRemaining <= 0) return;
    state.lessonHintsRemaining--;
    state.lessonHintUsed = true;
    const btn = $('#lessonHintBtn');
    if (btn) {
        btn.classList.add('used');
        if (state.lessonHintsRemaining <= 0) {
            btn.textContent = '💡 0';
            btn.style.opacity = '0.4';
            btn.style.pointerEvents = 'none';
        } else {
            btn.textContent = '💡 ' + state.lessonHintsRemaining;
        }
    }
    // Показать визуальную подсказку
    const scene = $('#lessonScene');
    const task = state.lessonTasks[state.lessonStep];
    if (scene && task) {
        showHint(scene, task);
        // Штраф XP за подсказку
        const penalty = 25;
        if (state.gems >= penalty) {
            state.gems -= penalty;
            updateStats();
        }
    }
    saveLessonProgress();
}

function startLesson(skillId) {
    const saved = localStorage.getItem(LESSON_STORAGE_KEY);
    if (saved) {
        try {
            const progress = JSON.parse(saved);
            if (progress.skillId === skillId && progress.tasks && progress.tasks.length > 0) {
                const skill = getCurrentSkills().find(s => s.id === skillId);
                const skillName = skill ? skill.name : 'Неизвестно';
                const resume = confirm(`🐱 У тебя есть незавершённый урок!\n\n📚 Тема: «${skillName}»\n📍 Пройдено: ${progress.step} из ${progress.tasks.length} заданий\n✅ Верных ответов: ${progress.correct}\n\nПродолжить урок?`);
                if (resume && loadLessonProgress()) {
                    const im = state.subject === 'math';
                    $('#lessonTitle').textContent = (im ? '🧮 ' : '📝 ') + skillName;
                    $('#lessonContainer').className = 'lesson-container ' + (im ? 'math-lesson' : 'rus-lesson');
                    $('#lessonHeader').className = 'lesson-header ' + (im ? 'math-bar' : 'rus-bar');
                    $('#lessonNextBtn').className = 'lesson-next ' + (im ? 'math-next' : 'rus-next');
                    $('#btnLessonFinish').className = 'btn-lesson-finish ' + (im ? 'math-finish' : 'rus-finish');
                    // Восстановить кнопку подсказок
                    const hintBtn = $('#lessonHintBtn');
                    if (hintBtn) {
                        hintBtn.classList.toggle('used', state.lessonHintsRemaining <= 0);
                        hintBtn.textContent = '💡 ' + state.lessonHintsRemaining;
                        hintBtn.style.opacity = state.lessonHintsRemaining <= 0 ? '0.4' : '1';
                        hintBtn.style.pointerEvents = state.lessonHintsRemaining <= 0 ? 'none' : 'auto';
                    }
                    updateDifficultyBadge();
                    updateProgressBar(); renderDots();
                    $('#lessonOverlay').classList.add('active');
                    $('#lessonNextBtn').classList.remove('show');
                    $('#lessonFinishBlock').classList.remove('show');
                    $('#lessonScene').style.display = 'flex';
                    renderLessonStep();
                    return;
                }
            }
        } catch (e) {}
        clearLessonProgress();
    }

    const im = state.subject === 'math';
    initLessonHints();
    state.currentLesson = skillId; state.lessonSkillId = skillId;
    state.lessonStep = 0; state.lessonCorrect = 0; state.lessonWrong = 0;
    state.lessonTasks = generateLesson(skillId, state.subject);
    initStepHistory();

    const skill = getCurrentSkills().find(s => s.id === skillId);
    $('#lessonTitle').textContent = (im ? '🧮 ' : '📝 ') + (skill ? skill.name : 'Урок');
    $('#lessonContainer').className = 'lesson-container ' + (im ? 'math-lesson' : 'rus-lesson');
    $('#lessonHeader').className = 'lesson-header ' + (im ? 'math-bar' : 'rus-bar');
    $('#lessonNextBtn').className = 'lesson-next ' + (im ? 'math-next' : 'rus-next');
    $('#btnLessonFinish').className = 'btn-lesson-finish ' + (im ? 'math-finish' : 'rus-finish');

    updateProgressBar(); renderDots();
    $('#lessonOverlay').classList.add('active');
    $('#lessonNextBtn').classList.remove('show');
    $('#lessonFinishBlock').classList.remove('show');
    $('#lessonScene').style.display = 'flex';
    // Активировать кнопку подсказок
    const hintBtn = $('#lessonHintBtn');
    if (hintBtn) {
        hintBtn.classList.remove('used');
        hintBtn.textContent = '💡 ' + state.lessonHintsRemaining;
        hintBtn.style.opacity = '1';
        hintBtn.style.pointerEvents = 'auto';
    }
    updateDifficultyBadge();
    saveLessonProgress();
    renderLessonStep();
}

// ─── Индикатор уровня сложности ───────────────────────────
function updateDifficultyBadge() {
    const badge = $('#difficultyBadge');
    if (!badge) return;
    const lvl = state.difficultyLevel;
    const stars = '⭐'.repeat(Math.min(lvl, 5));
    badge.textContent = (lvl > 5 ? `🔥 ` : '') + stars + ' ' + lvl;
    badge.classList.add('level-up');
    setTimeout(() => badge.classList.remove('level-up'), 600);
}

async function closeLesson() {
    $('#lessonOverlay').classList.remove('active');
    state.currentLesson = null; state.lessonTasks = []; stepHistory = [];
    renderSkillTree();
    checkAchievements((name, desc) => showAchievementToast(name, desc));
    updateTrapsBadge();
    saveState();
}

function unlockNext(currentSkill) {
    const skills = getCurrentSkills();
    const ci = skills.findIndex(s => s.id === currentSkill.id);
    if (ci >= 0 && ci + 1 < skills.length && skills[ci + 1].status === 'locked') {
        skills[ci + 1].status = 'current';
        showToast('🔓', 'Новый навык открыт!', $('#toast'));
        spawnLeaves();
    }
}

async function renderLessonStep() {
    const task = state.lessonTasks[state.lessonStep];
    if (!task) { finishLesson(); return; }

    $('#lessonNextBtn').classList.remove('show');
    $('#lessonFinishBlock').classList.remove('show');
    const scene = $('#lessonScene');

    if (scene.children.length > 0) {
        scene.classList.add('task-transition');
        await new Promise(r => setTimeout(r, 200));
        scene.classList.remove('task-transition');
    }
    scene.style.display = 'flex';
    scene.style.animation = 'none'; scene.offsetHeight; scene.style.animation = '';

    const result = await renderTask(scene, task, { isBonus: false });

    if (state.lessonStep < stepHistory.length) {
        stepHistory[state.lessonStep] = result.isCorrect ? 'correct' : 'wrong';
    }

    if (result.isCorrect) { state.lessonCorrect++; }
    else { state.lessonWrong++; addLessonTrap(task); }

    renderDots(); updateProgressBar(); saveLessonProgress();
    setTimeout(() => $('#lessonNextBtn').classList.add('show'), 1000);
    scene.scrollTop = 0;
}

function addLessonTrap(task) {
    const id = 'lesson_' + state.lessonSkillId + '_' + Date.now();
    state.traps.push({
        id, question: task.question, options: task.options || null,
        correct: task.correctIdx ?? null, answer: task.correctAns,
        explanation: task.explanation,
        source: 'Урок: ' + ($('#lessonTitle')?.textContent || 'Неизвестно'),
        defuses: 0, nextDate: new Date().toISOString(),
        isInput: task.type === 'input' || (task.type && task.type.startsWith('boss')),
        subject: state.subject
    });
    unlockAchievement('firstBlood', (n, d) => showAchievementToast(n, d));
    saveState();
}

function nextLessonStep() {
    state.lessonStep++;
    if (state.lessonStep >= state.lessonTasks.length) { finishLesson(); }
    else { saveLessonProgress(); renderDots(); updateProgressBar(); renderLessonStep(); $('#lessonScene').scrollTop = 0; }
}

function finishLesson() {
    clearLessonProgress();
    $('#lessonScene').style.display = 'none';
    $('#lessonNextBtn').classList.remove('show');
    $('#lessonFinishBlock').classList.add('show');

    const c = state.lessonCorrect, w = state.lessonWrong;
    $('#lfinishCorrect').textContent = c; $('#lfinishWrong').textContent = w;
    const totalTasks = state.lessonTasks.length;
    const xp = c * GEMS.LESSON_XP_PER_CORRECT + (w === 0 ? GEMS.LESSON_PERFECT_BONUS : 0);
    $('#lfinishXP').textContent = '+' + xp + ' 💎';

    if (w === 0) {
        $('#lfinishTitle').textContent = 'Идеально! 🌟';
        $('#lfinishSubtitle').textContent = 'Навык пройден!';
    } else {
        $('#lfinishTitle').textContent = 'Урок пройден!';
        $('#lfinishSubtitle').textContent = `${c}/${c + w} верно. Ошибки → 🪤`;
    }

    state.gems += xp; updateStats();
    
    // Всплывающие +XP
    const finishBlock = $('#lessonFinishBlock');
    if (finishBlock) {
        const rect = finishBlock.getBoundingClientRect();
        spawnXP(xp, rect.left + rect.width / 2 - 20, rect.top + 40);
    }
    
    // Lottie галочка при идеальном прохождении
    if (w === 0) {
        const lottieWrap = document.createElement('div');
        lottieWrap.className = 'lottie-container lottie-fade';
        document.body.appendChild(lottieWrap);
        playLottie(lottieWrap, 'https://assets10.lottiefiles.com/packages/lf20_jbrw3hcz.json');
        setTimeout(() => lottieWrap.remove(), 2500);
    }
    
    unlockAchievement('student', (n, d) => showAchievementToast(n, d));
    if (w === 0) unlockAchievement('master', (n, d) => showAchievementToast(n, d));
    playSound(w === 0 ? 'achievement' : 'correct', state.theme);

    const skill = getCurrentSkills().find(s => s.id === state.lessonSkillId);
    if (skill) {
        const ratio = c / totalTasks;
        const np = Math.min(100, skill.progress + Math.round(ratio * 100));
        skill.progress = np;
        if (np >= SKILL.PROGRESS_TO_COMPLETE) { skill.status = 'completed'; unlockNext(skill); }
    }

    // Adaptive difficulty
    const lessonRatio = c / totalTasks;
    const oldLevel = state.difficultyLevel;
    if (w === 0 && oldLevel < 10) {
        state.difficultyLevel++;
        showToast('📈', `Сложность повышена до уровня ${state.difficultyLevel}!`, $('#toast'));
    } else if (lessonRatio < 0.5 && oldLevel > 0) {
        state.difficultyLevel--;
        showToast('📉', `Сложность снижена до уровня ${state.difficultyLevel}`, $('#toast'));
    }
    updateDifficultyBadge();

    updateProgressBar();
    const catSpeech = $('#catSpeech');
    if (catSpeech) catSpeech.textContent = w === 0 ? CAT_SPEECH.lessonPerfect : CAT_SPEECH.lessonDone;

    stepHistory = []; updateTrapsBadge(); saveState();
    state.currentLesson = null; state.lessonTasks = [];
    renderSkillTree();
}

function checkSavedLesson() {
    const saved = localStorage.getItem(LESSON_STORAGE_KEY);
    if (!saved) return false;
    try {
        const progress = JSON.parse(saved);
        if (!progress.skillId || !progress.tasks || progress.tasks.length === 0) { clearLessonProgress(); return false; }
        const skill = getCurrentSkills().find(s => s.id === progress.skillId);
        const skillName = skill ? skill.name : 'Неизвестно';
        const resume = confirm(`🐱 У тебя есть незавершённый урок!\n\n📚 Тема: «${skillName}»\n📍 Пройдено: ${progress.step} из ${progress.tasks.length} заданий\n✅ Верных ответов: ${progress.correct}\n\nПродолжить урок?`);
        if (resume && loadLessonProgress()) {
            const im = state.subject === 'math';
            $('#lessonTitle').textContent = (im ? '🧮 ' : '📝 ') + skillName;
            $('#lessonContainer').className = 'lesson-container ' + (im ? 'math-lesson' : 'rus-lesson');
            $('#lessonHeader').className = 'lesson-header ' + (im ? 'math-bar' : 'rus-bar');
            $('#lessonNextBtn').className = 'lesson-next ' + (im ? 'math-next' : 'rus-next');
            $('#btnLessonFinish').className = 'btn-lesson-finish ' + (im ? 'math-finish' : 'rus-finish');
            updateProgressBar(); renderDots();
            $('#lessonOverlay').classList.add('active');
            $('#lessonNextBtn').classList.remove('show');
            $('#lessonFinishBlock').classList.remove('show');
            $('#lessonScene').style.display = 'flex';
            renderLessonStep();
            return true;
        }
    } catch (e) {}
    clearLessonProgress();
    return false;
}

function startStory(id) {
    const scr = storySrc[Object.keys(storySrc).find(k => storySrc[k].id === id)];

    const im = scr.subj === SUBJECTS.MATH;

function closeStory() {
    $('#storyOverlay').classList.remove('active');
    state.currentStory = null;
    checkAchievements((n, d) => showAchievementToast(n, d));
    updateTrapsBadge();
}

async function renderStoryStep() {
    const scr = storySrc[Object.keys(storySrc).find(k => storySrc[k].id === state.currentStory)];
    const step = scr.scenes[state.storyStep];
    if (!step) { finishStory(); return; }

    $('#storyNextBtn').classList.remove('show');
    $('#storyFinishBlock2').classList.remove('show');
    $('#storyScene').style.display = 'flex';
    state.storyAnswered = false;

    let html = `<div class="scene-emoji">${step.emoji}</div><div class="scene-speaker">${step.speaker}</div><div class="scene-text">${step.text}</div>`;
    if (step.type === 'dialogue') {
        $('#storyScene').innerHTML = html;
        setTimeout(() => $('#storyNextBtn').classList.add('show'), 500);
    } else {
        $('#storyScene').innerHTML = html;
        const taskBox = document.createElement('div');
        taskBox.className = 'story-task-box';
        const taskLabel = document.createElement('div');
        taskLabel.className = 'task-label';
        taskLabel.textContent = step.question || 'Твоё решение:';
        taskBox.appendChild(taskLabel);
        $('#storyScene').appendChild(taskBox);

        // Создаём задание с correctAns вместо correctIdx
        const task = {
            type: step.type,
            question: step.question,
            options: step.options,
            correctAns: step.correctAns,
            explanation: step.explanation
        };
        if (step.type === 'input') {
            task.correctAns = step.correctAns;
        }

        const result = await renderTask(taskBox, task, { compact: true });
        state.storyAnswered = true;

        if (result.isCorrect) {
            state.gems += GEMS.CORRECT_ANSWER;
            updateStats();
            setTimeout(() => $('#storyNextBtn').classList.add('show'), 1000);
        } else {
            if (step.trapId) addStoryTrap(step, scr.title);
            showToast('🤔', 'Ошибка → Ловушки!', $('#toast'));
            setTimeout(() => $('#storyNextBtn').classList.add('show'), 1800);
        }
    }
    updateStorySteps();
    $('#storyScene').scrollTop = 0;
}

function addStoryTrap(step, src) {
    if (!step.trapId || state.traps.find(t => t.id === step.trapId)) return;
    state.traps.push({
        id: step.trapId,
        question: step.question,
        options: step.options || null,
        correct: step.options ? step.options.indexOf(step.correctAns) : null,
        answer: step.correctAns || null,
        explanation: step.explanation,
        source: src,
        defuses: 0,
        nextDate: new Date().toISOString(),
        isInput: step.type === 'input',
        subject: state.currentStory.startsWith('rus') ? SUBJECTS.RUSSIAN : SUBJECTS.MATH
    });
    unlockAchievement('firstBlood', (n, d) => showAchievementToast(n, d));
    saveState();
}

function updateStorySteps() {
    const dots = $('#storySteps').querySelectorAll('.step-dot');
    dots.forEach((d, i) => {
        d.classList.remove('done', 'current');
        if (i < state.storyStep) d.classList.add('done');
        else if (i === state.storyStep) d.classList.add('current');
    });
}

function nextStoryStep() {
    const scr = storySrc[Object.keys(storySrc).find(k => storySrc[k].id === state.currentStory)];
    state.storyStep++;
    if (state.storyStep >= scr.scenes.length) finishStory();
    else { renderStoryStep(); $('#storyScene').scrollTop = 0; }
}

function finishStory() {
    $('#storyScene').style.display = 'none';
    $('#storyNextBtn').classList.remove('show');
    $('#storyFinishBlock2').classList.add('show');
    state.storiesCompleted[state.currentStory] = true;

    $('#finishSubtitle').textContent = im ? 'Торт найден!' : 'Ты герой! 📚';
    state.gems += im ? GEMS.STORY_MATH_REWARD : GEMS.STORY_RUS_REWARD;
    updateStats();
    $$('#storySteps .step-dot').forEach(d => { d.classList.add('done'); d.classList.remove('current'); });
    const catSpeech = $('#catSpeech');
    if (catSpeech) catSpeech.textContent = CAT_SPEECH.storyDone;
    checkAchievements((n, d) => showAchievementToast(n, d));
    updateTrapsBadge();
    saveState();
}

    html += `
        <div class="lesson-explanation" id="tqExpl"></div>
        <button class="panel-close" id="tqClose" style="margin-top:12px;">Закрыть</button>`;
    
    $('#trapQuizCard').innerHTML = html;
    $('#trapQuizOverlay').classList.add('active');

    const expl = $('#tqExpl');
    let done = false;

    const success = () => {
        trap.defuses++;
        
        const reward = GEMS.TRAP_BASE_REWARD + trap.defuses * GEMS.TRAP_DEFUSE_MULTIPLIER;
        state.gems += reward;
        updateStats();

        if (trap.defuses === 1 && trap.id && trap.id.startsWith('lesson_')) {
            const parts = trap.id.split('_');
            if (parts.length >= 2) {
                const skillId = parts[1];
                let skill = state.skills.math.find(s => s.id === skillId) || state.skills.russian.find(s => s.id === skillId);
                if (skill && skill.status === 'current' && skill.progress < 100) {
                    const allTraps = state.traps.filter(t => t.id && t.id.startsWith('lesson_' + skillId + '_'));
                    const defusedCount = allTraps.filter(t => t.defuses >= 1).length;
                    const totalTraps = allTraps.length;
                    const remaining = 100 - skill.progress;
                    const remainingTraps = totalTraps - defusedCount + 1;
                    const progressForThis = Math.min(20, Math.ceil(remaining / remainingTraps));
                    skill.progress = Math.min(100, skill.progress + progressForThis);
                    if (skill.progress >= 100) {
                        skill.status = 'completed';
                        const subject = trap.subject || state.subject;
                        const skills = state.skills[subject];
                        const ci = skills.findIndex(s => s.id === skillId);
                        if (ci >= 0 && ci + 1 < skills.length && skills[ci + 1].status === 'locked') {
                            skills[ci + 1].status = 'current';
                            showToast('🔓', 'Новый навык открыт через ловушки!', $('#toast'));
                            spawnLeaves();
                        }
                    }
                    saveState();
                    renderSkillTree();
                }
            }
        }

        showToast(
            trap.defuses >= TRAP.MAX_DEFUSES ? '🏆' : '✅',
            trap.defuses >= TRAP.MAX_DEFUSES ? 'Ловушка разобрана!' : `+${reward} 💎`,
            $('#toast')
        );
        checkAchievements((n, d) => showAchievementToast(n, d));
        updateTrapsBadge();
        renderTrapsPanel();
        saveState();
        setTimeout(() => $('#trapQuizOverlay').classList.remove('active'), 600);
    };

    if (trap.isInput) {
        const inp = $('#tqInp');
        const btn = $('#tqSub');
        const submit = () => {
            if (done) return;
            done = true;
            btn.disabled = true;
            inp.disabled = true;
            if (inp.value.trim().toLowerCase() === String(trap.answer).toLowerCase()) {
                inp.style.borderColor = 'var(--green)';
                inp.style.background = 'rgba(16,185,129,0.2)';
                expl.innerHTML = `<div style="font-size:24px;margin-bottom:4px;">${catEmoji}</div><div>«Отлично! А знаешь почему?»</div><div style="margin-top:6px;font-weight:700;">✅ ${trap.explanation}</div>`;
                expl.className = 'lesson-explanation show good';
                success();
            } else {
                inp.style.borderColor = 'var(--red)';
                inp.style.background = 'rgba(239,68,68,0.15)';
                expl.innerHTML = `<div style="font-size:24px;margin-bottom:4px;">${catEmoji}</div><div>«Вот тут подвох! Смотри…»</div><div style="margin-top:6px;font-weight:700;">🤔 ${trap.explanation}</div><div style="margin-top:4px;">✅ Правильный ответ: ${trap.answer}</div>`;
                expl.className = 'lesson-explanation show bad';
            }
        };
        btn.addEventListener('click', submit);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
        setTimeout(() => inp.focus(), 300);
    } else {
        const opts = $$('#tqOpts .task-option');
        opts.forEach(o => o.addEventListener('click', () => {
            if (done) return;
            done = true;
            opts.forEach(x => x.style.pointerEvents = 'none');
            const idx = parseInt(o.dataset.idx);
            if (idx === trap.correct) {
                o.classList.add('correct-pick');
                expl.innerHTML = `<div style="font-size:24px;margin-bottom:4px;">${catEmoji}</div><div>«Отлично! А знаешь почему?»</div><div style="margin-top:6px;font-weight:700;">✅ ${trap.explanation}</div>`;
                expl.className = 'lesson-explanation show good';
                success();
            } else {
                o.classList.add('wrong-pick');
                opts[trap.correct].classList.add('correct-pick');
                expl.innerHTML = `<div style="font-size:24px;margin-bottom:4px;">${catEmoji}</div><div>«Вот тут подвох! Смотри…»</div><div style="margin-top:6px;font-weight:700;">🤔 ${trap.explanation}</div>`;
                expl.className = 'lesson-explanation show bad';
            }
        }));
    }
    $('#tqClose').addEventListener('click', () => {
        $('#trapQuizOverlay').classList.remove('active');
        updateTrapsBadge();
        renderTrapsPanel();
    });
}

document.addEventListener('DOMContentLoaded', () => {
    const overlay = $('#trapQuizOverlay');
    if (overlay) {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('active');
                updateTrapsBadge();
                renderTrapsPanel();
            }
        });
    }
});

/**
 * Рендерит секцию магазина для категории предметов
 */
function renderShopSection(icon, title, category, items) {
    const activeKey = state.activeItems[category] || 
        (category === 'hats' ? 'none' : category === 'glasses' ? 'none' : category === 'skins' ? 'orange' : 'none');
    
    let html = `
    <div class="profile-section">
        <div class="profile-section-title">
            <span>${icon}</span> ${title}
        </div>
        <div class="shop-grid">`;

    Object.entries(items).forEach(([key, item]) => {
        const owned = state.ownedItems[category].includes(key);
        const active = activeKey === key;
        const canBuy = !owned && state.gems >= item.price;
        const showPrice = !owned && item.price > 0;

        html += `
        <div class="shop-item ${active ? 'shop-active' : ''} ${!owned ? 'shop-buyable' : 'shop-owned'}"
             data-category="${category}"
             data-key="${key}"
             data-owned="${owned ? '1' : '0'}"
             data-active="${active ? '1' : '0'}"
             data-price="${item.price}">
            <div class="shop-item-emoji">${item.emoji}</div>
            <div class="shop-item-name">${item.name}</div>
            ${active ? '<div class="shop-item-badge">✅</div>' : ''}
            ${showPrice ? `<div class="shop-item-price">💎 ${item.price}</div>` : ''}
            ${owned && !active ? '<div class="shop-item-badge">✔️</div>' : ''}
        </div>`;
    });

    html += `
        </div>
    </div>`;
    return html;
}

/**
 * Экипировать предмет (обновить state, кота, магазин)
 */
function equipItem(category, itemKey) {
    const catMap = {
        hats: 'hat',
        glasses: 'glasses',
        skins: 'skin',
        accessories: 'accessory'
    };
    const activeKey = catMap[category];

    state.activeItems[activeKey] = itemKey;
    saveState();

    // Обновить 3D-кота
    if (cat3d) {
        switch (category) {
            case 'hats': cat3d.setHat(itemKey); break;
            case 'glasses': cat3d.setGlasses(itemKey); break;
            case 'skins': cat3d.setSkin(SKIN_TYPES[itemKey]?.hex || '#F59E0B'); break;
            case 'accessories': cat3d.setAccessory(itemKey); break;
        }
    }

    // Анимация
    if (cat3d) {
        cat3d.sparkle();
    }

    // Показать тост
    const typeMap = { hats: HAT_TYPES, glasses: GLASSES_TYPES, skins: SKIN_TYPES, accessories: ACCESSORY_TYPES };
    const item = typeMap[category]?.[itemKey];
    if (item) {
        showToast(item.emoji, `${item.name} надето!`, $('#toast'));
    }

    // Перерисовать магазин (обновить active/owned метки)
    refreshShopUI(category);
}

/**
 * Обновить UI магазина после покупки/экипировки
 */
function refreshShopUI(changedCategory) {
    // Обновляем data-атрибуты у всех shop-item
    $$('.shop-item').forEach(item => {
        const category = item.dataset.category;
        const key = item.dataset.key;
        item.dataset.owned = state.ownedItems[category].includes(key) ? '1' : '0';
        
        const catMap = { hats: 'hat', glasses: 'glasses', skins: 'skin', accessories: 'accessory' };
        const activeKey = catMap[category];
        const isActive = state.activeItems[activeKey] === key;
        item.dataset.active = isActive ? '1' : '0';

        // Обновить классы
        item.classList.remove('shop-active', 'shop-owned', 'shop-buyable');
        if (isActive) {
            item.classList.add('shop-active');
        } else if (item.dataset.owned === '1') {
            item.classList.add('shop-owned');
        } else {
            item.classList.add('shop-buyable');
        }

        // Обновить бейджи
        const existingBadge = item.querySelector('.shop-item-badge');
        if (existingBadge) existingBadge.remove();

        if (isActive) {
            const badge = document.createElement('div');
            badge.className = 'shop-item-badge';
            badge.textContent = '✅';
            item.appendChild(badge);
        } else if (item.dataset.owned === '1') {
            const badge = document.createElement('div');
            badge.className = 'shop-item-badge';
            badge.textContent = '✔️';
            item.appendChild(badge);
        }

        // Обновить/убрать цену
        const existingPrice = item.querySelector('.shop-item-price');
        const price = parseInt(item.dataset.price);
        if (item.dataset.owned === '1') {
            if (existingPrice) existingPrice.remove();
        } else if (price > 0 && !existingPrice) {
            const priceEl = document.createElement('div');
            priceEl.className = 'shop-item-price';
            priceEl.textContent = '💎 ' + price;
            item.appendChild(priceEl);
        }
    });
}

// js/app.js










function updateStats() {
    const oldGems = parseInt($('#gemCount').textContent) || state.gems;
    $('#gemCount').textContent = state.gems;
    $('#streakCount').textContent = state.streak;
    
    // Огонёк при streak >= 7
    const streakEl = $('#streakCount');
    if (streakEl) {
        if (state.streak >= 7) {
            streakEl.classList.add('streak-fire');
        } else {
            streakEl.classList.remove('streak-fire');
        }
    }
    
    // Гемы летят
    if (state.gems > oldGems) {
        const diff = state.gems - oldGems;
        const gemEl = $('#gemCount');
        if (gemEl && diff > 0) {
            const rect = gemEl.getBoundingClientRect();
            spawnGems(Math.min(diff, 5), rect.left, rect.top - 30, gemEl);
        }
    }
}

function showAchievementToast(name, desc) {
    const toast = document.getElementById('achToast');
    const text = document.getElementById('achToastText');
    if (!toast || !text) return;
    text.textContent = name + ' — ' + desc;
    toast.classList.add('show');
    
    // Lottie медаль
    const lottieWrap = document.createElement('div');
    lottieWrap.className = 'lottie-container lottie-small lottie-fade';
    document.body.appendChild(lottieWrap);
    playLottie(lottieWrap, 'https://assets2.lottiefiles.com/packages/lf20_touohxv0.json');
    setTimeout(() => lottieWrap.remove(), 2500);
    
    setTimeout(() => toast.classList.remove('show'), 3500);
}

        happy: '😺',

        sad: '😿',
        wow: '🙀',

        const t = getTheme(state.theme);

            state.subjectSwitches++;
            if (state.subjectSwitches >= 5) unlockAchievement('erudite', (n, d) => showAchievementToast(n, d));
            updateSubjectUI();
            renderSkillTree();
            updateTrapsBadge();
            saveState();
        }
    });

    const setActiveNav = (btn) => { $$('.nav-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); };

    $('#navHome').addEventListener('click', () => setActiveNav($('#navHome')));
    $('#navStories').addEventListener('click', () => { setActiveNav($('#navStories')); openStoryPanel(); });
    $('#navTraps').addEventListener('click', () => { setActiveNav($('#navTraps')); renderTrapsPanel(); $('#trapsPanel').classList.add('active'); });
    $('#navProfile').addEventListener('click', () => { setActiveNav($('#navProfile')); renderProfile(); $('#profilePanel').classList.add('active'); });

    $('#btnStoryPanelClose').addEventListener('click', () => $('#storyPanel').classList.remove('active'));
    $('#btnTrapsPanelClose').addEventListener('click', () => $('#trapsPanel').classList.remove('active'));
    $('#btnProfilePanelClose').addEventListener('click', () => $('#profilePanel').classList.remove('active'));

    $('#trapQuizOverlay').addEventListener('click', e => { if (e.target === $('#trapQuizOverlay')) { $('#trapQuizOverlay').classList.remove('active'); updateTrapsBadge(); renderTrapsPanel(); } });

    $('#lessonCloseBtn').addEventListener('click', closeLesson);
    $('#lessonNextBtn').addEventListener('click', nextLessonStep);
    $('#btnLessonFinish').addEventListener('click', closeLesson);

    $('#storyNextBtn').addEventListener('click', nextStoryStep);
    $('#storyCloseBtn').addEventListener('click', closeStory);
    $('#btnFinishStory').addEventListener('click', closeStory);

    // Селектор классов
    $$('#classSelector .class-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const cls = btn.dataset.class;
            if (cls) switchClass(cls);
        });
    });
}

function updateDailyStreak() {
    const today = new Date().toDateString();
    const lastVisit = localStorage.getItem('kot_ucheniy_last_visit');
    
    if (!lastVisit) {
        // Первый визит
        state.streak = 1;
    } else if (lastVisit === today) {
        // Уже заходил сегодня — ничего не делаем
        return;
    } else {
        const lastDate = new Date(lastVisit);
        const diffDays = Math.floor((new Date() - lastDate) / 86400000);
        
        if (diffDays === 1) {
            // Заходил вчера — увеличиваем streak
            state.streak++;
        } else {
            // Пропустил день — сброс
            state.streak = 1;
        }
    }
    
    localStorage.setItem('kot_ucheniy_last_visit', today);
    saveState();
    updateStats();
    
    if (state.streak >= 7) {
        showAchievementToast('🔥 Ударный режим!', `${state.streak} дней подряд!`);
    }
}

function init() {
    loadState();
    // Применяем тему
    applyTheme(state.theme || 'light');
    // Проверяем разблокировку тем
    checkThemeUnlocks();
    // Ежедневный streak
    updateDailyStreak();
    // Приветственное мяу
    setTimeout(() => playSound('meow', state.theme), 500);
    updateSubjectUI();
    renderSkillTree();
    updateTrapsBadge();
    updateStats();
    setupCatPet();
    bindEvents();
    startTutorial();
    setTimeout(() => checkSavedLesson(), 500);
    console.log('🐱 v15 — готов к мурчанию!');
}

document.addEventListener('DOMContentLoaded', init);
</script>
    
</body>
