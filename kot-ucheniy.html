function updateTrapsBadge() {
    const badge = $('#trapsBadge');
    if (!badge) return;
    const a = getAvailableTraps().length;
    if (a > 0) { badge.style.display = 'flex'; badge.textContent = a; }
    else { badge.style.display = 'none'; }
}

function renderTrapsPanel() {
    const av = getAvailableTraps();
    const de = getDefusedTraps();
    
    let html = '';
    
    if (!av.length && !de.length) {
        html = `
            <div style="text-align:center;padding:40px 20px;">
                <div style="font-size:56px;margin-bottom:16px;">🏆</div>
                <div style="font-weight:800;font-size:16px;color:var(--text);margin-bottom:8px;">Ловушек нет!</div>
                <div style="color:var(--text-light);font-size:13px;line-height:1.5;">Ошибайся в уроках —<br>ловушки появятся здесь</div>
            </div>`;
    } else {
        if (av.length) {
            html += '<div style="font-weight:800;color:var(--red);margin-bottom:10px;display:flex;align-items:center;gap:6px;font-size:14px;"><span style="font-size:18px;">🔴</span> Нужно разобрать (' + av.length + ')</div>';
            av.forEach(t => {
                const subjEmoji = t.subject === 'math' ? '🧮' : '📝';
                html += `
                <div class="trap-item danger" data-id="${t.id}">
                    <div class="trap-icon">🪤</div>
                    <div class="trap-info">
                        <div class="trap-name">${t.question}</div>
                        <div class="trap-source">${subjEmoji} ${t.source}</div>
                    </div>
                    <span class="trap-status status-danger">Разобрать</span>
                </div>`;
            });
        }
        
        if (de.length) {
            html += '<div style="font-weight:800;color:var(--green);margin:16px 0 10px;display:flex;align-items:center;gap:6px;font-size:14px;"><span style="font-size:18px;">🟢</span> Разобраны (' + de.length + ')</div>';
            de.forEach(t => {
                const subjEmoji = t.subject === 'math' ? '🧮' : '📝';
                html += `
                <div class="trap-item defused">
                    <div class="trap-icon">✅</div>
                    <div class="trap-info">
                        <div class="trap-name">${t.question}</div>
                        <div class="trap-source">${subjEmoji} ${t.source}</div>
                    </div>
                    <span class="trap-status status-defused">Готово</span>
                </div>`;
            });
        }
    }
    
    $('#trapsList').innerHTML = html;
    $('#trapsSubtitle').textContent = av.length ? `${av.length} ловушка(и) ждёт разбора` : 'Все ловушки разобраны!';
    
    $$('#trapsList .trap-item.danger').forEach(el => {
        el.addEventListener('click', () => {
            const t = state.traps.find(x => x.id === el.dataset.id);
            if (t) openTrapQuiz(t);
        });
    });
}

function openTrapQuiz(trap) {
    const catEmoji = state.theme === 'forest' ? '🦊' : state.theme === 'space' ? '🚀' : state.theme === 'underwater' ? '🐙' : '🐱';
    
    let html = `
        <div style="text-align:center;margin-bottom:12px;">
            <div style="font-size:40px;margin-bottom:4px;">${catEmoji}</div>
            <div style="font-weight:800;font-size:14px;color:var(--text);">Кот-Учёный</div>
            <div style="font-size:12px;color:var(--text-light);margin-bottom:12px;">«Ой, тут мы ошиблись! Давай разберёмся вместе…»</div>
        </div>
        <div style="text-align:center;font-weight:700;font-size:13px;color:var(--text);margin-bottom:16px;line-height:1.5;padding:12px;background:var(--bg);border-radius:12px;border:1px solid var(--text-light);">
            ${trap.question}
        </div>`;
    
    if (trap.isInput) {
        html += `
            <div class="task-input-row">
                <input type="text" class="task-input" id="tqInp" placeholder="Ответ" autocomplete="off" style="color:var(--text);background:var(--bg);border-color:var(--text-light);">
                <button class="btn-submit" id="tqSub">✓</button>
            </div>`;
    } else {
        html += `<div class="task-options" id="tqOpts">`;
        trap.options.forEach((o, i) => {
            html += `<button class="task-option" data-idx="${i}" style="color:var(--text);border-color:var(--text-light);">${o}</button>`;
        });
        html += `</div>`;
    }
    
    html += `
        <div class="lesson-explanation" id="tqExpl"></div>
        <button class="panel-close" id="tqClose" style="margin-top:12px;">Закрыть</button>`;
    
    $('#trapQuizCard').innerHTML = html;
    $('#trapQuizOverlay').classList.add('active');

    const expl = $('#tqExpl');
    let done = false;

    const success = () => {
        trap.defuses++;
        
        const reward = GEMS.TRAP_BASE_REWARD + trap.defuses * GEMS.TRAP_DEFUSE_MULTIPLIER;
        state.gems += reward;
        updateStats();

        if (trap.defuses === 1 && trap.id && trap.id.startsWith('lesson_')) {
            const parts = trap.id.split('_');
            if (parts.length >= 2) {
                const skillId = parts[1];
                let skill = state.skills.math.find(s => s.id === skillId) || state.skills.russian.find(s => s.id === skillId);
                if (skill && skill.status === 'current' && skill.progress < 100) {
                    const allTraps = state.traps.filter(t => t.id && t.id.startsWith('lesson_' + skillId + '_'));
                    const defusedCount = allTraps.filter(t => t.defuses >= 1).length;
                    const totalTraps = allTraps.length;
                    const remaining = 100 - skill.progress;
                    const remainingTraps = totalTraps - defusedCount + 1;
                    const progressForThis = Math.min(20, Math.ceil(remaining / remainingTraps));
                    skill.progress = Math.min(100, skill.progress + progressForThis);
                    if (skill.progress >= 100) {
                        skill.status = 'completed';
                        const subject = trap.subject || state.subject;
                        const skills = state.skills[subject];
                        const ci = skills.findIndex(s => s.id === skillId);
                        if (ci >= 0 && ci + 1 < skills.length && skills[ci + 1].status === 'locked') {
                            skills[ci + 1].status = 'current';
                            showToast('🔓', 'Новый навык открыт через ловушки!', $('#toast'));
                            spawnLeaves();
                        }
                    }
                    saveState();
                    renderSkillTree();
                }
            }
        }

        showToast(
            trap.defuses >= TRAP.MAX_DEFUSES ? '🏆' : '✅',
            trap.defuses >= TRAP.MAX_DEFUSES ? 'Ловушка разобрана!' : `+${reward} 💎`,
            $('#toast')
        );
        checkAchievements((n, d) => showAchievementToast(n, d));
        updateTrapsBadge();
        renderTrapsPanel();
        saveState();
        setTimeout(() => $('#trapQuizOverlay').classList.remove('active'), 600);
    };

    if (trap.isInput) {
        const inp = $('#tqInp');
        const btn = $('#tqSub');
        const submit = () => {
            if (done) return;
            done = true;
            btn.disabled = true;
            inp.disabled = true;
            if (inp.value.trim().toLowerCase() === String(trap.answer).toLowerCase()) {
                inp.style.borderColor = 'var(--green)';
                inp.style.background = 'rgba(16,185,129,0.2)';
                expl.innerHTML = `<div style="font-size:24px;margin-bottom:4px;">${catEmoji}</div><div>«Отлично! А знаешь почему?»</div><div style="margin-top:6px;font-weight:700;">✅ ${trap.explanation}</div>`;
                expl.className = 'lesson-explanation show good';
                success();
            } else {
                inp.style.borderColor = 'var(--red)';
                inp.style.background = 'rgba(239,68,68,0.15)';
                expl.innerHTML = `<div style="font-size:24px;margin-bottom:4px;">${catEmoji}</div><div>«Вот тут подвох! Смотри…»</div><div style="margin-top:6px;font-weight:700;">🤔 ${trap.explanation}</div><div style="margin-top:4px;">✅ Правильный ответ: ${trap.answer}</div>`;
                expl.className = 'lesson-explanation show bad';
            }
        };
        btn.addEventListener('click', submit);
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
        setTimeout(() => inp.focus(), 300);
    } else {
        const opts = $$('#tqOpts .task-option');
        opts.forEach(o => o.addEventListener('click', () => {
            if (done) return;
            done = true;
            opts.forEach(x => x.style.pointerEvents = 'none');
            const idx = parseInt(o.dataset.idx);
            if (idx === trap.correct) {
                o.classList.add('correct-pick');
                expl.innerHTML = `<div style="font-size:24px;margin-bottom:4px;">${catEmoji}</div><div>«Отлично! А знаешь почему?»</div><div style="margin-top:6px;font-weight:700;">✅ ${trap.explanation}</div>`;
                expl.className = 'lesson-explanation show good';
                success();
            } else {
                o.classList.add('wrong-pick');
                opts[trap.correct].classList.add('correct-pick');
                expl.innerHTML = `<div style="font-size:24px;margin-bottom:4px;">${catEmoji}</div><div>«Вот тут подвох! Смотри…»</div><div style="margin-top:6px;font-weight:700;">🤔 ${trap.explanation}</div>`;
                expl.className = 'lesson-explanation show bad';
            }
        }));
    }
    $('#tqClose').addEventListener('click', () => {
        $('#trapQuizOverlay').classList.remove('active');
        updateTrapsBadge();
        renderTrapsPanel();
    });
}

document.addEventListener('DOMContentLoaded', () => {
    const overlay = $('#trapQuizOverlay');
    if (overlay) {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('active');
                updateTrapsBadge();
                renderTrapsPanel();
            }
        });
    }
});

// js/components/games.js
// Состояние игр: рекорды и монеты
function getGameState() {
    if (!state.gameRecords) state.gameRecords = {};
    if (!state.gameCoins) state.gameCoins = 0;
    return state;
}

function saveGameRecord(gameId, score) {
    const gs = getGameState();
    if (!gs.gameRecords[gameId] || score > gs.gameRecords[gameId]) {
        gs.gameRecords[gameId] = score;
        saveState();
        onNewRecord();
    }
}

function addGameCoins(amount) {
    state.gems = (state.gems || 0) + amount;
    getGameState().gameCoins = (getGameState().gameCoins || 0) + amount;
    saveState();
    // Обновить счётчик в шапке
    const gemEl = $('#gemCount');
    if (gemEl) gemEl.textContent = state.gems;
}

// ========================= ИГРА #1: KOTYTAIL (Змейка) =========================
function startKotyTail(container) {
    container.innerHTML = '';
    const gs = getGameState();
    const best = gs.gameRecords?.kotyTail || 0;

    // Холст
    const canvas = document.createElement('canvas');
    canvas.width = 360;
    canvas.height = 400;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    canvas.style.borderRadius = '16px';
    canvas.style.background = '#0F172A';

    // Панель
    const scoreEl = document.createElement('div');
    scoreEl.className = 'game-hud';
    scoreEl.innerHTML = `<span>🐍 <b id="ktScore">0</b></span><span>🏆 <b>${best}</b></span>`;

    const dPad = document.createElement('div');
    dPad.className = 'game-dpad';
    dPad.innerHTML = `
        <div class="dpad-row"><button data-dir="up">▲</button></div>
        <div class="dpad-row">
            <button data-dir="left">◄</button>
            <button data-dir="down">▼</button>
            <button data-dir="right">►</button>
        </div>`;

    container.appendChild(scoreEl);
    container.appendChild(canvas);
    container.appendChild(dPad);

    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const cols = canvas.width / gridSize;
    const rows = canvas.height / gridSize;

    let snake = [{x: 5, y: 5}];
    let dir = {x: 1, y: 0};
    let food = randomFood();
    let score = 0;
    let gameOver = false;
    let interval;

    function randomFood() {
        return {
            x: Math.floor(Math.random() * cols),
            y: Math.floor(Math.random() * rows)
        };
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // Сетка
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 0.5;
        for (let x = 0; x < cols; x++) {
            for (let y = 0; y < rows; y++) {
                ctx.strokeRect(x * gridSize, y * gridSize, gridSize, gridSize);
            }
        }
        // Змейка
        snake.forEach((seg, i) => {
            const gradient = ctx.createRadialGradient(
                seg.x * gridSize + gridSize / 2, seg.y * gridSize + gridSize / 2, 1,
                seg.x * gridSize + gridSize / 2, seg.y * gridSize + gridSize / 2, gridSize / 2
            );
            gradient.addColorStop(0, '#10B981');
            gradient.addColorStop(1, i === 0 ? '#34D399' : '#059669');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2, 4);
            ctx.fill();
        });
        // Глазки головы
        const head = snake[0];
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(head.x * gridSize + 7, head.y * gridSize + 7, 3, 0, Math.PI * 2);
        ctx.arc(head.x * gridSize + 13, head.y * gridSize + 7, 3, 0, Math.PI * 2);
        ctx.fill();
        // Еда — мышка
        ctx.font = '20px serif';
        ctx.fillText('🐭', food.x * gridSize, food.y * gridSize + gridSize - 2);

        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#EF4444';
            ctx.font = 'bold 24px Nunito,sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Котик запутался!', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Nunito,sans-serif';
            ctx.fillText('Нажми для перезапуска', canvas.width / 2, canvas.height / 2 + 30);
            ctx.textAlign = 'start';
        }
    }

    function tick() {
        if (gameOver) return;
        const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
        // Стены — game over
        if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
            endGame();
            return;
        }
        // Столкновение с собой
        if (snake.some(s => s.x === head.x && s.y === head.y)) {
            endGame();
            return;
        }
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            food = randomFood();
            // Не даём еде появиться на змейке
            while (snake.some(s => s.x === food.x && s.y === food.y)) {
                food = randomFood();
            }
        } else {
            snake.pop();
        }
        $('#ktScore').textContent = score;
        draw();
    }

    function endGame() {
        gameOver = true;
        clearInterval(interval);
        draw();
        saveGameRecord('kotyTail', score);
        if (score > 30) addGameCoins(Math.floor(score / 5));
        if (score >= 100) unlockAchievement('gameMaster', () => {});
        onGameOver();
    }

    function changeDir(newDir) {
        if (dir.x + newDir.x === 0 && dir.y + newDir.y === 0) return; // Не разворачиваться
        dir = newDir;
    }

    // Управление: кнопки
    dPad.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            const d = btn.dataset.dir;
            if (d === 'up') changeDir({x: 0, y: -1});
            if (d === 'down') changeDir({x: 0, y: 1});
            if (d === 'left') changeDir({x: -1, y: 0});
            if (d === 'right') changeDir({x: 1, y: 0});
        });
    });

    // Управление: клавиатура/свайпы
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
            changeDir({x: dx > 0 ? 1 : -1, y: 0});
        } else {
            changeDir({x: 0, y: dy > 0 ? 1 : -1});
        }
    });

    document.addEventListener('keydown', onKey);
    function onKey(e) {
        if (e.key === 'ArrowUp') { e.preventDefault(); changeDir({x: 0, y: -1}); }
        if (e.key === 'ArrowDown') { e.preventDefault(); changeDir({x: 0, y: 1}); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); changeDir({x: -1, y: 0}); }
        if (e.key === 'ArrowRight') { e.preventDefault(); changeDir({x: 1, y: 0}); }
    }

    canvas.addEventListener('click', () => {
        if (gameOver) {
            document.removeEventListener('keydown', onKey);
            startKotyTail(container);
        }
    });

    draw();
    interval = setInterval(tick, 130);
}

// ========================= ИГРА #2: КОТ ПРЫГАЕТ (Doodle Jump) =========================
function startCatJump(container) {
    container.innerHTML = '';
    const gs = getGameState();
    const best = gs.gameRecords?.catJump || 0;

    const canvas = document.createElement('canvas');
    canvas.width = 340;
    canvas.height = 500;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    canvas.style.borderRadius = '16px';
    canvas.style.background = 'linear-gradient(180deg, #87CEEB 0%, #E0F2FE 100%)';

    const scoreEl = document.createElement('div');
    scoreEl.className = 'game-hud';
    scoreEl.innerHTML = `<span>⬆️ <b id="cjScore">0</b> м</span><span>🏆 <b>${best}</b></span>`;

    const dPad = document.createElement('div');
    dPad.className = 'game-dpad';
    dPad.innerHTML = `
        <div class="dpad-row" style="justify-content:center;gap:20px;">
            <button data-dir="left" style="font-size:24px;">◄</button>
            <button data-dir="right" style="font-size:24px;">►</button>
        </div>`;

    container.appendChild(scoreEl);
    container.appendChild(canvas);
    container.appendChild(dPad);

    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;

    let cat = {x: w / 2 - 15, y: h - 100, vy: 0, width: 30, height: 36};
    let platforms = [];
    let cameraY = 0;
    let score = 0;
    let gameOver = false;
    let animFrame;

    function createPlatform(y, x) {
        const px = x ?? Math.random() * (w - 70);
        return {x: px, y, width: 70, height: 12};
    }

    // Стартовые платформы
    for (let i = 0; i < 8; i++) {
        platforms.push(createPlatform(h - 70 - i * 70));
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);
        ctx.save();
        ctx.translate(0, cameraY);

        // Платформы
        platforms.forEach(p => {
            const screenY = p.y - cameraY;
            if (screenY < -50 || screenY > h + 50) return;
            ctx.fillStyle = '#059669';
            ctx.beginPath();
            ctx.roundRect(p.x, screenY, p.width, p.height, 6);
            ctx.fill();
            // Травка
            ctx.fillStyle = '#10B981';
            ctx.beginPath();
            ctx.roundRect(p.x, screenY - 4, p.width, 8, 3);
            ctx.fill();
        });

        // Кот
        const cy = cat.y - cameraY;
        ctx.font = '30px serif';
        ctx.fillText('🐱', cat.x, cy + 28);
        ctx.restore();

        // HUD
        ctx.fillStyle = '#1E293B';
        ctx.font = 'bold 14px Nunito';
        ctx.textAlign = 'right';
        ctx.fillText(Math.floor(score) + ' м', w - 12, 24);

        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 20px Nunito';
            ctx.fillText('Котик упал!', w / 2, h / 2 - 10);
            ctx.font = '14px Nunito';
            ctx.fillText('Нажми для перезапуска', w / 2, h / 2 + 25);
            ctx.textAlign = 'start';
        }
    }

    function loop() {
        if (gameOver) return;
        // Гравитация
        cat.vy += 0.6;
        cat.y += cat.vy;

        // Камера следит за котом только когда он высоко
        const targetCamY = cat.y - h * 0.55;
        if (targetCamY < cameraY) cameraY = targetCamY;

        // Платформы
        platforms.forEach(p => {
            if (cat.vy > 0 &&
                cat.y + cat.height >= p.y &&
                cat.y + cat.height <= p.y + p.height + 10 &&
                cat.x + cat.width > p.x &&
                cat.x < p.x + p.width) {
                cat.vy = -11;
                cat.y = p.y - cat.height;
                // Возможно монетка
                if (Math.random() < 0.1) addGameCoins(1);
            }
        });

        // Смерть при падении
        if (cat.y - cameraY > h + 60) {
            endGame();
            return;
        }

        // Генерация платформ
        const highestPlatformY = platforms.reduce((min, p) => Math.min(min, p.y), Infinity);
        while (highestPlatformY - cameraY > -200) {
            const newY = highestPlatformY - 60 - Math.random() * 40;
            platforms.push(createPlatform(newY));
            platforms.sort((a, b) => a.y - b.y);
            // Удаляем старые
            if (platforms.length > 15) platforms = platforms.slice(-15);
            break;
        }

        score = Math.max(score, Math.floor((h - 100 - cat.y) / 10));
        const scEl = document.getElementById('cjScore');
        if (scEl) scEl.textContent = Math.floor(score);

        // Выход за край — wrap
        if (cat.x < -cat.width) cat.x = w;
        if (cat.x > w) cat.x = -cat.width;

        draw();
        animFrame = requestAnimationFrame(loop);
    }

    function endGame() {
        gameOver = true;
        cancelAnimationFrame(animFrame);
        draw();
        const finalScore = Math.floor(score);
        saveGameRecord('catJump', finalScore);
        if (finalScore > 30) addGameCoins(Math.floor(finalScore / 10));
        if (finalScore >= 200) unlockAchievement('gameMaster', () => {});
        onGameOver();
    }

    // Управление
    let leftHeld = false, rightHeld = false;
    dPad.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (btn.dataset.dir === 'left') leftHeld = true;
            if (btn.dataset.dir === 'right') rightHeld = true;
        });
        btn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            if (btn.dataset.dir === 'left') leftHeld = false;
            if (btn.dataset.dir === 'right') rightHeld = false;
        });
        btn.addEventListener('pointerleave', () => {
            leftHeld = false;
            rightHeld = false;
        });
    });

    // Клавиатура
    document.addEventListener('keydown', onJumpKey);
    document.addEventListener('keyup', onJumpKeyUp);
    function onJumpKey(e) {
        if (e.key === 'ArrowLeft') leftHeld = true;
        if (e.key === 'ArrowRight') rightHeld = true;
    }
    function onJumpKeyUp(e) {
        if (e.key === 'ArrowLeft') leftHeld = false;
        if (e.key === 'ArrowRight') rightHeld = false;
    }

    // Таймер движения
    const moveInterval = setInterval(() => {
        if (gameOver) { clearInterval(moveInterval); return; }
        if (leftHeld) cat.x -= 5;
        if (rightHeld) cat.x += 5;
    }, 16);

    canvas.addEventListener('click', () => {
        if (gameOver) {
            document.removeEventListener('keydown', onJumpKey);
            document.removeEventListener('keyup', onJumpKeyUp);
            clearInterval(moveInterval);
            startCatJump(container);
        }
    });

    draw();
    loop();
}

// ========================= ИГРА #3: ЛОВИ РЫБКУ (Catch/Fruit Ninja) =========================
function startCatchFish(container) {
    container.innerHTML = '';
    const gs = getGameState();
    const best = gs.gameRecords?.catchFish || 0;

    const canvas = document.createElement('canvas');
    canvas.width = 350;
    canvas.height = 450;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    canvas.style.borderRadius = '16px';
    canvas.style.background = 'linear-gradient(180deg, #0C4A6E 0%, #0369A1 60%, #0A2A40 100%)';

    const scoreEl = document.createElement('div');
    scoreEl.className = 'game-hud';
    scoreEl.innerHTML = `<span>🐟 <b id="cfScore">0</b></span><span>⏱️ <b id="cfTimer">30</b>с</span><span>🏆 <b>${best}</b></span>`;

    container.appendChild(scoreEl);
    container.appendChild(canvas);

    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;

    let items = [];
    let score = 0;
    let timeLeft = 30;
    let gameOver = false;
    let animFrame;
    let spawnTimer;

    function spawnItem() {
        const types = [
            {emoji: '🐟', points: 1, speed: 1.5, size: 30},
            {emoji: '🐠', points: 2, speed: 2, size: 28},
            {emoji: '🐡', points: 3, speed: 1.2, size: 34},
            {emoji: '🦐', points: 1, speed: 2.5, size: 24},
            {emoji: '💣', points: -3, speed: 1.8, size: 28},
            {emoji: '💎', points: 5, speed: 2.2, size: 22},
        ];
        const type = types[Math.floor(Math.random() * types.length)];
        items.push({
            x: Math.random() * (w - type.size),
            y: h + type.size,
            vy: -(type.speed + Math.random()),
            vx: (Math.random() - 0.5) * 0.8,
            ...type,
            opacity: 1,
        });
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);
        // Пузырьки фона
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        for (let i = 0; i < 10; i++) {
            const bx = (i * 37 + 10) % w;
            const by = (performance.now() / 200 + i * 90) % h;
            ctx.beginPath();
            ctx.arc(bx, by, 3 + i % 5, 0, Math.PI * 2);
            ctx.fill();
        }

        items.forEach(item => {
            ctx.font = `${item.size}px serif`;
            ctx.globalAlpha = item.opacity;
            ctx.fillText(item.emoji, item.x, item.y);
            ctx.globalAlpha = 1;
        });

        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 20px Nunito';
            ctx.fillText('Время вышло!', w / 2, h / 2 - 10);
            ctx.font = '14px Nunito';
            ctx.fillText('Нажми для перезапуска', w / 2, h / 2 + 25);
        }
    }

    function loop() {
        if (gameOver) return;
        items.forEach(item => {
            item.y += item.vy;
            item.x += item.vx;
        });
        items = items.filter(item => item.y > -50 && item.opacity > 0);
        draw();
        animFrame = requestAnimationFrame(loop);
    }

    function tickTimer() {
        if (gameOver) return;
        timeLeft--;
        const timerEl = document.getElementById('cfTimer');
        if (timerEl) timerEl.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
    }

    function endGame() {
        gameOver = true;
        clearInterval(spawnTimer);
        clearInterval(tickInterval);
        cancelAnimationFrame(animFrame);
        draw();
        saveGameRecord('catchFish', score);
        if (score > 5) addGameCoins(Math.floor(score / 2));
        if (score >= 50) unlockAchievement('gameMaster', () => {});
        onGameOver();
    }

    canvas.addEventListener('click', (e) => {
        if (gameOver) {
            startCatchFish(container);
            return;
        }
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;

        for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            const dx = mx - (item.x + item.size / 2);
            const dy = my - (item.y - item.size / 2);
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < item.size) {
                score = Math.max(0, score + item.points);
                document.getElementById('cfScore').textContent = score;
                // Эффект попадания
                const fx = document.createElement('span');
                fx.className = 'game-particle';
                fx.textContent = item.points > 0 ? '+' + item.points : item.points;
                fx.style.left = e.clientX + 'px';
                fx.style.top = e.clientY + 'px';
                fx.style.color = item.points > 0 ? '#10B981' : '#EF4444';
                fx.style.position = 'fixed';
                fx.style.pointerEvents = 'none';
                fx.style.fontWeight = 'bold';
                fx.style.fontSize = '18px';
                fx.style.zIndex = '999';
                fx.style.animation = 'floatUp 1s ease forwards';
                document.body.appendChild(fx);
                setTimeout(() => fx.remove(), 1000);
                items.splice(i, 1);
                break;
            }
        }
    });

    draw();
    loop();
    spawnTimer = setInterval(spawnItem, 700);
    const tickInterval = setInterval(tickTimer, 1000);
}

// ========================= ИГРА #4: КОТ БЕЖИТ (Runner) =========================
function startCatRun(container) {
    container.innerHTML = '';
    const gs = getGameState();
    const best = gs.gameRecords?.catRun || 0;

    const canvas = document.createElement('canvas');
    canvas.width = 360;
    canvas.height = 220;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    canvas.style.borderRadius = '16px';
    canvas.style.background = 'linear-gradient(180deg, #7C3AED 0%, #A78BFA 60%, #C4B5FD 100%)';

    const scoreEl = document.createElement('div');
    scoreEl.className = 'game-hud';
    scoreEl.innerHTML = `<span>🏃 <b id="crScore">0</b></span><span>🏆 <b>${best}</b></span>`;

    const jumpBtn = document.createElement('button');
    jumpBtn.className = 'game-jump-btn';
    jumpBtn.textContent = '⬆️ ПРЫГ';

    container.appendChild(scoreEl);
    container.appendChild(canvas);
    container.appendChild(jumpBtn);

    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const groundY = h - 40;

    let cat = {x: 50, y: groundY - 30, vy: 0, width: 40, height: 34, jumping: false};
    let obstacles = [];
    let coins = [];
    let score = 0;
    let speed = 4;
    let gameOver = false;
    let animFrame;
    let frameCount = 0;

    function spawnObstacle() {
        const types = [
            {emoji: '📦', width: 30, height: 30},
            {emoji: '🪨', width: 28, height: 26},
            {emoji: '🕳️', width: 40, height: 20},
            {emoji: '🌵', width: 22, height: 36},
        ];
        const type = types[Math.floor(Math.random() * types.length)];
        obstacles.push({x: w + 40, y: groundY - type.height, ...type});
    }

    function spawnCoin() {
        coins.push({x: w + 40 + Math.random() * 80, y: groundY - 60 - Math.random() * 40, size: 20});
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);
        // Земля
        ctx.fillStyle = '#2DD4BF';
        ctx.fillRect(0, groundY, w, h - groundY);
        ctx.fillStyle = '#14B8A6';
        for (let i = 0; i < 10; i++) {
            ctx.fillRect((i * 40 + frameCount * 2) % w, groundY, 20, 3);
        }

        // Препятствия
        obstacles.forEach(o => {
            ctx.font = `${o.height}px serif`;
            ctx.fillText(o.emoji, o.x, o.y + o.height);
        });

        // Монетки
        coins.forEach(c => {
            ctx.font = `${c.size}px serif`;
            ctx.fillText('💎', c.x, c.y);
        });

        // Кот
        ctx.save();
        const catY = cat.y + (cat.jumping ? 0 : Math.sin(frameCount * 0.2) * 2);
        ctx.font = `${cat.height}px serif`;
        ctx.fillText('🐱', cat.x, catY + cat.height);
        ctx.restore();

        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 20px Nunito';
            ctx.fillText('Котик споткнулся!', w / 2, h / 2 - 10);
            ctx.font = '14px Nunito';
            ctx.fillText('Нажми для перезапуска', w / 2, h / 2 + 20);
        }
    }

    function jump() {
        if (!cat.jumping) {
            cat.vy = -10;
            cat.jumping = true;
        }
    }

    function loop() {
        if (gameOver) return;
        frameCount++;

        // Гравитация
        if (cat.jumping) {
            cat.vy += 0.7;
            cat.y += cat.vy;
            if (cat.y >= groundY - cat.height) {
                cat.y = groundY - cat.height;
                cat.jumping = false;
                cat.vy = 0;
            }
        }

        // Препятствия движутся
        obstacles.forEach(o => o.x -= speed);
        coins.forEach(c => c.x -= speed);

        // Коллизия с препятствиями
        for (const o of obstacles) {
            if (cat.x + cat.width - 10 > o.x && cat.x + 10 < o.x + o.width &&
                cat.y + cat.height - 5 > o.y && cat.y + 5 < o.y + o.height) {
                endGame();
                return;
            }
        }

        // Сбор монеток
        coins = coins.filter(c => {
            if (cat.x + cat.width - 10 > c.x && cat.x + 10 < c.x + c.size &&
                cat.y + cat.height > c.y - c.size && cat.y < c.y + c.size) {
                score += 3;
                addGameCoins(1);
                return false;
            }
            return true;
        });

        // Очистка
        obstacles = obstacles.filter(o => o.x > -60);
        coins = coins.filter(c => c.x > -30);

        // Спавн
        if (frameCount % 80 === 0) spawnObstacle();
        if (frameCount % 40 === 0 && Math.random() < 0.4) spawnCoin();

        // Счёт
        score += 0.1;
        speed = 4 + score / 50;
        const scEl = document.getElementById('crScore');
        if (scEl) scEl.textContent = Math.floor(score);

        draw();
        animFrame = requestAnimationFrame(loop);
    }

    function endGame() {
        gameOver = true;
        cancelAnimationFrame(animFrame);
        draw();
        const finalScore = Math.floor(score);
        saveGameRecord('catRun', finalScore);
        if (finalScore > 20) addGameCoins(Math.floor(finalScore / 10));
        if (finalScore >= 150) unlockAchievement('gameMaster', () => {});
        onGameOver();
    }

    jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
    document.addEventListener('keydown', onRunKey);
    function onRunKey(e) {
        if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); jump(); }
    }

    canvas.addEventListener('click', (e) => {
        if (!gameOver) jump();
        else {
            document.removeEventListener('keydown', onRunKey);
            startCatRun(container);
        }
    });

    draw();
    loop();
}

// ========================= ИГРА #5: ПАЗЛЫ (Скользящие плитки) =========================
function startPuzzle(container) {
    container.innerHTML = '';
    const gs = getGameState();
    const best = gs.gameRecords?.puzzle || 0;

    const size = 3; // 3x3 сетка
    const tileSize = 100;
    const canvas = document.createElement('canvas');
    canvas.width = tileSize * size;
    canvas.height = tileSize * size;
    canvas.style.width = '100%';
    canvas.style.maxWidth = '320px';
    canvas.style.display = 'block';
    canvas.style.margin = '0 auto';
    canvas.style.borderRadius = '16px';
    canvas.style.background = '#0F172A';

    const infoEl = document.createElement('div');
    infoEl.className = 'game-hud';
    infoEl.innerHTML = `<span>🧩 Ходы: <b id="pzMoves">0</b></span><span>🏆 <b>${best}</b></span>`;

    const shuffleBtn = document.createElement('button');
    shuffleBtn.className = 'game-jump-btn';
    shuffleBtn.style.margin = '10px auto';
    shuffleBtn.style.display = 'block';
    shuffleBtn.textContent = '🔀 Перемешать';

    container.appendChild(infoEl);
    container.appendChild(canvas);
    container.appendChild(shuffleBtn);

    const ctx = canvas.getContext('2d');
    const emojis = ['🐱', '📚', '🧮', '📝', '🏆', '💎', '🌟', '🎓'];
    let tiles = [...emojis, '⬛']; // пустая клетка
    let emptyIndex = tiles.length - 1;
    let moves = 0;

    function shuffle() {
        // Обратимые перемешивания — делаем случайные ходы
        for (let i = 0; i < 100; i++) {
            const neighbors = getNeighbors(emptyIndex);
            const swapIdx = neighbors[Math.floor(Math.random() * neighbors.length)];
            [tiles[emptyIndex], tiles[swapIdx]] = [tiles[swapIdx], tiles[emptyIndex]];
            emptyIndex = swapIdx;
        }
        moves = 0;
        document.getElementById('pzMoves').textContent = '0';
        draw();
    }

    function getNeighbors(idx) {
        const row = Math.floor(idx / size);
        const col = idx % size;
        const neighbors = [];
        if (row > 0) neighbors.push(idx - size);
        if (row < size - 1) neighbors.push(idx + size);
        if (col > 0) neighbors.push(idx - 1);
        if (col < size - 1) neighbors.push(idx + 1);
        return neighbors;
    }

    function isSolved() {
        return tiles.slice(0, -1).every((t, i) => t === emojis[i]) && tiles[tiles.length - 1] === '⬛';
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        tiles.forEach((emoji, idx) => {
            const row = Math.floor(idx / size);
            const col = idx % size;
            const x = col * tileSize;
            const y = row * tileSize;

            if (emoji === '⬛') {
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.beginPath();
                ctx.roundRect(x + 2, y + 2, tileSize - 4, tileSize - 4, 12);
                ctx.fill();
            } else {
                ctx.fillStyle = '#1E293B';
                ctx.beginPath();
                ctx.roundRect(x + 2, y + 2, tileSize - 4, tileSize - 4, 12);
                ctx.fill();
                ctx.fillStyle = '#334155';
                ctx.beginPath();
                ctx.roundRect(x + 4, y + 4, tileSize - 8, tileSize - 8, 10);
                ctx.fill();
                ctx.font = '40px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(emoji, x + tileSize / 2, y + tileSize / 2);
                ctx.textAlign = 'start';
                ctx.textBaseline = 'alphabetic';
            }
        });
    }

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;
        const col = Math.floor(mx / tileSize);
        const row = Math.floor(my / tileSize);
        const clickedIdx = row * size + col;

        if (getNeighbors(emptyIndex).includes(clickedIdx)) {
            [tiles[emptyIndex], tiles[clickedIdx]] = [tiles[clickedIdx], tiles[emptyIndex]];
            emptyIndex = clickedIdx;
            moves++;
            document.getElementById('pzMoves').textContent = moves;
            draw();

            if (isSolved()) {
                setTimeout(() => {
                    const reward = Math.max(1, Math.floor(100 / moves));
                    addGameCoins(reward);
                    showToast('🧩', `Пазл собран за ${moves} ходов! +${reward}💎`, $('#toast'));
                    saveGameRecord('puzzle', moves);
                    shuffle();
                }, 400);
            }
        }
    });

    shuffleBtn.addEventListener('click', shuffle);

    // Начальное перемешивание
    shuffle();
}

        <div class="pet-acc-grid" id="petEyesGrid">${renderAccessoryGrid('eyes')}</div>

        <div class="pet-section-title"><span>🧣</span> Шея</div>

    </div>

    <button class="reset-progress-btn" id="resetProgressBtn">🔄 Сбросить прогресс</button>
    `;

    container.innerHTML = html;

    initLottie(skin);

    // Обработчики
    setupPetDrag();
    setupPetButtons();
    setupShopListeners();
}

/** Инициализация Lottie-плеера */
function initLottie(skin) {
    // Очистить предыдущий экземпляр
    if (lottieInstance) {
        lottieInstance.destroy();
        lottieInstance = null;
    }

    const container = document.getElementById('lottiePet');
    if (!container) return;

    // Проверить доступность lottie (глобальная библиотека)
    if (typeof lottie === 'undefined') {
        // Фолбэк на эмодзи
        container.innerHTML = `<div class="pet-emoji-fallback">${skin.emoji || '🐱'}</div>`;
        return;
    }

    const animPath = skin.lottieIdle || 'assets/lottie/cat_idle.json';
    currentLottieMood = 'idle';

    // Использовать встроенные данные (для file:// протокола) или path
    const animData = (typeof LOTTIE_ANIMATIONS !== 'undefined' && LOTTIE_ANIMATIONS[animPath])
        ? LOTTIE_ANIMATIONS[animPath]
        : null;

    const animOptions = {
        container: container,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        rendererSettings: {
            preserveAspectRatio: 'xMidYMid meet',
            progressiveLoad: true
        }
    };

    if (animData) {
        animOptions.animationData = animData;
    } else {
        animOptions.path = animPath;
    }

    try {
        lottieInstance = lottie.loadAnimation(animOptions);
    } catch (e) {
        console.warn('Lottie init failed, fallback to emoji:', e);
        container.innerHTML = `<div class="pet-emoji-fallback">${skin.emoji || '🐱'}</div>`;
    }
}

/** Переключить анимацию питомца (mood: idle, happy, sad, excited) */
function setPetMood(mood) {
    if (!lottieInstance || typeof lottie === 'undefined') return;

    const skin = PET_SKINS[state.petSkin] || PET_SKINS.classic;
    const animKey = MOOD_KEY[mood];
    if (!animKey) return;

    const animPath = skin[animKey];
    if (!animPath) return;

    if (currentLottieMood === mood) return; // уже в этом состоянии

    currentLottieMood = mood;

    // Загрузить новую анимацию (переиспользуем loadAnimation)
    // Lottie не поддерживает смену path на лету — destroy + recreate
    const animData = (typeof LOTTIE_ANIMATIONS !== 'undefined' && LOTTIE_ANIMATIONS[animPath])
        ? LOTTIE_ANIMATIONS[animPath]
        : null;

    const animOptions = {
        container: document.getElementById('lottiePet'),
        renderer: 'svg',
        loop: mood === 'excited' ? false : true, // excited проигрывается 1 раз
        autoplay: true,
        rendererSettings: {
            preserveAspectRatio: 'xMidYMid meet',
            progressiveLoad: true
        }
    };

    if (animData) {
        animOptions.animationData = animData;
    } else {
        animOptions.path = animPath;
    }

    try {
        lottieInstance.destroy();
        lottieInstance = lottie.loadAnimation(animOptions);

        // После завершения excited вернуться в idle
        if (mood === 'excited') {
            lottieInstance.addEventListener('complete', () => {
                setPetMood('idle');
            });
        }
    } catch (e) {
        console.warn('Lottie mood switch failed:', e);
    }
}

function countCompleted() {
    const ms = state.skills[SUBJECTS.MATH] || [];
    const rs = state.skills[SUBJECTS.RUSSIAN] || [];
    return ms.filter(s => s.progress >= 100).length + rs.filter(s => s.progress >= 100).length;
}

function renderSkinGrid() {
    let html = '';
    Object.values(PET_SKINS).forEach(s => {
        const owned = state.petOwnedSkins.includes(s.id);
        const active = state.petSkin === s.id;
        const cls = active ? 'active' : (owned ? 'owned' : 'locked');
        const label = owned ? (active ? 'Выбрано' : 'Выбрать') : `💎${s.cost}`;
        html += `
        <div class="pet-shop-item ${cls}" data-type="skin" data-id="${s.id}" data-cost="${s.cost}" data-owned="${owned ? '1' : '0'}">
            <div class="pet-shop-emoji">${s.emoji}</div>
            <div class="pet-shop-name">${s.name}</div>
            <div class="pet-shop-action">${label}</div>
        </div>`;
    });
    return html;
}

function renderAccessoryGrid(slot) {
    const items = Object.values(PET_ACCESSORIES).filter(a => a.slot === slot);
    let html = '';
    items.forEach(a => {
        const owned = state.petOwnedAccessories.includes(a.id);
        const active = state.petAccessories[slot] === a.id;
        const cls = active ? 'active' : (owned ? 'owned' : 'locked');
        const label = owned ? (active ? 'Снято' : 'Надеть') : `💎${a.cost}`;
        html += `
        <div class="pet-shop-item ${cls}" data-type="acc" data-slot="${slot}" data-id="${a.id}" data-cost="${a.cost}" data-owned="${owned ? '1' : '0'}">
            <div class="pet-shop-emoji">${a.emoji}</div>
            <div class="pet-shop-name">${a.name}</div>
            <div class="pet-shop-action">${label}</div>
        </div>`;
    });

}

function setupPetDrag() {
    const stage = document.getElementById('petStage');
    if (!stage) return;

    stage.addEventListener('pointerdown', (e) => {
        petDragging = true;
        petDragStart.x = e.clientX;
        petDragStart.y = e.clientY;
        petDragStart.rotation = state.petRotation;
        stage.style.cursor = 'grabbing';
        stage.style.transition = 'none';
        e.preventDefault();
    });

    window.addEventListener('pointermove', (e) => {
        if (!petDragging) return;
        if (petAnimFrame) cancelAnimationFrame(petAnimFrame);
        petAnimFrame = requestAnimationFrame(() => {
            const dx = e.clientX - petDragStart.x;
            const newRot = petDragStart.rotation + dx * 0.5;
            state.petRotation = newRot % 360;
            const s = document.getElementById('petStage');
            if (s) s.style.transform = `rotateY(${state.petRotation}deg)`;
        });
    });

    window.addEventListener('pointerup', () => {
        if (petDragging) {
            petDragging = false;
            const s = document.getElementById('petStage');
            if (s) {
                s.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                s.style.cursor = 'grab';
            }
            saveState();
        }
    });
}

function setupPetButtons() {
    // Гладить
    const btnPet = document.getElementById('btnPetPet');
    if (btnPet) {
        btnPet.addEventListener('click', () => {
            state.totalPets++;
            saveState();

            // Lottie-реакция: happy
            setPetMood('happy');
            // Вернуться в idle через 2 секунды
            setTimeout(() => {
                if (currentLottieMood === 'happy') setPetMood('idle');
            }, 2500);

            spawnHearts();
            showToast('💖', `Поглажен! Всего: ${state.totalPets}`, document.getElementById('toast'));
            // Проверка ачивки
            if (state.totalPets >= 10) {
                unlockAchievement('murmur', (name) => {
                    showToast('🏆', `${name} разблокирована!`, document.getElementById('achToast'));
                });
            }
        });
    }

    // Нарядить
    const btnDress = document.getElementById('btnPetDress');
    if (btnDress) {
        btnDress.addEventListener('click', () => {
            const shop = document.getElementById('petShopSection');
            if (shop) {
                const show = shop.style.display === 'none';
                shop.style.display = show ? 'block' : 'none';
                btnDress.innerHTML = show ? '<span>👔</span> Закрыть' : '<span>👔</span> Нарядить';
            }
        });
    }

    // Повернуть
    const btnRotate = document.getElementById('btnPetRotate');
    if (btnRotate) {
        btnRotate.addEventListener('click', () => {
            state.petRotation = (state.petRotation + 60) % 360;
            const s = document.getElementById('petStage');
            if (s) {
                s.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                s.style.transform = `rotateY(${state.petRotation}deg)`;
            }
            saveState();
        });
    }
}

function setupShopListeners() {
    const toast = document.getElementById('toast');
    const container = document.getElementById('profileContent');
    if (!container) return;

    container.addEventListener('click', (e) => {
        const item = e.target.closest('.pet-shop-item');
        if (!item) return;

        const type = item.dataset.type;
        const id = item.dataset.id;
        const slot = item.dataset.slot;
        const cost = parseInt(item.dataset.cost) || 0;
        const owned = item.dataset.owned === '1';

        if (type === 'skin') {
            if (owned) {
                // Выбрать скин
                state.petSkin = id;
                saveState();
                refreshPetDisplay();
                updateSkinGrid(container);
                showToast('🐱', `Скин "${PET_SKINS[id]?.name}" надет!`, toast);
            } else {
                // Купить
                if (state.gems >= cost) {
                    state.gems -= cost;
                    state.petOwnedSkins.push(id);
                    state.petSkin = id;
                    saveState();
                    refreshPetDisplay();
                    updateSkinGrid(container);
                    updateGemsDisplay();
                    // Lottie-реакция: excited при покупке
                    setPetMood('excited');
                    showToast('💎', `Скин "${PET_SKINS[id]?.name}" куплен!`, toast);
                } else {
                    showToast('💎', `Не хватает 💎. Нужно ${cost}, есть ${state.gems}`, toast);
                }
            }
        } else if (type === 'acc') {
            if (owned) {
                // Переключить (надеть/снять)
                const current = state.petAccessories[slot];
                if (current === id) {
                    // Снять — вернуть дефолт
                    const defaultId = slot === 'hat' ? 'none' : (slot === 'eyes' ? 'no_glasses' : 'no_neck');
                    state.petAccessories[slot] = defaultId;
                } else {
                    state.petAccessories[slot] = id;
                }
                saveState();
                refreshPetDisplay();
                updateAccGrid(container, slot);
                const acc = PET_ACCESSORIES[id];
                const active = state.petAccessories[slot] === id;
                showToast(acc?.emoji || '👔', active ? `"${acc?.name}" надет!` : `"${acc?.name}" снят`, toast);
            } else {
                // Купить
                if (state.gems >= cost) {
                    state.gems -= cost;
                    state.petOwnedAccessories.push(id);
                    state.petAccessories[slot] = id;
                    saveState();
                    refreshPetDisplay();
                    updateAccGrid(container, slot);
                    updateGemsDisplay();
                    const acc = PET_ACCESSORIES[id];
                    showToast('💎', `"${acc?.name}" куплен и надет!`, toast);
                } else {
                    showToast('💎', `Не хватает 💎. Нужно ${cost}, есть ${state.gems}`, toast);
                }
            }
        }
    });
}

function refreshPetDisplay() {
    const skin = PET_SKINS[state.petSkin] || PET_SKINS.classic;
    const hat = PET_ACCESSORIES[state.petAccessories.hat] || PET_ACCESSORIES.none;
    const eyes = PET_ACCESSORIES[state.petAccessories.eyes] || PET_ACCESSORIES.no_glasses;
    const neck = PET_ACCESSORIES[state.petAccessories.neck] || PET_ACCESSORIES.no_neck;

    const petHat = document.getElementById('petHat');
    const petEyes = document.getElementById('petEyes');
    const petNeck = document.getElementById('petNeck');
    const petName = document.querySelector('.pet-name');
    const petLevel = document.querySelector('.pet-level');

    // Переинициализировать Lottie для нового скина
    initLottie(skin);

    if (petHat) petHat.textContent = hat.emoji !== '❌' ? hat.emoji : '';
    if (petEyes) petEyes.textContent = eyes.emoji !== '❌' ? eyes.emoji : '';
    if (petNeck) petNeck.textContent = neck.emoji !== '❌' ? neck.emoji : '';
    if (petName) petName.textContent = skin.name;
    if (petLevel) petLevel.textContent = `Уровень ${countCompleted() + 1} · ${skin.desc}`;
}

function updateSkinGrid(container) {
    const grid = container.querySelector('#petSkinGrid');
    if (grid) grid.innerHTML = renderSkinGrid();
    // Обновить data-атрибуты
    grid.querySelectorAll('.pet-shop-item').forEach(el => {
        el.dataset.owned = state.petOwnedSkins.includes(el.dataset.id) ? '1' : '0';
    });
}

function updateAccGrid(container, slot) {
    const gridId = slot === 'hat' ? 'petHatGrid' : (slot === 'eyes' ? 'petEyesGrid' : 'petNeckGrid');
    const grid = container.querySelector('#' + gridId);
    if (grid) grid.innerHTML = renderAccessoryGrid(slot);
}

function updateGemsDisplay() {
    const gemEl = document.getElementById('gemCount');
    if (gemEl) gemEl.textContent = state.gems;
}

function spawnHearts() {
    const body = document.getElementById('lottiePet');
    if (!body) return;
    const rect = body.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const hearts = ['💖', '💕', '💗', '❤️', '✨'];
    for (let i = 0; i < 5; i++) {
        const h = document.createElement('span');
        h.className = 'hearts-particle';
        h.textContent = hearts[i % hearts.length];
        h.style.position = 'fixed';
        h.style.left = (cx + (Math.random() - 0.5) * 60) + 'px';
        h.style.top = (cy + (Math.random() - 0.5) * 30) + 'px';
        h.style.fontSize = (14 + Math.random() * 10) + 'px';
        h.style.pointerEvents = 'none';
        h.style.zIndex = '999';
        h.style.animation = `floatUp ${0.8 + Math.random() * 0.6}s ease forwards`;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1500);
    }
}

                localStorage.removeItem('kot_ucheniy_last_visit');
            }
        }
    });
}

function updateStats() {
    const oldGems = parseInt($('#gemCount').textContent) || state.gems;
    $('#gemCount').textContent = state.gems;
    $('#streakCount').textContent = state.streak;
    
    // Огонёк при streak >= 7
    const streakEl = $('#streakCount');
    if (streakEl) {
        if (state.streak >= 7) {
            streakEl.classList.add('streak-fire');
        } else {
            streakEl.classList.remove('streak-fire');
        }
    }
    
    // Гемы летят
    if (state.gems > oldGems) {
        const diff = state.gems - oldGems;
        const gemEl = $('#gemCount');
        if (gemEl && diff > 0) {
            const rect = gemEl.getBoundingClientRect();
            spawnGems(Math.min(diff, 5), rect.left, rect.top - 30, gemEl);
        }
    }
}

function showAchievementToast(name, desc) {
    const toast = document.getElementById('achToast');
    const text = document.getElementById('achToastText');
    if (!toast || !text) return;
    text.textContent = name + ' — ' + desc;
    toast.classList.add('show');
    
    // Lottie медаль
    const lottieWrap = document.createElement('div');
    lottieWrap.className = 'lottie-container lottie-small lottie-fade';
    document.body.appendChild(lottieWrap);
    playLottie(lottieWrap, 'https://assets2.lottiefiles.com/packages/lf20_touohxv0.json');
    setTimeout(() => lottieWrap.remove(), 2500);
    
    setTimeout(() => toast.classList.remove('show'), 3500);
}

function setCatMood(mood) {
    const catBody = $('#catBody');
    if (!catBody) return;

    const moods = {
        happy: '😺',
        proud: '😸',
        love: '😻',
        sad: '😿',
        wow: '🙀',
        normal: state.subject === SUBJECTS.MATH ? '🐱' : '😺'
    };

    const emoji = moods[mood] || moods.normal;
    catBody.textContent = emoji;

    catBody.style.transform = 'scale(1.2)';
    setTimeout(() => { catBody.style.transform = 'scale(1)'; }, 200);

    clearTimeout(catBody._moodTimeout);
    catBody._moodTimeout = setTimeout(() => {
        const t = getTheme(state.theme);
        catBody.textContent = t.catEmoji || SUBJECT_EMOJI[state.subject];
    }, 2000);
}

function updateSubjectUI() {
    const im = state.subject === SUBJECTS.MATH;
    $('#headerBar').className = 'header ' + (im ? 'math-header' : 'rus-header');
    $('#catStage').className = 'cat-stage ' + (im ? 'math-stage' : 'rus-stage');
    $('#btnMath').classList.toggle('active', im);
    $('#btnRus').classList.toggle('active', !im);
    $('#app').className = 'app' + (im ? '' : ' rus-mode');
    const catSpeech = $('#catSpeech');
    const catBody = $('#catBody');
    const catAvatar = $('#catAvatar');
    if (catSpeech) catSpeech.textContent = im ? CAT_SPEECH.math : CAT_SPEECH.russian;
    if (catBody) {
        const t = getTheme(state.theme);
        catBody.textContent = t.catEmoji || SUBJECT_EMOJI[state.subject];
    }
    if (catAvatar) {
        const t = getTheme(state.theme);
        catAvatar.textContent = t.catEmoji || SUBJECT_EMOJI[state.subject];
    }
}

function setupCatPet() {
    const catBody = $('#catBody');
    const catSpeech = $('#catSpeech');
    if (!catBody || !catSpeech) return;

    catBody.addEventListener('click', () => {
        catBody.classList.add('petted');
        setTimeout(() => catBody.classList.remove('petted'), 600);
        state.totalPets++;
        playSound('pet', state.theme);
        setCatMood('love');
        checkAchievements((name, desc) => showAchievementToast(name, desc));

        const particle = document.createElement('span');
        particle.className = 'hearts-particle';
        particle.textContent = ['❤️', '💕', '✨', '💖'][Math.floor(Math.random() * 4)];
        particle.style.left = (Math.random() * 30 - 10) + 'px';
        catBody.appendChild(particle);
        setTimeout(() => particle.remove(), 1200);

        catSpeech.textContent = CAT_SPEECH.pet(state.totalPets);
        saveState();
    });
}

function bindEvents() {
    $('#btnMath').addEventListener('click', () => {
        if (state.subject !== SUBJECTS.MATH) {
            state.subject = SUBJECTS.MATH;
            state.subjectSwitches++;
            if (state.subjectSwitches >= 5) unlockAchievement('erudite', (n, d) => showAchievementToast(n, d));
            updateSubjectUI();
            renderSkillTree();
            updateTrapsBadge();
            saveState();
        }
    });

    $('#btnRus').addEventListener('click', () => {
        if (state.subject !== SUBJECTS.RUSSIAN) {
            state.subject = SUBJECTS.RUSSIAN;
            state.subjectSwitches++;
            if (state.subjectSwitches >= 5) unlockAchievement('erudite', (n, d) => showAchievementToast(n, d));
            updateSubjectUI();
            renderSkillTree();
            updateTrapsBadge();
            saveState();
        }
    });

    const setActiveNav = (btn) => { $$('.nav-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); };

    $('#navHome').addEventListener('click', () => setActiveNav($('#navHome')));
    $('#navStories').addEventListener('click', () => { setActiveNav($('#navStories')); openStoryPanel(); });
    $('#navTraps').addEventListener('click', () => { setActiveNav($('#navTraps')); renderTrapsPanel(); $('#trapsPanel').classList.add('active'); });
    $('#navGames').addEventListener('click', () => { setActiveNav($('#navGames')); renderGames(); $('#gamesPanel').classList.add('active'); });
    $('#navProfile').addEventListener('click', () => { setActiveNav($('#navProfile')); renderProfile(); $('#profilePanel').classList.add('active'); });

    $('#btnStoryPanelClose').addEventListener('click', () => $('#storyPanel').classList.remove('active'));
    $('#btnTrapsPanelClose').addEventListener('click', () => $('#trapsPanel').classList.remove('active'));
    $('#btnGamesPanelClose').addEventListener('click', () => $('#gamesPanel').classList.remove('active'));
    $('#btnProfilePanelClose').addEventListener('click', () => $('#profilePanel').classList.remove('active'));

    $('#trapQuizOverlay').addEventListener('click', e => { if (e.target === $('#trapQuizOverlay')) { $('#trapQuizOverlay').classList.remove('active'); updateTrapsBadge(); renderTrapsPanel(); } });

    $('#lessonCloseBtn').addEventListener('click', closeLesson);
    $('#lessonNextBtn').addEventListener('click', nextLessonStep);
    $('#btnLessonFinish').addEventListener('click', closeLesson);

    $('#storyNextBtn').addEventListener('click', nextStoryStep);
    $('#storyCloseBtn').addEventListener('click', closeStory);
    $('#btnFinishStory').addEventListener('click', closeStory);
}

function updateDailyStreak() {
    // Используем ISO-дату YYYY-MM-DD — надёжно во всех браузерах
    const today = new Date().toISOString().split('T')[0];
    const lastVisit = localStorage.getItem('kot_ucheniy_last_visit');
    
    if (!lastVisit) {
        // Первый визит
        state.streak = 1;
    } else if (lastVisit === today) {
        // Уже заходил сегодня — ничего не делаем
        return;
    } else {
        // Парсим с T00:00:00 для гарантированной кросс-браузерной поддержки
        const diffDays = Math.floor(
            (new Date(today + 'T00:00:00') - new Date(lastVisit + 'T00:00:00')) / 86400000
        );
        
        if (diffDays === 1) {
            // Заходил вчера — увеличиваем streak
            state.streak++;
        } else {
            // Пропустил день — сброс
            state.streak = 1;
        }
    }
    
    localStorage.setItem('kot_ucheniy_last_visit', today);
    saveState();
    updateStats();
    
    if (state.streak >= 7) {
        showAchievementToast('🔥 Ударный режим!', `${state.streak} дней подряд!`);
    }
}

function init() {
    loadState();
    // Применяем тему
    applyTheme(state.theme || 'light');
    // Проверяем разблокировку тем
    checkThemeUnlocks();
    // Ежедневный streak
    updateDailyStreak();
    // Приветственное мяу
    setTimeout(() => playSound('meow', state.theme), 500);
    updateSubjectUI();
    renderSkillTree();
    updateTrapsBadge();
    updateStats();
    setupCatPet();
    bindEvents();
    startTutorial();
    setTimeout(() => checkSavedLesson(), 500);
    console.log('🐱 v15 — готов к мурчанию!');
}

document.addEventListener('DOMContentLoaded', init);
</script>
