/* === js/utils.js === */
const $ = (selector, parent = document) => parent.querySelector(selector);
const $$ = (selector, parent = document) => parent.querySelectorAll(selector);

const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
const lcm = (a, b) => a * b / gcd(a, b);

/**
 * Адаптивный диапазон: сдвигает верхнюю границу в зависимости от уровня сложности.
 * @param {number} baseMin — минимальное значение (обычно не меняется)
 * @param {number} baseMax — базовый максимум (для difficultyLevel=0)
 * @param {number} step — шаг расширения за уровень (умножается на difficultyLevel)
 * @returns {[number, number]} [min, max]
 */
const adaptiveRange = (baseMin, baseMax, step = 0) => {
    const lvl = state.difficultyLevel || 0;
    const max = step > 0 ? baseMax + step * lvl : baseMax;
    return [baseMin, Math.max(baseMax, max)];
};

/**
 * Получить прогресс навыка (0–100) для текущего предмета и id навыка.
 */
const getSkillProgress = (skillId) => {
    const found = findSkillById(skillId);
    return found ? found.skill.progress : 0;
};

/**
 * Вариативная длина урока (6–10 заданий).
 * Босс-задание всегда остаётся последним, если есть.
 */
const trimLesson = (t) => {
    const count = rnd(6, Math.min(10, t.length));
    if (count >= t.length) return t;
    const last = t[t.length - 1];
    const isBoss = last && (
        (typeof last.type === 'string' && (last.type === 'boss' || last.type.startsWith('boss_'))) ||
        last.badge === 'Босс' || last.badgeClass === 'badge-boss'
    );
    if (isBoss) {
        return [...t.slice(0, count - 1), last];
    }
    return t.slice(0, count);
};

const shuffle = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};

const showToast = (emoji, message, toastEl) => {
    if (!toastEl) return;
    toastEl.innerHTML = `<span>${emoji}</span> ${message}`;
    toastEl.classList.add('show');
    clearTimeout(toastEl._tid);
    toastEl._tid = setTimeout(() => toastEl.classList.remove('show'), 2000);
};

/** Всплывающие +XP частицы */
function spawnXP(amount, x, y, parent = document.body) {
    const el = document.createElement('div');
    el.className = 'xp-particle';
    el.textContent = `+${amount} 💎`;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    parent.appendChild(el);
    setTimeout(() => el.remove(), 1300);
}

/** Lottie-анимация */
function playLottie(container, animationUrl, options = {}) {
    if (!window.lottie || !container) return;
    const anim = window.lottie.loadAnimation({
        container,
        renderer: 'svg',
        loop: options.loop ?? false,
        autoplay: true,
        path: animationUrl
    });
    if (options.onComplete) anim.addEventListener('complete', options.onComplete);
    return anim;
}

const makeWrongs = (correct, count = 3) => {
    const wrongs = new Set();
    while (wrongs.size < count) {
        let delta;
        if (correct <= 10) delta = rnd(-3, 3);
        else if (correct <= 50) delta = rnd(-Math.floor(correct * 0.3), Math.floor(correct * 0.3));
        else delta = rnd(-Math.floor(correct * 0.2), Math.floor(correct * 0.2));
        const candidate = correct + delta;
        if (candidate !== correct && candidate >= 0 && !wrongs.has(candidate)) wrongs.add(candidate);
    }
    return [...wrongs];
};

/** Создать неправильные варианты из пула (для русского) */
const makeStringWrongs = (correct, pool, count = 3) => {
    const others = [...new Set(pool.filter(x => x !== correct))];
    const shuf = shuffle(others);
    return shuf.slice(0, Math.min(count, shuf.length));
};

const choiceT = (emoji, badge, badgeClass, question, correct, explanation) => {
    const allOptions = [correct, ...makeWrongs(correct)];
    const options = shuffle(allOptions);
    const correctIdx = options.findIndex(opt => opt === correct);
    return { type: 'choice', emoji, badge, badgeClass, question, options, correctIdx, correctAns: correct, explanation };
};

/** choice с заранее заданными вариантами (для строк) */
const choiceStrT = (emoji, badge, badgeClass, question, correct, wrongPool, count, explanation) => {
    const wrongs = makeStringWrongs(correct, wrongPool, count);
    const allOptions = shuffle([correct, ...wrongs]);
    const correctIdx = allOptions.findIndex(opt => opt === correct);
    return { type: 'choice', emoji, badge, badgeClass, question, options: allOptions, correctIdx, correctAns: correct, explanation };
};

const inputT = (emoji, badge, badgeClass, question, correct, explanation) => {
    return { type: 'input', emoji, badge, badgeClass, question, correctAns: correct, explanation };
};

const pairT = (emoji, badge, badgeClass, question, pairs, explanation) => {
    return { type: 'pair', emoji, badge, badgeClass, question, pairs, explanation };
};

/** Визуальное задание: SVG + выбор ответа */
const visualT = (emoji, badge, badgeClass, svg, question, correct, options, explanation) => {
    // Гарантируем, что правильный ответ есть среди вариантов
    const allOpts = options.includes(correct) ? options : [correct, ...options];
    const uniqueOpts = [...new Set(allOpts)];
    const correctIdx = uniqueOpts.findIndex(opt => opt === correct);
    return { type: 'visual', emoji, badge, badgeClass, svg, question, options: uniqueOpts, correctIdx, correctAns: correct, explanation };
};

/** Задание «Расставь по порядку» — drag/drop или кнопки сортировки */
const orderingT = (emoji, badge, badgeClass, question, items, explanation) => {
    const correctOrder = [...items]; // items уже в правильном порядке
    const shuffled = shuffle(items);
    return { type: 'ordering', emoji, badge, badgeClass, question, items: shuffled, correctOrder, explanation };
};

/** Обёртка для добавления подсказки к любому заданию */
const hintT = (task, hintText) => {
    return { ...task, hint: hintText };
};

/** Автоматически сгенерировать текст подсказки для задания */
const generateHintText = (task) => {
    if (task.hint) return task.hint;
    const type = task.type;
    if (type === 'choice' || type === 'visual') {
        const ans = String(task.correctAns || task.options?.[task.correctIdx] || '');
        return `Правильный ответ: «${ans}». Подумай почему!`;
    }
    if (type === 'input') {
        const ans = String(task.correctAns || '');
        if (ans.length <= 2) return `Ответ — «${ans}». Запомни правило!`;
        return `Ответ начинается с «${ans[0]}…». Длина: ${ans.length} симв.`;
    }
    if (type === 'pair') {
        if (task.pairs && task.pairs.length > 0) {
            const p = task.pairs[0];
            return `Пример: «${p.left}» ↔ «${p.right}». Сопоставь остальные так же.`;
        }
    }
    if (type === 'ordering') {
        if (task.correctOrder && task.correctOrder.length > 0) {
            return `Первый элемент: «${task.correctOrder[0]}». Расставь всё по порядку.`;
        }
    }
    if (type === 'boss') {
        if (task.tasks && task.tasks.length > 0) {
            const subtask = task.tasks[0];
            return `${subtask.label || subtask.question || 'Первое задание'}: ответ — «${subtask.correctAns}».`;
        }
        if (task.words && task.words.length > 0) {
            const w = task.words[0];
            return `«${w.text}» → ${w.answer}. ${w.hint || 'Вспомни правило.'}`;
        }
    }
    return 'Подумай ещё раз. Ты сможешь!';
};

/** Босс-задание: несколько подзаданий с индивидуальным фидбеком */
const bossT = (emoji, badge, badgeClass, question, tasks, explanation) => {
    return { type: 'boss', emoji, badge, badgeClass, question, tasks, explanation };
};

function getCtx() {
    try {
        return new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
        return null;
    }
}

function playCorrectSound() {
    try {
        const ctx = getCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        const o1 = ctx.createOscillator(); const g1 = ctx.createGain();
        o1.type = 'sine'; o1.frequency.setValueAtTime(523.25, now); o1.frequency.setValueAtTime(659.25, now + 0.08);
        g1.gain.setValueAtTime(0.25, now); g1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        o1.connect(g1); g1.connect(ctx.destination); o1.start(now); o1.stop(now + 0.3);
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.type = 'sine'; o2.frequency.setValueAtTime(659.25, now + 0.1); o2.frequency.setValueAtTime(783.99, now + 0.18);
        g2.gain.setValueAtTime(0.2, now + 0.1); g2.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        o2.connect(g2); g2.connect(ctx.destination); o2.start(now + 0.1); o2.stop(now + 0.45);
    } catch (e) {}
}

function spawnGems(count, startX, startY, targetEl) {
    const target = targetEl || document.getElementById('gemCount');
    if (!target) return;
    const targetRect = target.getBoundingClientRect();
    const targetX = targetRect.left + targetRect.width / 2;
    const targetY = targetRect.top + targetRect.height / 2;
    for (let i = 0; i < count; i++) {
        const gem = document.createElement('span');
        gem.textContent = '💎';
        gem.style.cssText = `position:fixed;left:${startX}px;top:${startY}px;font-size:16px;pointer-events:none;z-index:1000;transition:all 0.8s;opacity:1;`;
        document.body.appendChild(gem);
        requestAnimationFrame(() => {
            gem.style.left = targetX + 'px';
            gem.style.top = targetY + 'px';
            gem.style.opacity = '0';
            gem.style.transform = 'scale(0.3)';
        });
        setTimeout(() => gem.remove(), 900);
    }
}

function playXylophone(notes, delay = 0.12) {
    try {
        const ctx = getCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        notes.forEach((f, i) => {
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(f, now + i * delay);
            g.gain.setValueAtTime(0.2, now + i * delay);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * delay + 0.35);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + i * delay); o.stop(now + i * delay + 0.35);
        });
    } catch (e) {}
}

function playWoodThump() {
    try {
        const ctx = getCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(180, now);
        o.frequency.exponentialRampToValueAtTime(60, now + 0.3);
        g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.35);
    } catch (e) {}
}

function playSynthChime() {
    try {
        const ctx = getCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        [880, 1100, 1320].forEach((f, i) => {
            const o = ctx.createOscillator(); const g = ctx.createGain();
            const f1 = ctx.createBiquadFilter();
            f1.type = 'lowpass'; f1.frequency.value = 3000;
            o.type = 'sawtooth'; o.frequency.setValueAtTime(f, now + i * 0.08);
            g.gain.setValueAtTime(0.12, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25);
            o.connect(f1); f1.connect(g); g.connect(ctx.destination);
            o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.25);
        });
    } catch (e) {}
}

function playSound(type, themeId) {
    const theme = themeId && THEME_SOUNDS[themeId];
    if (theme && theme[type]) {
        theme[type]();

        return;
    }
    switch (type) {
        case 'correct': playCorrectSound(); break;

        case 'achievement': playAchievementSound(); spawnConfetti(); break;
        case 'pet': playMeowSound(); break;
        case 'meow': playMeowSound(); break;
    }
}

/* === js/state.js === */
function deepClone(obj) {
    return JSON.parse(JSON.stringify(obj));
}

function cloneSkillsByClass(skillsByClass) {
    const out = {};
    for (const cls of Object.keys(skillsByClass)) {
        out[cls] = deepClone(skillsByClass[cls]);
    }
    return out;
}

// Миграция: старые плоские массивы → новая структура по классам
function migrateOldSkills(oldSkills, skillsByClass) {
    // Если пришли старые данные (плоский массив), пытаемся сопоставить по id
    if (Array.isArray(oldSkills)) {
        const migrated = cloneSkillsByClass(skillsByClass);
        for (const flatSkill of oldSkills) {
            for (const cls of Object.keys(migrated)) {
                const idx = migrated[cls].findIndex(s => s.id === flatSkill.id);
                if (idx >= 0) {
                    migrated[cls][idx].progress = flatSkill.progress || 0;
                    migrated[cls][idx].status = flatSkill.status || 'locked';
                }
            }
        }
        return migrated;
    }
    // Если уже новая структура, возвращаем как есть
    if (oldSkills && typeof oldSkills === 'object' && oldSkills[CLASSES.C12]) {
        return oldSkills;
    }
    return cloneSkillsByClass(skillsByClass);
}

    currentStory: null,
    storyStep: 0,
    storyAnswered: false,
    subjectSwitches: 0,
    classSwitches: 0,
    perfectLessons: 0,
    difficultyLevel: 0,
    theme: DEFAULT_THEME,
    ownedItems: { hats: ['none'], glasses: ['none'], skins: ['orange'], accessories: ['none'] },
    activeItems: { hat: 'none', glasses: 'none', skin: 'orange', accessory: 'none' }
};

const saveState = () => {
    const data = {
        skills: state.skills,
        gems: state.gems,
        streak: state.streak,
        storiesCompleted: state.storiesCompleted,
        traps: state.traps,
        achievements: state.achievements,
        totalPets: state.totalPets,
        subject: state.subject,
        currentClass: state.currentClass,
        subjectSwitches: state.subjectSwitches,
        classSwitches: state.classSwitches,
        perfectLessons: state.perfectLessons,
        difficultyLevel: state.difficultyLevel,
        theme: state.theme,
        ownedItems: state.ownedItems,
        activeItems: state.activeItems
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
};

const loadState = () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    try {
        const data = JSON.parse(saved);
        if (data.skills) {
            // Математика
            if (data.skills[SUBJECTS.MATH]) {
                state.skills[SUBJECTS.MATH] = migrateOldSkills(data.skills[SUBJECTS.MATH], MATH_SKILLS_BY_CLASS);
            }
            // Русский
            if (data.skills[SUBJECTS.RUSSIAN]) {
                state.skills[SUBJECTS.RUSSIAN] = migrateOldSkills(data.skills[SUBJECTS.RUSSIAN], RUS_SKILLS_BY_CLASS);
            }
        }
        if (data.gems !== undefined) state.gems = data.gems;
        if (data.streak !== undefined) state.streak = data.streak;
        if (data.storiesCompleted) state.storiesCompleted = { ...state.storiesCompleted, ...data.storiesCompleted };
        if (data.traps) state.traps = data.traps;
        if (data.achievements) {
            Object.keys(data.achievements).forEach(key => {
                if (state.achievements[key] && data.achievements[key].unlocked) state.achievements[key].unlocked = true;
            });
        }
        if (data.totalPets !== undefined) state.totalPets = data.totalPets;
        if (data.subject) state.subject = data.subject;
        if (data.currentClass) state.currentClass = data.currentClass;
        if (data.subjectSwitches !== undefined) state.subjectSwitches = data.subjectSwitches;
        if (data.classSwitches !== undefined) state.classSwitches = data.classSwitches;
        if (data.perfectLessons !== undefined) state.perfectLessons = data.perfectLessons;
        if (data.difficultyLevel !== undefined) state.difficultyLevel = data.difficultyLevel;
        if (data.theme) state.theme = data.theme;
        if (data.ownedItems) state.ownedItems = data.ownedItems;
        if (data.activeItems) state.activeItems = data.activeItems;
    } catch (e) { console.warn('Ошибка загрузки:', e); }
};

/** Получить навыки текущего класса и предмета */
const getCurrentSkills = () => {
    const cls = state.currentClass;
    return state.skills[state.subject]?.[cls] || [];
};

/** Получить все навыки текущего предмета (плоский список всех классов) */
const getAllCurrentSubjectSkills = () => {
    const classesSkills = state.skills[state.subject];
    if (!classesSkills) return [];
    return Object.values(classesSkills).flat();
};

/** Найти навык по id в любом классе текущего предмета */
const findSkillById = (skillId) => {
    const subjectSkills = state.skills[state.subject];
    if (!subjectSkills) return null;
    for (const cls of Object.values(CLASSES)) {
        const found = (subjectSkills[cls] || []).find(s => s.id === skillId);
        if (found) return { skill: found, cls };
    }
    return null;
};

const unlockAchievement = (id, onUnlock) => {
    const ach = state.achievements[id];
    if (!ach || ach.unlocked) return false;
    ach.unlocked = true;
    state.gems += GEMS.ACHIEVEMENT_REWARD;
    saveState();
    if (onUnlock) onUnlock(ach.name, ach.desc);
    return true;
};

const checkAchievements = (onUnlock) => {
    const done = (state.storiesCompleted.math ? 1 : 0) + (state.storiesCompleted.rus1 ? 1 : 0) + (state.storiesCompleted.rus2 ? 1 : 0);
    const def = state.traps.reduce((s, t) => s + t.defuses, 0);
    const checks = {
        detective: done >= 1,
        sherlock: done >= 2,
        holmes: done >= 3,
        saper: def >= 1,
        hunter: def >= 3,
        murmur: state.totalPets >= 10,
        firstBlood: state.traps.length > 0,
        explorer: state.classSwitches >= 3,
        seasoned: state.perfectLessons >= 5
    };
    Object.entries(checks).forEach(([id, cond]) => { if (cond) unlockAchievement(id, onUnlock); });

    // Проверка "Олимпиец" — все навыки текущего класса пройдены
    const currentSkills = getCurrentSkills();
    if (currentSkills.every(s => s.progress >= 100)) {
        unlockAchievement('olympian', onUnlock);
    }
};

const getAvailableTraps = () => {
    return state.traps.filter(t => t.defuses < TRAP.MAX_DEFUSES && t.subject === state.subject);
};

const getDefusedTraps = () => state.traps.filter(t => t.defuses >= TRAP.MAX_DEFUSES && t.subject === state.subject);

const resetAllProgress = () => {
    state.skills[SUBJECTS.MATH] = cloneSkillsByClass(MATH_SKILLS_BY_CLASS);
    state.skills[SUBJECTS.RUSSIAN] = cloneSkillsByClass(RUS_SKILLS_BY_CLASS);
    state.gems = 245;
    state.streak = 7;
    state.totalPets = 0;
    state.subjectSwitches = 0;
    state.classSwitches = 0;
    state.perfectLessons = 0;
    state.difficultyLevel = 0;
    state.storiesCompleted = { math: false, rus1: false, rus2: false };
    state.traps = [];
    state.achievements = deepClone(ACHIEVEMENTS_DEF);
    state.subject = SUBJECTS.MATH;
    state.currentClass = CLASSES.C12;
    state.theme = DEFAULT_THEME;
    state.ownedItems = { hats: ['none'], glasses: ['none'], skins: ['orange'], accessories: ['none'] };
    state.activeItems = { hat: 'none', glasses: 'none', skin: 'orange', accessory: 'none' };
    localStorage.removeItem(STORAGE_KEY);
    applyTheme(DEFAULT_THEME);
};

/** Применить тему к body и CSS-переменным */
const applyTheme = (themeId) => {
    const t = getTheme(themeId);
    if (!t) return;

    Object.keys(THEMES).forEach(k => document.body.classList.remove('theme-' + k));
    document.body.classList.add('theme-' + themeId);

    const root = document.documentElement;
    root.style.setProperty('--bg', t.bg);
    root.style.setProperty('--card', t.card);
    root.style.setProperty('--text', t.text);
    root.style.setProperty('--text-light', t.textLight);
    root.style.setProperty('--theme-primary', t.primary);
    root.style.setProperty('--theme-accent', t.accent);

    document.body.style.background = t.gradient;
    document.body.style.backgroundSize = '400% 400%';

    const catBody = document.getElementById('catBody');
    const catAvatar = document.getElementById('catAvatar');
    if (catBody) catBody.textContent = t.catEmoji;
    if (catAvatar) catAvatar.textContent = t.catEmoji;

    state.theme = themeId;
};

/** Проверить и разблокировать темы по прогрессу */
const checkThemeUnlocks = () => {
    const totalMath = countCompletedLessons(getAllSkillsForSubject(SUBJECTS.MATH));
    const totalRus = countCompletedLessons(getAllSkillsForSubject(SUBJECTS.RUSSIAN));
    const totalDone = totalMath + totalRus;
    Object.values(THEMES).forEach(t => {
        if (!t.unlocked && t.unlockAt && totalDone >= t.unlockAt) {
            t.unlocked = true;
        }
    });
};

/** Получить плоский список всех навыков предмета (для подсчёта прогресса тем) */
function getAllSkillsForSubject(subject) {
    const skills = state.skills[subject];
    if (!skills) return [];
    return Object.values(skills).flat();
}

function applesSVG(count, color = '#EF4444') {
    const rows = Math.ceil(count / 5);
    const perRow = Math.min(count, 5);
    let circles = '';
    for (let r = 0; r < rows; r++) {
        const inRow = r === rows - 1 ? (count % 5 || 5) : 5;
        for (let c = 0; c < inRow; c++) {
            const cx = 20 + c * 28 + (rows > 1 && r === rows - 1 ? (5 - inRow) * 14 : 0);
            const cy = 25 + r * 32;
            circles += `<circle cx="${cx}" cy="${cy}" r="11" fill="${color}" stroke="#B91C1C" stroke-width="1.5"/>
            <line x1="${cx - 4}" y1="${cy - 5}" x2="${cx + 1}" y2="${cy - 9}" stroke="#7F1D1D" stroke-width="2" stroke-linecap="round"/>`;
        }
    }
    const h = Math.max(60, rows * 32 + 16);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 ${h}" width="150" height="${h}">${circles}</svg>`;
}

function applesTwoGroups(a, b) {
    const svgA = applesSVG(a, '#EF4444');
    const svgB = applesSVG(b, '#F59E0B');
    // Simple side-by-side via a wrapper div is easier, but for inline SVG we compose
    const rowsA = Math.ceil(a / 5); const perRowA = Math.min(a, 5);
    const rowsB = Math.ceil(b / 5); const perRowB = Math.min(b, 5);
    const H = Math.max(rowsA, rowsB) * 32 + 30;
    let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 ${H}" width="300" height="${H}">`;
    // group A label
    out += `<text x="75" y="14" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700">🍎 группа А</text>`;
    for (let r = 0; r < rowsA; r++) {
        const inRow = r === rowsA - 1 ? (a % 5 || 5) : 5;
        for (let c = 0; c < inRow; c++) {
            const cx = 35 + c * 28 + (rowsA > 1 && r === rowsA - 1 ? (5 - inRow) * 14 : 0);
            const cy = 30 + r * 32;
            out += `<circle cx="${cx}" cy="${cy}" r="11" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
            <line x1="${cx - 4}" y1="${cy - 5}" x2="${cx + 1}" y2="${cy - 9}" stroke="#7F1D1D" stroke-width="2" stroke-linecap="round"/>`;
        }
    }
    // group B label
    out += `<text x="225" y="14" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700">🍎 группа Б</text>`;
    for (let r = 0; r < rowsB; r++) {
        const inRow = r === rowsB - 1 ? (b % 5 || 5) : 5;
        for (let c = 0; c < inRow; c++) {
            const cx = 185 + c * 28 + (rowsB > 1 && r === rowsB - 1 ? (5 - inRow) * 14 : 0);
            const cy = 30 + r * 32;
            out += `<circle cx="${cx}" cy="${cy}" r="11" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
            <line x1="${cx - 4}" y1="${cy - 5}" x2="${cx + 1}" y2="${cy - 9}" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>`;
        }
    }
    out += '</svg>';
    return out;
}

function subSVG(total, eaten) {
    const H = Math.ceil(total / 5) * 32 + 30;
    let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 ${H}" width="280" height="${H}">`;
    out += `<text x="140" y="14" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700">Было ${total} 🍎</text>`;
    for (let r = 0; r < Math.ceil(total / 5); r++) {
        const inRow = r === Math.ceil(total / 5) - 1 ? (total % 5 || 5) : 5;
        for (let c = 0; c < (r < Math.ceil(total / 5) - 1 ? 5 : inRow); c++) {
            const idx = r * 5 + c;
            const cx = 40 + c * 36;
            const cy = 30 + r * 32;
            const isEaten = idx < eaten;
            const fill = isEaten ? '#E2E8F0' : '#EF4444';
            const stroke = isEaten ? '#CBD5E1' : '#B91C1C';
            out += `<circle cx="${cx}" cy="${cy}" r="11" fill="${fill}" stroke="${stroke}" stroke-width="1.5" stroke-dasharray="${isEaten ? '3 2' : 'none'}"/>`;
            if (isEaten) {
                out += `<line x1="${cx - 5}" y1="${cy - 5}" x2="${cx + 5}" y2="${cy + 5}" stroke="#CBD5E1" stroke-width="2"/>
                <line x1="${cx + 5}" y1="${cy - 5}" x2="${cx - 5}" y2="${cy + 5}" stroke="#CBD5E1" stroke-width="2"/>`;
            } else {
                out += `<line x1="${cx - 4}" y1="${cy - 5}" x2="${cx + 1}" y2="${cy - 9}" stroke="#7F1D1D" stroke-width="2" stroke-linecap="round"/>`;
            }
        }
    }
    out += '</svg>';
    return out;
}

function mulGridSVG(rows, cols) {
    const cellW = cols <= 8 ? 32 : Math.max(20, Math.floor(280 / cols));
    const cellH = 28;
    const W = Math.max(100, cols * cellW + 20);
    const H = rows * cellH + 30;
    let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
    out += `<text x="${W / 2}" y="14" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700">${rows} ряда × ${cols} 🍎</text>`;
    const r = cols <= 8 ? 10 : Math.max(5, Math.floor(cellW / 3));
    for (let row = 0; row < rows; row++) {
        for (let c = 0; c < cols; c++) {
            const cxc = 14 + c * cellW + cellW / 2;
            const cy = 28 + row * cellH;
            out += `<circle cx="${cxc}" cy="${cy}" r="${r}" fill="#F59E0B" stroke="#D97706" stroke-width="1.2"/>`;
            out += `<line x1="${cxc - r * 0.3}" y1="${cy - r * 0.4}" x2="${cxc + r * 0.1}" y2="${cy - r * 0.8}" stroke="#92400E" stroke-width="${Math.max(1, r / 5)}" stroke-linecap="round"/>`;
        }
    }
    out += '</svg>';
    return out;
}

function divBasketsSVG(total, baskets) {
    const perBasket = Math.floor(total / baskets);
    const rem = total - perBasket * baskets;
    const W = baskets * 60 + 20;
    const H = (perBasket + (rem > 0 ? 1 : 0)) * 22 + 80;
    let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
    out += `<text x="${W / 2}" y="12" text-anchor="middle" font-size="10" fill="#94A3B8" font-weight="700">${total} 🍎 в ${baskets} корзинах</text>`;
    for (let b = 0; b < baskets; b++) {
        const bx = 14 + b * 60;
        // basket
        out += `<path d="M${bx} 40 L${bx + 10} ${H - 16} L${bx + 38} ${H - 16} L${bx + 48} 40 Z" fill="#D4A373" stroke="#B8845A" stroke-width="1.5"/>`;
        // apples in basket
        const count = b < rem ? perBasket + 1 : perBasket;
        for (let a = 0; a < count; a++) {
            const ax = bx + 14 + (a % 3) * 16;
            const ay = H - 28 - Math.floor(a / 3) * 18;
            out += `<circle cx="${ax}" cy="${ay}" r="5" fill="#EF4444" stroke="#B91C1C" stroke-width="0.8"/>`;
        }
    }
    out += '</svg>';
    return out;
}

function eqScaleSVG(leftExpr, rightVal) {

function geomRectSVG(w, h, label) {

function pizzaSVG(eaten, total) {
    const slices = [];
    for (let i = 0; i < total; i++) {
        const fromAngle = (i / total) * 360;
        const toAngle = ((i + 1) / total) * 360;
        const fromRad = (fromAngle - 90) * Math.PI / 180;
        const toRad = (toAngle - 90) * Math.PI / 180;
        const x1 = 100 + 70 * Math.cos(fromRad);
        const y1 = 100 + 70 * Math.sin(fromRad);
        const x2 = 100 + 70 * Math.cos(toRad);
        const y2 = 100 + 70 * Math.sin(toRad);
        const eatenSlice = i < eaten;
        slices.push(`<path d="M100 100 L${x1} ${y1} A70 70 0 0 1 ${x2} ${y2} Z" fill="${eatenSlice ? '#E2E8F0' : '#F59E0B'}" stroke="#92400E" stroke-width="1.5"/>`);
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
        ${slices.join('')}
        <text x="100" y="190" text-anchor="middle" font-size="12" fill="#94A3B8" font-weight="700">Съедено ${eaten} из ${total}</text>
    </svg>`;
    return svg;
}

function generateAddLesson() {
    const t = [];
    const add = (a, b) => a + b;
    const DIFF_STEP = 5; // увеличение верхней границы на 5 за уровень

    // 1. Разминка
    {
        const [minA, maxA] = adaptiveRange(3, 15, DIFF_STEP);
        const [minB, maxB] = adaptiveRange(3, 15, DIFF_STEP);
        const [a, b] = [rnd(minA, maxA), rnd(minB, maxB)];
        t.push(choiceT('🔥', 'Разминка', 'badge-warmup', `${a} + ${b} = ?`, add(a, b), 'Просто складываем два числа'));
    }
    // 2. Визуальное — две группы яблок
    {
        const [minA, maxA] = adaptiveRange(3, 7, 2);
        const [minB, maxB] = adaptiveRange(3, 7, 2);
        const [a, b] = [rnd(minA, maxA), rnd(minB, maxB)];
        const svg = applesTwoGroups(a, b);
        t.push(visualT('🖼️', 'Визуальное', 'badge-visual', svg, `Сколько всего яблок?`, add(a, b), makeWrongs(add(a, b)), `${a} красных + ${b} жёлтых = ${add(a, b)}`));
    }
    // 3. Выбор
    {
        const [minA, maxA] = adaptiveRange(10, 40, DIFF_STEP);
        const [minB, maxB] = adaptiveRange(10, 40, DIFF_STEP);
        const [a, b] = [rnd(minA, maxA), rnd(minB, maxB)];
        t.push(choiceT('🎯', 'Выбор', 'badge-choice', `${a} + ${b} = ?`, add(a, b), `Складываем: ${a} + ${b}`));
    }
    // 4. Парное
    {
        const pd = []; const used = new Set();
        const [pMin, pMax] = adaptiveRange(5, 30, DIFF_STEP);
        while (pd.length < 3) {
            const [a, b] = [rnd(pMin, pMax), rnd(pMin, pMax)];
            const ans = add(a, b);
            if (!used.has(ans)) { used.add(ans); pd.push({ left: `${a} + ${b}`, right: `${ans}`, answer: ans }); }
        }
        t.push(pairT('🔗', 'Парное', 'badge-pair', 'Соедини выражение с ответом:', pd, 'Сопоставляем суммы'));
    }
    // 5. Ввод
    {
        const [minA, maxA] = adaptiveRange(15, 60, DIFF_STEP * 2);
        const [minB, maxB] = adaptiveRange(10, 40, DIFF_STEP);
        const [a, b] = [rnd(minA, maxA), rnd(minB, maxB)];
        t.push(inputT('✏️', 'Ввод', 'badge-input', `${a} + ${b} = ?`, add(a, b), `${a} + ${b} = ${add(a, b)}`));
    }
    // 6. Ловушка хитрая
    {
        const [sMin, sMax] = adaptiveRange(10, 30, DIFF_STEP);
        const secret = rnd(sMin, sMax);
        t.push(choiceT('⚠️', 'Ловушка', 'badge-trap',
            `Если у Маши ${secret} конфет, а Петя дал ей ещё 0, сколько стало?`,
            secret,
            'Если прибавить 0 — ничего не меняется! Не дай себя обмануть'));
    }
    // 7. Ввод сложнее
    {
        const [minA, maxA] = adaptiveRange(10, 30, DIFF_STEP);
        const [a, b, c] = [rnd(minA, maxA), rnd(minA, maxA), rnd(minA, maxA)];
        t.push(inputT('✏️', 'Ввод', 'badge-input',
            `${a} + ${b} + ${c} = ?`, add(add(a, b), c),
            `${a}+${b}=${add(a,b)}, +${c}=${add(add(a,b),c)}`));
    }
    // 8. Босс — 3 подзадания
    {
        const [bMin1, bMax1] = adaptiveRange(2, 8, 2);
        const a1 = rnd(bMin1, bMax1), b1 = rnd(bMin1, bMax1);
        const [bMin2, bMax2] = adaptiveRange(10, 30, DIFF_STEP);
        const a2 = rnd(bMin2, bMax2), a3 = rnd(1, a2 - 1);
        const [bMin3, bMax3] = adaptiveRange(10, 50, DIFF_STEP);

}

function generateSubLesson() {
    const t = [];
    const D = 5; // шаг увеличения за уровень сложности
    const g = () => {
        const [minX, maxX] = adaptiveRange(15, 50, D);
        const x = rnd(minX, maxX);
        const ymax = Math.max(3, x - 3);
        const y = rnd(3, ymax);
        return [x, y];
    };
    const sub = (a, b) => a - b;

    // 1. Разминка
    {
        const [a, b] = g();
        t.push(choiceT('🔥', 'Разминка', 'badge-warmup', `${a} − ${b} = ?`, sub(a, b), 'Вычитаем меньшее из большего'));
    }
    // 2. Визуальное — яблоки, часть съедена
    {
        const [minT, maxT] = adaptiveRange(8, 15, 2);
        const total = rnd(minT, maxT);
        const eaten = rnd(2, total - 2);
        const svg = subSVG(total, eaten);
        t.push(visualT('🖼️', 'Визуальное', 'badge-visual', svg,
            `Сколько яблок осталось?`, total - eaten,
            makeWrongs(total - eaten),
            `Было ${total}, съели ${eaten} → осталось ${total - eaten}`));
    }
    // 3. Выбор
    {
        const [a, b] = g();
        t.push(choiceT('🎯', 'Выбор', 'badge-choice', `${a} − ${b} = ?`, sub(a, b), `${a} − ${b} = ${sub(a, b)}`));
    }
    // 4. Парное
    {
        const pd = []; const used = new Set();
        while (pd.length < 3) {
            const [a, b] = g();
            const ans = sub(a, b);
            if (!used.has(ans)) { used.add(ans); pd.push({ left: `${a} − ${b}`, right: `${ans}`, answer: ans }); }
        }
        t.push(pairT('🔗', 'Парное', 'badge-pair', 'Соедини выражение с ответом:', pd, 'Сопоставляем разности'));
    }
    // 5. Ввод
    {
        const [a, b] = g();
        t.push(inputT('✏️', 'Ввод', 'badge-input', `${a} − ${b} = ?`, sub(a, b), `${a} − ${b} = ${sub(a, b)}`));
    }
    // 6. Ловушка хитрая
    {
        const [minN, maxN] = adaptiveRange(10, 25, D);
        const [minDec, maxDec] = adaptiveRange(3, 8, 1);
        const n = rnd(minN, maxN);
        const decoy = rnd(minDec, maxDec);
        t.push(choiceT('⚠️', 'Ловушка', 'badge-trap',
            `${n} − ${decoy} + ${decoy} = ?`,
            n,
            `Сначала вычли ${decoy}, потом прибавили — вернулись к ${n}! Порядок действий важен`));
    }
    // 7. Ввод сложнее
    {
        const [minM, maxM] = adaptiveRange(40, 90, D * 2);
        const [minBk, maxBk] = adaptiveRange(10, 25, D);
        const [minPn, maxPn] = adaptiveRange(5, 12, 2);
        const [money, book, pen] = [rnd(minM, maxM), rnd(minBk, maxBk), rnd(minPn, maxPn)];
        const ans7 = money - book - pen;
        t.push(inputT('✏️', 'Ввод', 'badge-input',
            `У Маши ${money} руб. Купила книгу за ${book} руб. и ручку за ${pen} руб. Осталось?`,
            ans7,
            `${money} − ${book} − ${pen} = ${ans7}`));
    }
    // 8. Босс — 3 подзадания
    {
        const [minA1, maxA1] = adaptiveRange(30, 80, D);
        const a1 = rnd(minA1, maxA1), b1 = rnd(10, a1 - 5);
        const [minA2, maxA2] = adaptiveRange(40, 100, D * 2);
        const a2 = rnd(minA2, maxA2), b2 = rnd(5, 20), c2 = rnd(5, 15);
        const [minA3, maxA3] = adaptiveRange(20, 60, D);
        const a3 = rnd(minA3, maxA3), b3 = rnd(5, a3 - 5);
        t.push(bossT('⭐', 'Босс', 'badge-boss', 'Реши задачи на вычитание:', [
            { label: `${a1} − ${b1}`, correctAns: a1 - b1, hint: `${a1} − ${b1} = ${a1 - b1}` },
            { label: `Было ${a2}₽, купил за ${b2}₽, потом нашёл ${c2}₽. Сколько?`, correctAns: a2 - b2 + c2, hint: `${a2}−${b2}=${a2-b2}, +${c2}=${a2-b2+c2}` },
            { label: `Из ${a3} вычти ${b3}`, correctAns: a3 - b3, hint: `${a3} − ${b3} = ${a3 - b3}` }
        ], 'Вычитание — обратное сложению!'));
    }
    return t;
}

    const sameDen = () => { const d = rnd(4, 10); return { d, n1: rnd(1, d - 2), n2: rnd(1, d - 2) }; };

    // 1. Разминка
    t.push(choiceT('🔥', 'Разминка', 'badge-warmup',
        'Какая дробь больше: 1/4 или 3/4?', '3/4',
        'Одинаковый знаменатель → больше та, где больше числитель'));

    // 2. Визуальное — пицца
    {
        const total = 8;
        const eaten = rnd(2, 5);
        const svg = pizzaSVG(eaten, total);
        t.push(visualT('🖼️', 'Визуальное', 'badge-visual', svg,
            `Какая часть пиццы осталась? (в формате N/${total})`,
            `${total - eaten}/${total}`,
            [`${total - eaten}/${total}`, `${eaten}/${total}`, `${total - eaten - 1}/${total}`, `${total - eaten + 1}/${total}`],
            `Было ${total}, съели ${eaten} → осталось ${total - eaten}/${total}`));
    }

    // 3. Сложение с одинаковыми знаменателями
    {
        const { d, n1, n2 } = sameDen();
        const sum = n1 + n2;
        const r = reduce(sum, d);
        t.push(choiceT('🎯', 'Сложение', 'badge-choice',
            `${fracStr(n1, d)} + ${fracStr(n2, d)} = ?`,
            r.d === 1 ? `${r.n}` : `${fracStr(r.n, r.d)}`,
            `Числители: ${n1}+${n2}=${sum}. ${r.d > 1 ? `Сокращаем: ${fracStr(sum, d)} → ${fracStr(r.n, r.d)}` : `Ответ: ${r.n}`}`));
    }

    // 4. Парное — дроби от числа
    {
        const pd = [
            { left: '1/2 от 10', right: '5', answer: '5' },
            { left: '1/3 от 9', right: '3', answer: '3' },
            { left: '1/4 от 8', right: '2', answer: '2' },
            { left: '2/3 от 12', right: '8', answer: '8' }
        ];
        t.push(pairT('🔗', 'Парное', 'badge-pair', 'Соедини дробь от числа с ответом:', pd, 'Находим дробь от числа'));
    }

    // 5. Сравнение дробей с разными знаменателями
    {
        const { n: n1, d: d1 } = rFrac();
        let { n: n2, d: d2 } = rFrac();
        while (fracStr(n1, d1) === fracStr(n2, d2)) { const f = rFrac(); n2 = f.n; d2 = f.d; }
        const v1 = n1 * d2, v2 = n2 * d1;
        const bigger = v1 > v2 ? fracStr(n1, d1) : fracStr(n2, d2);
        t.push(choiceT('⚖️', 'Сравнение', 'badge-choice',
            `Какая дробь больше: ${fracStr(n1, d1)} или ${fracStr(n2, d2)}?`,
            bigger,
            `Приводим к общему: ${n1}×${d2}=${v1} vs ${n2}×${d1}=${v2} → ${bigger}`));
    }

    // 6. Ловушка хитрая
    t.push(choiceT('⚠️', 'Ловушка', 'badge-trap',
        '1/2 + 1/2 = ? (не 2/4!)',
        '1',
        '1/2 + 1/2 = 2/2 = 1 целое! Знаменатели НЕ складываем!'));

    // 7. Сложение с разными знаменателями
    {
        const { n: n1, d: d1 } = rFrac();
        let { n: n2, d: d2 } = rFrac();
        while (d1 === d2) { const f = rFrac(); n2 = f.n; d2 = f.d; }
        const cd = lcm(d1, d2);
        const num = n1 * (cd / d1) + n2 * (cd / d2);
        const r = reduce(num, cd);
        t.push(choiceT('🧮', 'Разные знам.', 'badge-input',
            `${fracStr(n1, d1)} + ${fracStr(n2, d2)} = ?`,
            r.d === 1 ? `${r.n}` : `${fracStr(r.n, r.d)}`,
            `Общий знам.=${cd}: ${n1 * (cd / d1)}/${cd}+${n2 * (cd / d2)}/${cd}=${num}/${cd}${
                r.d < cd && r.d > 1 ? `=${fracStr(r.n, r.d)}` : ''}`));
    }

    // 8. Вычитание дробей
    {
        const d = rnd(3, 8);
        const n1 = rnd(d - Math.ceil(d / 3), d);
        const n2 = rnd(1, n1);
        const diff = n1 - n2;
        const r = reduce(diff, d);
        t.push(choiceT('➖', 'Вычитание', 'badge-choice',
            `${fracStr(n1, d)} − ${fracStr(n2, d)} = ?`,
            r.d === 1 ? `${r.n}` : `${fracStr(r.n, r.d)}`,
            `Числители: ${n1}−${n2}=${diff} → ${fracStr(diff, d)}${r.d < d ? ` = ${fracStr(r.n, r.d)}` : ''}`));
    }

    // 9. Дробь от числа
    {
        const d = rnd(3, 6);
        const n = rnd(1, d - 1);
        const total = d * rnd(3, 7);
        t.push(inputT('✏️', 'Дробь от числа', 'badge-input',
            `${fracStr(n, d)} от ${total} = ?`,
            Math.round(total * n / d),
            `${total} ÷ ${d} × ${n} = ${Math.round(total * n / d)}`));
    }

    // 10. Целое по части
    {
        const d = rnd(3, 6);
        const n = rnd(2, d - 1);
        const part = rnd(2, 5) * n;
        const whole = Math.round(part * d / n);
        t.push(choiceT('🔍', 'Целое по части', 'badge-input',
            `Если ${fracStr(n, d)} числа равно ${part}, то всё число = ?`,
            whole,
            `${part} ÷ ${n} × ${d} = ${whole}. Проверка: ${fracStr(n, d)} от ${whole} = ${part}`));
    }

    // 11. Умножение дробей
    {
        const f1 = rFrac(), f2 = rFrac();
        const r = reduce(f1.n * f2.n, f1.d * f2.d);
        t.push(choiceT('✖️', 'Умножение', 'badge-choice',
            `${fracStr(f1.n, f1.d)} × ${fracStr(f2.n, f2.d)} = ?`,
            r.d === 1 ? `${r.n}` : `${fracStr(r.n, r.d)}`,
            `${f1.n}×${f2.n}=${f1.n * f2.n} / ${f1.d}×${f2.d}=${f1.d * f2.d} → ${
                r.d === 1 ? `${r.n}` : fracStr(r.n, r.d)}`));
    }

    // 12. Деление дробей
    {
        const f1 = rFrac(), f2 = rFrac();
        const r = reduce(f1.n * f2.d, f1.d * f2.n);
        t.push(choiceT('➗', 'Деление', 'badge-choice',
            `${fracStr(f1.n, f1.d)} ÷ ${fracStr(f2.n, f2.d)} = ?`,
            r.d === 1 ? `${r.n}` : `${fracStr(r.n, r.d)}`,
            `Переворачиваем вторую: ${fracStr(f1.n, f1.d)} × ${fracStr(f2.d, f2.n)} → ${
                r.d === 1 ? `${r.n}` : fracStr(r.n, r.d)}`));
    }

    // 13. Босс — 5 подзаданий
    {
        const t1 = 12; const e1 = rnd(3, 8);
        const { d: db2, n1: nb2_1, n2: nb2_2 } = sameDen();
        const f3 = rFrac();
        const d4 = rnd(3, 6), n4 = rnd(2, d4 - 1), p4 = rnd(2, 5) * n4, w4 = Math.round(p4 * d4 / n4);
        t.push(bossT('⭐', 'Босс', 'badge-boss', 'Финальный тест по дробям:', [
            { label: `Торт на ${t1} кусков. Съели ${e1}. Осталось? (N/${t1})`,
                correctAns: `${t1 - e1}/${t1}`, hint: `${t1} − ${e1} = ${t1 - e1} → ${t1 - e1}/${t1}` },
            { label: `${fracStr(nb2_1, db2)} + ${fracStr(nb2_2, db2)} = ? (сократи если надо)`,
                correctAns: reduce(nb2_1 + nb2_2, db2).d === 1 ? `${reduce(nb2_1 + nb2_2, db2).n}` : `${fracStr(reduce(nb2_1 + nb2_2, db2).n, reduce(nb2_1 + nb2_2, db2).d)}`,
                hint: `${nb2_1}+${nb2_2}=${nb2_1 + nb2_2}. ${reduce(nb2_1 + nb2_2, db2).d < db2 ? `Сократили → ${fracStr(reduce(nb2_1 + nb2_2, db2).n, reduce(nb2_1 + nb2_2, db2).d)}` : ''}` },
            { label: `${fracStr(f3.n, f3.d)} × ${fracStr(f3.n, f3.d)} = ?`,
                correctAns: reduce(f3.n * f3.n, f3.d * f3.d).d === 1 ? `${reduce(f3.n * f3.n, f3.d * f3.d).n}` : `${fracStr(reduce(f3.n * f3.n, f3.d * f3.d).n, reduce(f3.n * f3.n, f3.d * f3.d).d)}`,
                hint: `${f3.n}²/${f3.d}² = ${fracStr(reduce(f3.n * f3.n, f3.d * f3.d).n, reduce(f3.n * f3.n, f3.d * f3.d).d)}` },
            { label: `Если ${fracStr(n4, d4)} числа = ${p4}, всё число = ?`, correctAns: w4,
                hint: `${p4} ÷ ${n4} × ${d4} = ${w4}` },
            { label: `Сколько шестых в 3 целых? (формат: X/6)`, correctAns: '18/6',
                hint: `3 × 6/6 = 18/6` }
        ], 'Дроби — это части целого!'));
    }

    return t;
}

function generatePropLesson() {

        const b = a * rnd(2, 4);

        t.push(choiceT('⚡', `Пропорция #${i+2}`, 'badge-task',
            `${a} шт. — ${aVal} руб.\n${b} шт. — ?`, bVal,

    }
    // Визуальное: масштаб
    for (let i = 0; i < 2; i++) {
        const small = rnd(3, 6), big = small * rnd(2, 4);
        const svg = `<svg width="260" height="80" xmlns="http://www.w3.org/2000/svg">` +
            `<rect x="10" y="30" width="${small*12}" height="20" rx="4" fill="#EAB308"/><text x="${10+small*6}" y="20" text-anchor="middle" font-size="11">${small} см</text>` +

            `</svg>`;
        t.push(visualT('📏', 'Масштаб', 'badge-visual', svg,
            'Во сколько раз нижняя полоска длиннее верхней?', `${big/small} раза`,
            [`${big/small} раза`, '2 раза', '3 раза', '4 раза'],
            `${big} ÷ ${small} = ${big/small}`));
    }
    // Босс
    {
        const a = rnd(3, 8), aVal = a * rnd(10, 30);
        const b = a * rnd(2, 5);
        const bVal = Math.round(aVal * b / a);
        t.push(choiceT('🐱', 'Босс', 'badge-boss',

            `Прямая пропорциональность: ${aVal} × ${b} / ${a} = ${bVal}`));
    }
    return t;
}

function letterChoiceSVG(word, missingIdx, options) {
    const chars = word.split('');
    const boxSize = 28;
    const W = chars.length * boxSize + 20;
    const H = 62;
    let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
    chars.forEach((ch, i) => {
        const x = 10 + i * boxSize;
        if (i === missingIdx) {
            out += `<rect x="${x}" y="10" width="${boxSize - 4}" height="${boxSize}" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2"/>
            <text x="${x + (boxSize - 4) / 2}" y="32" text-anchor="middle" font-size="16" fill="#F59E0B" font-weight="800">?</text>`;
        } else {
            out += `<text x="${x + (boxSize - 4) / 2}" y="32" text-anchor="middle" font-size="16" fill="#1E293B" font-weight="600">${ch}</text>`;
        }
    });
    out += `<text x="${W / 2}" y="58" text-anchor="middle" font-size="11" fill="#94A3B8">${options.join(' или ')}</text>`;
    out += '</svg>';
    return out;
}

function compareSVG(word1, word2, question) {
    const W = 280; const H = 80;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
        <rect x="10" y="6" width="120" height="32" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
        <text x="70" y="27" text-anchor="middle" font-size="14" fill="#1E293B" font-weight="700">${word1}</text>
        <rect x="150" y="6" width="120" height="32" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="210" y="27" text-anchor="middle" font-size="14" fill="#1E293B" font-weight="700">${word2}</text>
        <text x="140" y="62" text-anchor="middle" font-size="12" fill="#64748B" font-weight="600">${question}</text>
    </svg>`;
}

// js/components/taskRenderer.js



function renderTask(container, task, options = {}) {
    const { isBonus = false, compact = false } = options;

    return new Promise((resolve) => {
        container.innerHTML = '';

        if (task.emoji) {
            const emojiEl = document.createElement('div');
            emojiEl.className = compact ? 'scene-emoji' : 'lesson-emoji';
            emojiEl.textContent = task.emoji;
            container.appendChild(emojiEl);
        }

        if (task.badge && !compact) {
            const badgeEl = document.createElement('div');
            badgeEl.className = `lesson-type-badge ${task.badgeClass || ''}`;
            badgeEl.textContent = task.badge;
            container.appendChild(badgeEl);
        }

        const questionEl = document.createElement('div');
        questionEl.className = compact ? 'scene-text' : 'lesson-question';
        if (task.question) questionEl.textContent = task.question;
        container.appendChild(questionEl);

        const explanationEl = document.createElement('div');
        explanationEl.className = compact ? 'explanation-box' : 'lesson-explanation';
        container.appendChild(explanationEl);

        // SVG
        if (task.svg) {
            const svgDiv = document.createElement('div');
            svgDiv.className = 'visual-svg-wrapper';
            svgDiv.innerHTML = task.svg;
            svgDiv.style.cssText = 'width:100%;max-width:280px;margin:0 auto 8px;text-align:center;';
            container.appendChild(svgDiv);
        }

        if (task.type === 'visual') {
            renderVisual(container, task, explanationEl, resolve, isBonus, compact);
        } else if (task.type === 'choice') {
            renderChoice(container, task, explanationEl, resolve, isBonus, compact);
        } else if (task.type === 'input') {
            renderInput(container, task, explanationEl, resolve, isBonus, compact);
        } else if (task.type === 'pair') {
            renderPair(container, task, explanationEl, resolve, isBonus, compact);
        } else if (task.type === 'ordering') {
            renderOrdering(container, task, explanationEl, resolve, isBonus, compact);
        } else if (task.type && task.type.startsWith('boss')) {
            renderBoss(container, task, explanationEl, resolve, isBonus);
        }
    });
}

function renderVisual(container, task, explEl, resolve, isBonus, compact) {
    const optsClass = compact ? 'task-options' : 'lesson-options';
    const optClass = compact ? 'task-option' : 'lesson-option';

    const optsDiv = document.createElement('div');
    optsDiv.className = optsClass;

    const correctAnswer = task.correctAns;

    task.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = optClass;
        btn.textContent = optText;
        btn.dataset.idx = idx;
        btn.dataset.value = String(optText);

        btn.addEventListener('click', () => {
            optsDiv.querySelectorAll('button').forEach(b => b.style.pointerEvents = 'none');

            const isCorrect = String(btn.dataset.value) === String(correctAnswer);

            if (isCorrect) {
                playSound('correct', state.theme);
                btn.classList.add('correct-pick');
                btn.textContent = '✅ ' + optText;
                explEl.innerHTML = '<span style="font-size:16px;">✅</span> ' + task.explanation;
                explEl.className = (compact ? 'explanation-box' : 'lesson-explanation') + ' show good';
                setTimeout(() => resolve({ isCorrect: true, isBonus }), 400);
            } else {
                playSound('wrong', state.theme);
                btn.classList.add('wrong-pick');
                btn.textContent = '❌ ' + optText;
                optsDiv.querySelectorAll('button').forEach(b => {
                    if (String(b.dataset.value) === String(correctAnswer)) {
                        b.classList.add('correct-pick');
                        b.textContent = '✅ ' + b.dataset.value;
                    }
                });
                explEl.innerHTML = '<span style="font-size:16px;">🤔</span> ' + task.explanation;
                explEl.className = (compact ? 'explanation-box' : 'lesson-explanation') + ' show bad';
                setTimeout(() => resolve({ isCorrect: false, isBonus }), 600);
            }
        });

        optsDiv.appendChild(btn);
    });

    container.appendChild(optsDiv);
}

function renderInput(container, task, explEl, resolve, isBonus, compact) {
    const rowDiv = document.createElement('div');
    rowDiv.className = compact ? 'task-input-row' : 'lesson-input-row';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = compact ? 'task-input' : 'lesson-input';

    if (task.correctAns !== undefined && task.correctAns !== null) {
        const ansStr = String(task.correctAns).toLowerCase();
        if (ansStr === 'н' || ansStr === 'нн') input.placeholder = 'н/нн';
        else if (ansStr === 'ь' || ansStr === 'ъ') input.placeholder = 'ь/ъ';
        else if (ansStr === 'тся' || ansStr === 'ться') input.placeholder = 'тся/ться';
        else if (ansStr === 'и' || ansStr === 'е') input.placeholder = 'букву';
        else if (!isNaN(task.correctAns)) input.placeholder = 'Число';
        else input.placeholder = 'Ответ';
    } else {
        input.placeholder = 'Ответ';
    }
    input.autocomplete = 'off';

    const btn = document.createElement('button');
    btn.className = compact ? 'btn-submit' : 'btn-lesson-submit';
    btn.textContent = '✓';

    const submit = () => {
        const value = input.value.trim().toLowerCase();
        if (!value) {
            input.style.borderColor = 'var(--red)';
            input.style.animation = 'shake 0.5s ease';
            setTimeout(() => { input.style.animation = ''; input.style.borderColor = 'rgba(255,255,255,0.2)'; }, 500);
            return;
        }

        btn.disabled = true;
        input.disabled = true;

        const correctStr = String(task.correctAns).toLowerCase();
        let isCorrect = (value === correctStr);
        if (!isCorrect && correctStr.includes(',')) {
            isCorrect = value === correctStr.replace(/\s+/g, '');
        }

        if (isCorrect) {
            playSound('correct', state.theme);
            input.style.borderColor = 'var(--green)';
            input.style.background = 'rgba(16,185,129,0.2)';
            explEl.textContent = '✅ ' + task.explanation;
            explEl.className = (compact ? 'explanation-box' : 'lesson-explanation') + ' show good';
            resolve({ isCorrect: true, isBonus });
        } else {
            playSound('wrong', state.theme);
            input.style.borderColor = 'var(--red)';
            input.style.background = 'rgba(239,68,68,0.15)';
            explEl.textContent = '🤔 ' + task.explanation + ' ✅ ' + task.correctAns;
            explEl.className = (compact ? 'explanation-box' : 'lesson-explanation') + ' show bad';
            resolve({ isCorrect: false, isBonus });
        }
    };

    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

    rowDiv.appendChild(input);
    rowDiv.appendChild(btn);
    container.appendChild(rowDiv);
}

function renderPair(container, task, explEl, resolve, isBonus, compact) {
    const grid = document.createElement('div');
    grid.className = 'pair-grid';

    const leftDiv = document.createElement('div');
    leftDiv.className = 'pair-left';
    const rightDiv = document.createElement('div');
    rightDiv.className = 'pair-right';

    const leftItems = task.pairs.map((p, i) => ({ text: p.left, idx: i }));
    const rightItems = task.pairs.map((p, i) => ({ text: p.right, idx: i }));

    const shuf = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const shuffledLeft = shuf(leftItems);
    const shuffledRight = shuf(rightItems);

    let selectedLeft = null;
    let matchedCount = 0;
    const total = task.pairs.length;

    shuffledLeft.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'pair-item';
        btn.textContent = item.text;
        btn.dataset.pairIdx = item.idx;
        btn.dataset.side = 'left';
        leftDiv.appendChild(btn);
    });

    shuffledRight.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'pair-item';
        btn.textContent = item.text;
        btn.dataset.pairIdx = item.idx;
        btn.dataset.side = 'right';
        rightDiv.appendChild(btn);
    });

    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:11px;opacity:0.5;margin-top:6px;text-align:center;';
    hint.textContent = 'Нажимай: левый → правый';

    const allLeftBtns = leftDiv.querySelectorAll('.pair-item');
    const allRightBtns = rightDiv.querySelectorAll('.pair-item');

    allLeftBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.classList.contains('matched')) return;
            if (selectedLeft && selectedLeft.el === btn) {
                btn.classList.remove('selected');
                selectedLeft = null;
                return;
            }
            allLeftBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedLeft = { el: btn, idx: parseInt(btn.dataset.pairIdx) };
        });
    });

    allRightBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.classList.contains('matched')) return;
            if (!selectedLeft) return;

            const rightIdx = parseInt(btn.dataset.pairIdx);

            if (selectedLeft.idx === rightIdx) {
                playSound('correct', state.theme);
                selectedLeft.el.classList.add('matched');
                btn.classList.add('matched');
                matchedCount++;
                selectedLeft = null;
                allLeftBtns.forEach(b => b.classList.remove('selected'));

                if (matchedCount >= total) {
                    explEl.textContent = '✅ ' + (task.explanation || 'Все пары верны!');
                    explEl.className = (compact ? 'explanation-box' : 'lesson-explanation') + ' show good';
                    resolve({ isCorrect: true, isBonus });
                }
            } else {
                playSound('wrong', state.theme);
                btn.classList.add('wrong-flash');
                setTimeout(() => btn.classList.remove('wrong-flash'), 500);
                selectedLeft.el.classList.remove('selected');
                selectedLeft = null;
            }
        });
    });

    grid.appendChild(leftDiv);
    grid.appendChild(rightDiv);
    container.appendChild(grid);
    container.appendChild(hint);
}

// ─── ORDERING — расставь по порядку ───────────────────────
function renderOrdering(container, task, explEl, resolve, isBonus, compact) {
    const listDiv = document.createElement('div');
    listDiv.className = 'ordering-list';
    listDiv.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;';

    const correctOrder = task.correctAns; // массив правильного порядка
    // Перемешиваем элементы
    const shuffled = [...correctOrder].sort(() => Math.random() - 0.5);
    let userOrder = [...shuffled];
    const items = [];

    function rebuild() {
        listDiv.innerHTML = '';
        userOrder.forEach((val, idx) => {
            const chip = document.createElement('button');
            chip.className = 'ordering-chip';
            chip.textContent = val;
            chip.style.cssText = 'padding:8px 16px;border-radius:12px;border:2px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:white;font-size:15px;cursor:pointer;transition:all 0.2s;';
            chip.dataset.value = String(val);
            chip.dataset.idx = idx;

            chip.addEventListener('click', () => {
                // Удаляем из текущей позиции и добавляем в конец (циклический сдвиг)
                const currentIdx = parseInt(chip.dataset.idx);
                const moved = userOrder.splice(currentIdx, 1)[0];
                userOrder.push(moved);
                rebuild();
            });

            chip.addEventListener('mouseenter', () => {
                chip.style.borderColor = 'var(--neon-green)';
                chip.style.background = 'rgba(16,185,129,0.2)';
            });
            chip.addEventListener('mouseleave', () => {
                chip.style.borderColor = 'rgba(255,255,255,0.2)';
                chip.style.background = 'rgba(255,255,255,0.08)';
            });

            items.push(chip);
            listDiv.appendChild(chip);
        });
    }

    rebuild();

    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:11px;opacity:0.6;margin-top:4px;text-align:center;';
    hint.textContent = 'Нажимай на элемент, чтобы передвинуть его в конец';

    const submitBtn = document.createElement('button');
    submitBtn.className = compact ? 'btn-submit' : 'btn-lesson-submit';
    submitBtn.textContent = '✓ Готово';
    submitBtn.style.marginTop = '8px';

    submitBtn.addEventListener('click', () => {
        const isCorrect = userOrder.every((val, i) => String(val) === String(correctOrder[i]));
        submitBtn.disabled = true;
        listDiv.querySelectorAll('button').forEach(b => b.style.pointerEvents = 'none');

        if (isCorrect) {
            playSound('correct', state.theme);
            listDiv.querySelectorAll('button').forEach(b => {
                b.style.borderColor = 'var(--green)';
                b.style.background = 'rgba(16,185,129,0.3)';
            });
            explEl.textContent = '✅ ' + (task.explanation || 'Правильный порядок!');
            explEl.className = (compact ? 'explanation-box' : 'lesson-explanation') + ' show good';
            resolve({ isCorrect: true, isBonus });
        } else {
            playSound('wrong', state.theme);
            listDiv.querySelectorAll('button').forEach((b, i) => {
                if (String(userOrder[i]) === String(correctOrder[i])) {
                    b.style.borderColor = 'var(--green)';
                    b.style.background = 'rgba(16,185,129,0.3)';
                } else {
                    b.style.borderColor = 'var(--red)';
                    b.style.background = 'rgba(239,68,68,0.2)';
                }
            });
            explEl.textContent = '🤔 ' + (task.explanation || '') + ' ✅ ' + correctOrder.join(' → ');
            explEl.className = (compact ? 'explanation-box' : 'lesson-explanation') + ' show bad';
            resolve({ isCorrect: false, isBonus });
        }
    });

    container.appendChild(listDiv);
    container.appendChild(hint);
    container.appendChild(submitBtn);
}

// ─── BOSS — поддержка tasks (массив заданий) ──────────────
function renderBoss(container, task, explEl, resolve, isBonus) {
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'display:flex;flex-direction:column;gap:8px;width:100%;';

    const inputs = [];

    // Счётчик для id обратной связи
    let feedbackId = 0;

    // Поддержка нового формата task.tasks (массив подзаданий)
    if (task.tasks && Array.isArray(task.tasks)) {
        task.tasks.forEach((subtask, i) => {
            const row = document.createElement('div');
            row.className = 'boss-row';

            const label = document.createElement('span');
            label.className = 'boss-label';
            label.textContent = subtask.label || subtask.question || `Задание ${i + 1}`;
            if (subtask.question) label.textContent = subtask.question;

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'boss-input';
            input.placeholder = 'Ответ';
            input.autocomplete = 'off';
            input.maxLength = 30;

            const ansStr = String(subtask.correctAns || '').toLowerCase();
            if (ansStr === 'н' || ansStr === 'нн') input.placeholder = 'н/нн';
            else if (ansStr === 'ь' || ansStr === 'ъ') input.placeholder = 'ь/ъ';
            else if (ansStr === 'тся' || ansStr === 'ться') input.placeholder = 'тся/ться';
            else if (ansStr === 'и' || ansStr === 'е') input.placeholder = 'букву';
            else if (!isNaN(subtask.correctAns)) input.placeholder = 'Число';
            else input.placeholder = 'Ответ';

            const fbId = `boss-fb-${feedbackId++}`;
            const feedback = document.createElement('div');
            feedback.id = fbId;
            feedback.className = 'boss-feedback';

            row.appendChild(label);
            row.appendChild(input);
            wrapper.appendChild(row);
            wrapper.appendChild(feedback);
            inputs.push({ input, answer: String(subtask.correctAns || '').toLowerCase(), hint: subtask.hint || '', feedbackId: fbId, label: subtask.label || subtask.question || '' });
        });
    }
    // Старый формат task.words
    else if (task.words) {
        task.words.forEach((w) => {
            const row = document.createElement('div');
            row.className = 'boss-row';

            const label = document.createElement('span');
            label.className = 'boss-label';
            label.textContent = w.text;

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'boss-input';
            input.placeholder = 'буква';
            input.autocomplete = 'off';
            input.maxLength = 5;

            if (w.answer) {
                if (['н', 'нн'].includes(w.answer)) input.placeholder = 'н/нн';
                else if (['ь', 'ъ'].includes(w.answer)) input.placeholder = 'ь/ъ';
                else if (['тся', 'ться'].includes(w.answer)) input.placeholder = 'тся/ться';
                else if (['и', 'е'].includes(w.answer)) input.placeholder = 'и/е';
            }

            const fbId = `boss-fb-${feedbackId++}`;
            const feedback = document.createElement('div');
            feedback.id = fbId;
            feedback.className = 'boss-feedback';

            row.appendChild(label);
            row.appendChild(input);
            wrapper.appendChild(row);
            wrapper.appendChild(feedback);
            inputs.push({ input, answer: w.answer, hint: w.hint || '', feedbackId: fbId, label: w.text || '' });
        });
    }

    const submitBtn = document.createElement('button');
    submitBtn.className = 'btn-lesson-submit';
    submitBtn.textContent = '✓ Проверить';
    submitBtn.style.marginTop = '6px';

    // Собираем итоговый фидбек
    const buildFeedbackSummary = (results) => {
        if (results.every(r => r.ok)) {
            return '✅ Все ответы верны! ' + (task.explanation || 'Отличная работа!');
        }
        const wrongItems = results.filter(r => !r.ok);
        const correctCount = results.length - wrongItems.length;
        let summary = `🤔 Верно: ${correctCount}/${results.length}. `;
        if (wrongItems.length <= 3) {
            summary += 'Ошибки: ' + wrongItems.map(r => `<b>${r.label}</b> → ${r.answer}`).join('; ') + '.';
        } else {
            summary += `Ошибок: ${wrongItems.length}. `;
        }
        summary += ' ' + (task.explanation || 'Повтори правила!');
        return summary;
    };

    submitBtn.addEventListener('click', () => {
        const results = [];
        let allOk = true;

        inputs.forEach(({ input, answer, hint, feedbackId, label }) => {
            const val = input.value.trim().toLowerCase();
            const fbEl = document.getElementById(feedbackId);
            const isCorrect = val === answer;

            if (isCorrect) {
                input.style.borderColor = 'var(--green)';
                input.style.background = 'rgba(16,185,129,0.2)';
                if (fbEl) {
                    fbEl.innerHTML = `<span style="color:var(--green);font-weight:700;">✓ Правильно!</span> ${hint || ''}`;
                    fbEl.className = 'boss-feedback good';
                }
            } else {
                allOk = false;
                input.style.borderColor = 'var(--red)';
                input.style.background = 'rgba(239,68,68,0.15)';
                if (fbEl) {
                    const shownVal = val || '(пусто)';
                    fbEl.innerHTML = `<span style="color:var(--red);font-weight:700;">✗ ${shownVal}</span> → правильно: <b>${answer}</b>. ${hint || ''}`;
                    fbEl.className = 'boss-feedback bad';
                }
            }
            results.push({ ok: isCorrect, label, answer });
        });

        submitBtn.disabled = true;
        inputs.forEach(({ input }) => input.disabled = true);

        if (allOk) {
            playSound('correct', state.theme);
        } else {
            playSound('wrong', state.theme);
        }

        explEl.innerHTML = buildFeedbackSummary(results);
        explEl.className = 'lesson-explanation show ' + (allOk ? 'good' : 'bad');
        resolve({ isCorrect: allOk, isBonus });
    });

    inputs.forEach(({ input }) => {
        input.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });
    });

    wrapper.appendChild(submitBtn);
    container.appendChild(wrapper);
}

// ─── SHOW HINT ─────────────────────────────────────────────
/**
 * Показать визуальную подсказку для текущего задания.
 * Возвращает true если подсказка была показана.
 */
function showHint(container, task) {
    const hintText = generateHintText(task);
    const type = task.type;

    // Удаляем старую подсказку если есть
    const oldHint = container.querySelector('.hint-tooltip');
    if (oldHint) oldHint.remove();

    if (type === 'choice' || type === 'visual') {
        // Подсветить правильный вариант зелёной обводкой на 2 сек
        const correctAns = String(task.correctAns || task.options?.[task.correctIdx] || '');
        const buttons = container.querySelectorAll('button.lesson-option, button.task-option');
        buttons.forEach(btn => {
            if (String(btn.dataset.value) === correctAns) {
                btn.classList.add('hint-highlight');
                setTimeout(() => btn.classList.remove('hint-highlight'), 2000);
            }
        });
        // Показать текст подсказки
        const explEl = container.querySelector('.lesson-explanation, .explanation-box');
        if (explEl) {
            const prev = explEl.innerHTML;
            explEl.innerHTML = `<span style="font-size:16px;">💡</span> ${hintText}`;
            explEl.className = (explEl.className.includes('explanation-box') ? 'explanation-box' : 'lesson-explanation') + ' show hint';
            setTimeout(() => {
                if (explEl.innerHTML.includes('💡')) {
                    explEl.innerHTML = prev || '';
                    explEl.className = explEl.className.replace(' show hint', '').replace(' show', '');
                }
            }, 3000);
        }
        return true;
    }

    if (type === 'input') {
        const input = container.querySelector('input.lesson-input, input.task-input');
        if (input) {
            const ans = String(task.correctAns || '');
            input.placeholder = `💡 ${ans[0]}… (${ans.length} симв.)`;
            // Автоочистка плейсхолдера через 5 сек
            const origPlaceholder = input.dataset.origPlaceholder || input.placeholder;
            input.dataset.origPlaceholder = origPlaceholder;
            setTimeout(() => {
                if (input.placeholder.includes('💡')) {
                    input.placeholder = input.dataset.origPlaceholder || 'Ответ';
                }
            }, 5000);
        }
        showHintTooltip(container, hintText);
        return true;
    }

    if (type === 'pair') {
        // Подсветить одну верную пару
        const leftBtns = container.querySelectorAll('.pair-item[data-side="left"]:not(.matched)');
        const rightBtns = container.querySelectorAll('.pair-item[data-side="right"]:not(.matched)');
        if (leftBtns.length > 0 && rightBtns.length > 0) {
            const firstLeft = leftBtns[0];
            const pairIdx = firstLeft.dataset.pairIdx;
            const matchRight = [...rightBtns].find(b => b.dataset.pairIdx === pairIdx);
            if (matchRight) {
                firstLeft.classList.add('hint-highlight');
                matchRight.classList.add('hint-highlight');
                setTimeout(() => {
                    firstLeft.classList.remove('hint-highlight');
                    matchRight.classList.remove('hint-highlight');
                }, 2000);
            }
        }
        showHintTooltip(container, hintText);
        return true;
    }

    if (type === 'ordering') {
        // Показать первый элемент правильной цепочки
        const chips = container.querySelectorAll('.ordering-chip');
        const correctOrder = task.correctOrder || task.correctAns || [];
        if (correctOrder.length > 0) {
            const firstCorrect = String(correctOrder[0]);
            chips.forEach(chip => {
                if (String(chip.dataset.value) === firstCorrect) {
                    chip.classList.add('hint-highlight');
                    setTimeout(() => chip.classList.remove('hint-highlight'), 2000);
                }
            });
        }
        showHintTooltip(container, hintText);
        return true;
    }

    if (type === 'boss') {
        // Показать подсказку для первого незаполненного поля
        const rows = container.querySelectorAll('.boss-row');
        for (const row of rows) {
            const input = row.querySelector('.boss-input');
            if (input && !input.value.trim()) {
                const fbEl = row.nextElementSibling;
                if (fbEl && fbEl.classList.contains('boss-feedback')) {
                    const label = row.querySelector('.boss-label')?.textContent || '';
                    fbEl.innerHTML = `<span style="color:var(--neon-green);font-weight:700;">💡</span> ${hintText}`;
                    fbEl.className = 'boss-feedback hint';
                    input.focus();
                    setTimeout(() => {
                        if (fbEl.innerHTML.includes('💡')) {
                            fbEl.innerHTML = '';
                            fbEl.className = 'boss-feedback';
                        }
                    }, 4000);
                }
                break;
            }
        }
        return true;
    }

    // Fallback: просто тултип
    showHintTooltip(container, hintText);
    return true;
}

/** Показать тултип с текстом подсказки */
function showHintTooltip(container, text) {
    const old = container.querySelector('.hint-tooltip');
    if (old) old.remove();

    const tooltip = document.createElement('div');
    tooltip.className = 'hint-tooltip';
    tooltip.innerHTML = `<span>💡</span> ${text}`;
    container.appendChild(tooltip);

    // Автоудаление
    setTimeout(() => tooltip.remove(), 4000);
}

const steps = [
    { emoji: '🐱', title: 'Добро пожаловать!', text: 'Я Кот Учёный. Нажимай на доступный навык, чтобы начать урок.' },
    { emoji: '🧮', title: 'Два предмета', text: 'Переключайся между математикой и русским в шапке.' },
    { emoji: '🪤', title: 'Ловушки', text: 'Ошибки создают ловушки. Обезвреживай их и получай бонусы!' },
    { emoji: '🐱', title: 'Погладь меня!', text: 'Нажми на кота — я мурчу и даю достижения!' }
];

function startTutorial() {
    if (localStorage.getItem(TUTORIAL_KEY)) return;
    
    const overlay = $('#tutorialOverlay');
    let step = 0;
    
    const render = () => {
        const s = steps[step];
        $('#tutEmoji').textContent = s.emoji;
        $('#tutTitle').textContent = s.title;
        $('#tutText').textContent = s.text;
        $('#tutDots').innerHTML = steps.map((_, i) => `<span class="tutorial-dot ${i === step ? 'active' : ''}"></span>`).join('');
        $('#tutNext').textContent = step === steps.length - 1 ? 'Понял!' : 'Далее';
        overlay.classList.add('active');
    };
    
    const close = () => { overlay.classList.remove('active'); localStorage.setItem(TUTORIAL_KEY, '1'); };
    
    $('#tutNext').addEventListener('click', () => { step++; if (step >= steps.length) close(); else render(); });
    $('#tutSkip').addEventListener('click', close);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    
    render();
}

/* === js/components/skillTree.js === */
function updateClassSelector() {
    const btns = $$('#classSelector .class-btn');
    btns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.class === state.currentClass);
    });
}

function switchClass(newClass) {
    if (state.currentClass !== newClass) {
        state.currentClass = newClass;
        state.classSwitches++;
        saveState();
    }
    updateClassSelector();
    renderSkillTree();
}

function renderSkillTree() {
    updateClassSelector();
    const skills = getCurrentSkills();
    const container = $('#skillTree');
    if (!container) return;

    container.innerHTML = '<div class="skill-path">' + skills.map(s => {
        const nc = s.status === 'completed' ? 'completed' : s.status === 'current' ? 'current' : '';
        const cc = s.status === 'locked' ? 'locked' : s.status === 'completed' ? 'completed' : 'current';
        const se = s.status === 'completed' ? '✅' : s.status === 'current' ? '▶️' : '🔒';
        const pt = s.progress === 100 ? 'Пройдено' : s.progress > 0 ? `${s.progress}%` : (s.status === 'current' ? 'Готов к старту 🚀' : 'Не начато');
        return `<div class="skill-node ${nc}">
            <div class="skill-card ${cc}" data-id="${s.id}" data-status="${s.status}">
                <div class="skill-icon-box" style="background:${s.color}15;color:${s.color};">${s.icon}</div>
                <div class="skill-info">
                    <div class="skill-name">${s.name}</div>
                    <div class="skill-progress-text">${pt}</div>
                    <div class="skill-progress-bar"><div class="skill-progress-fill" style="width:${s.progress}%;background:${s.color};"></div></div>
                </div>
                <div class="skill-badge">${se}</div>
            </div>
        </div>`;
    }).join('') + '</div>';

    $$('#skillTree .skill-card').forEach(card => {
        card.addEventListener('click', () => {
            const st = card.dataset.status;
            const id = card.dataset.id;
            if (st === 'locked') showToast('🔒', 'Пройди предыдущий!', $('#toast'));
            else if (st === 'completed') showToast('✅', 'Уже пройден!', $('#toast'));
            else startLesson(id);
        });
    });
}
