<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кот Учёный — v15</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3B82F6">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app" id="app">
        <div class="header math-header" id="headerBar">
            <div class="header-top">
                <div class="header-left">
                    <div class="cat-avatar" id="catAvatar">🐱</div>
                    <div class="header-app-name">Кот Учёный</div>
                </div>
                <div class="header-stats">
                    <div class="stat"><span>🔥</span><span id="streakCount">7</span></div>
                    <div class="stat"><span>💎</span><span id="gemCount">245</span></div>
                </div>
            </div>
            <div class="subject-switch">
                <button class="subject-btn active" id="btnMath"><span>🧮</span>Математика</button>
                <button class="subject-btn" id="btnRus"><span>📝</span>Русский</button>
            </div>
        </div>

        <div class="cat-stage math-stage" id="catStage">
            <div class="cat-speech-bubble" id="catSpeech">Мур! Всё работает!</div>
            <div class="cat-emoji" id="catBody">🐱</div>
        </div>

        <div class="main-content">
            <div class="section-title"><span>🌳</span>Дерево навыков</div>
            <div id="skillTree"></div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn active" id="navHome"><span class="nav-icon">🏠</span>Главная</button>
            <button class="nav-btn" id="navStories"><span class="nav-icon">📖</span>Истории</button>
            <button class="nav-btn" id="navTraps" style="position:relative;">
                <span class="nav-icon">🪤</span>Ловушки
                <span class="nav-badge" id="trapsBadge" style="display:none;">0</span>
            </button>
            <button class="nav-btn" id="navGames"><span class="nav-icon">🎮</span>Игры</button>
            <button class="nav-btn" id="navProfile"><span class="nav-icon">👤</span>Профиль</button>
        </div>

        <!-- ПАНЕЛЬ ИГР -->
        <div class="panel-overlay" id="gamesPanel">
            <div class="panel-card">
                <div id="gamesContent"></div>
                <button class="panel-close" id="btnGamesPanelClose">Закрыть</button>
            </div>
        </div>

        <!-- ПАНЕЛИ ВНУТРИ APP -->
        <div class="panel-overlay" id="storyPanel">
            <div class="panel-card">
                <div class="panel-title">📖 Истории</div>
                <div class="panel-subtitle" id="storyPanelSubtitle"></div>
                <div id="storyList"></div>
                <button class="panel-close" id="btnStoryPanelClose">Закрыть</button>
            </div>
        </div>
        <div class="panel-overlay" id="trapsPanel">
            <div class="panel-card">
                <div class="panel-title">🪤 Ловушки</div>
                <div class="panel-subtitle" id="trapsSubtitle"></div>
                <div id="trapsList"></div>
                <button class="panel-close" id="btnTrapsPanelClose">Закрыть</button>
            </div>
        </div>
        <div class="panel-overlay" id="profilePanel">
            <div class="panel-card">
                <div id="profileContent"></div>
                <button class="panel-close" id="btnProfilePanelClose">Закрыть</button>
            </div>
        </div>
        <div class="panel-overlay" id="trapQuizOverlay">
            <div class="panel-card" id="trapQuizCard"></div>
        </div>
    </div>

    <!-- ТОСТЫ И УРОКИ (ПОВЕРХ ВСЕГО) -->
    <div class="toast" id="toast"></div>
    <div class="achievement-toast" id="achToast">
        <span style="font-size:24px;">🏆</span><span id="achToastText"></span>
    </div>

    <div class="lesson-overlay" id="lessonOverlay">
        <div class="lesson-container math-lesson" id="lessonContainer">
            <div class="lesson-progress-wrapper" id="lessonProgressWrapper">
                <div class="lesson-progress-bar" id="lessonProgressBar"></div>
            </div>
            <div class="lesson-header math-bar" id="lessonHeader">
                <span class="lesson-title" id="lessonTitle">📚</span>
                <div style="display:flex;align-items:center;gap:8px;">
                    <div class="lesson-steps" id="lessonSteps"></div>
                    <button class="lesson-close" id="lessonCloseBtn">✕</button>
                </div>
            </div>
            <div class="lesson-scene" id="lessonScene"></div>
            <button class="lesson-next math-next" id="lessonNextBtn">Далее ▸</button>
            <div class="lesson-finish" id="lessonFinishBlock">
                <div class="finish-emoji">🎉</div>
                <div class="finish-title" id="lfinishTitle">Урок пройден!</div>
                <div class="finish-xp" id="lfinishXP"></div>
                <div class="finish-subtitle" id="lfinishSubtitle"></div>
                <div class="finish-stats">
                    <div class="finish-stat">
                        <div class="finish-stat-val" style="color:var(--green);" id="lfinishCorrect">0</div>
                        <div class="finish-stat-label">Верно</div>
                    </div>
                    <div class="finish-stat">
                        <div class="finish-stat-val" style="color:var(--red);" id="lfinishWrong">0</div>
                        <div class="finish-stat-label">Ошибок</div>
                    </div>
                </div>
                <button class="btn-lesson-finish math-finish" id="btnLessonFinish">Завершить</button>
            </div>
        </div>
    </div>

    <div class="story-overlay" id="storyOverlay">
        <div class="story-container math-story" id="storyContainer">
            <div class="story-header-bar math-bar" id="storyHeaderBar">
                <span class="story-title-header" id="storyTitleHeader">🕵️</span>
                <div style="display:flex;align-items:center;gap:6px;">
                    <div class="story-steps" id="storySteps"></div>
                    <button class="story-close-btn" id="storyCloseBtn">✕</button>
                </div>
            </div>
            <div class="story-scene" id="storyScene"></div>
            <button class="story-next-btn math-next" id="storyNextBtn">Далее ▸</button>
            <div class="story-finish" id="storyFinishBlock2">
                <div class="finish-emoji">🏆</div>
                <div class="finish-title" id="finishTitle"></div>
                <div class="finish-xp" id="finishXP"></div>
                <div class="finish-subtitle" id="finishSubtitle"></div>
                <button class="btn-finish-story math-finish" id="btnFinishStory">Завершить</button>
            </div>
        </div>
    </div>

    <div class="tutorial-overlay" id="tutorialOverlay">
        <div class="tutorial-card">
            <div class="tutorial-emoji" id="tutEmoji">🐱</div>
            <div class="tutorial-title" id="tutTitle"></div>
            <div class="tutorial-text" id="tutText"></div>
            <div class="tutorial-dots" id="tutDots"></div>
            <button class="tutorial-btn" id="tutNext">Далее</button>
            <button class="tutorial-skip" id="tutSkip">Пропустить</button>
        </div>
    </div>

/* === js/utils.js === */
const $ = (selector, parent = document) => parent.querySelector(selector);
const $$ = (selector, parent = document) => parent.querySelectorAll(selector);

const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

const shuffle = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};

const showToast = (emoji, message, toastEl) => {
    if (!toastEl) return;
    toastEl.innerHTML = `<span>${emoji}</span> ${message}`;
    toastEl.classList.add('show');
    clearTimeout(toastEl._tid);
    toastEl._tid = setTimeout(() => toastEl.classList.remove('show'), 2000);
};

/** Всплывающие +XP частицы */
function spawnXP(amount, x, y, parent = document.body) {
    const el = document.createElement('div');
    el.className = 'xp-particle';
    el.textContent = `+${amount} 💎`;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    parent.appendChild(el);
    setTimeout(() => el.remove(), 1300);
}

/** Lottie-анимация */
function playLottie(container, animationUrl, options = {}) {
    if (!window.lottie || !container) return;
    const anim = window.lottie.loadAnimation({
        container,
        renderer: 'svg',
        loop: options.loop ?? false,
        autoplay: true,
        path: animationUrl
    });
    if (options.onComplete) anim.addEventListener('complete', options.onComplete);
    return anim;
}

const makeWrongs = (correct, count = 3) => {
    const wrongs = new Set();
    while (wrongs.size < count) {
        let delta;
        if (correct <= 10) delta = rnd(-3, 3);
        else if (correct <= 50) delta = rnd(-Math.floor(correct * 0.3), Math.floor(correct * 0.3));
        else delta = rnd(-Math.floor(correct * 0.2), Math.floor(correct * 0.2));
        const candidate = correct + delta;
        if (candidate !== correct && candidate >= 0 && !wrongs.has(candidate)) wrongs.add(candidate);
    }
    return [...wrongs];
};

/** Создать неправильные варианты из пула (для русского) */
const makeStringWrongs = (correct, pool, count = 3) => {
    const others = [...new Set(pool.filter(x => x !== correct))];
    const shuf = shuffle(others);
    return shuf.slice(0, Math.min(count, shuf.length));
};

const choiceT = (emoji, badge, badgeClass, question, correct, explanation) => {
    const allOptions = [correct, ...makeWrongs(correct)];
    const options = shuffle(allOptions);
    const correctIdx = options.findIndex(opt => opt === correct);
    return { type: 'choice', emoji, badge, badgeClass, question, options, correctIdx, correctAns: correct, explanation };
};

/** choice с заранее заданными вариантами (для строк) */
const choiceStrT = (emoji, badge, badgeClass, question, correct, wrongPool, count, explanation) => {
    const wrongs = makeStringWrongs(correct, wrongPool, count);
    const allOptions = shuffle([correct, ...wrongs]);
    const correctIdx = allOptions.findIndex(opt => opt === correct);
    return { type: 'choice', emoji, badge, badgeClass, question, options: allOptions, correctIdx, correctAns: correct, explanation };
};

const inputT = (emoji, badge, badgeClass, question, correct, explanation) => {
    return { type: 'input', emoji, badge, badgeClass, question, correctAns: correct, explanation };
};

const pairT = (emoji, badge, badgeClass, question, pairs, explanation) => {
    return { type: 'pair', emoji, badge, badgeClass, question, pairs, explanation };
};

/** Визуальное задание: SVG + выбор ответа */
const visualT = (emoji, badge, badgeClass, svg, question, correct, options, explanation) => {
    // Гарантируем, что правильный ответ есть среди вариантов
    const allOpts = options.includes(correct) ? options : [correct, ...options];
    const uniqueOpts = [...new Set(allOpts)];
    const correctIdx = uniqueOpts.findIndex(opt => opt === correct);
    return { type: 'visual', emoji, badge, badgeClass, svg, question, options: uniqueOpts, correctIdx, correctAns: correct, explanation };
};

let _ctx = null;

function getCtx() {
    if (_ctx) return _ctx;
    try {
        _ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
        _ctx = null;
    }
    return _ctx;
}

function playCorrectSound() {
    try {
        const ctx = getCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        const o1 = ctx.createOscillator(); const g1 = ctx.createGain();
        o1.type = 'sine'; o1.frequency.setValueAtTime(523.25, now); o1.frequency.setValueAtTime(659.25, now + 0.08);
        g1.gain.setValueAtTime(0.25, now); g1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        o1.connect(g1); g1.connect(ctx.destination); o1.start(now); o1.stop(now + 0.3);
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.type = 'sine'; o2.frequency.setValueAtTime(659.25, now + 0.1); o2.frequency.setValueAtTime(783.99, now + 0.18);
        g2.gain.setValueAtTime(0.2, now + 0.1); g2.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        o2.connect(g2); g2.connect(ctx.destination); o2.start(now + 0.1); o2.stop(now + 0.45);
    } catch (e) {}
}

function spawnGems(count, startX, startY, targetEl) {
    const target = targetEl || document.getElementById('gemCount');
    if (!target) return;
    const targetRect = target.getBoundingClientRect();
    const targetX = targetRect.left + targetRect.width / 2;
    const targetY = targetRect.top + targetRect.height / 2;
    for (let i = 0; i < count; i++) {
        const gem = document.createElement('span');
        gem.textContent = '💎';
        gem.style.cssText = `position:fixed;left:${startX}px;top:${startY}px;font-size:16px;pointer-events:none;z-index:1000;transition:all 0.8s;opacity:1;`;
        document.body.appendChild(gem);
        requestAnimationFrame(() => {
            gem.style.left = targetX + 'px';
            gem.style.top = targetY + 'px';
            gem.style.opacity = '0';
            gem.style.transform = 'scale(0.3)';
        });
        setTimeout(() => gem.remove(), 900);
    }
}

function playXylophone(notes, delay = 0.12) {
    try {
        const ctx = getCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        notes.forEach((f, i) => {
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(f, now + i * delay);
            g.gain.setValueAtTime(0.2, now + i * delay);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * delay + 0.35);
            o.connect(g); g.connect(ctx.destination);
            o.start(now + i * delay); o.stop(now + i * delay + 0.35);
        });
    } catch (e) {}
}

function playWoodThump() {
    try {
        const ctx = getCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(180, now);
        o.frequency.exponentialRampToValueAtTime(60, now + 0.3);
        g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.35);
    } catch (e) {}
}

function playSynthChime() {
    try {
        const ctx = getCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        [880, 1100, 1320].forEach((f, i) => {
            const o = ctx.createOscillator(); const g = ctx.createGain();
            const f1 = ctx.createBiquadFilter();
            f1.type = 'lowpass'; f1.frequency.value = 3000;
            o.type = 'sawtooth'; o.frequency.setValueAtTime(f, now + i * 0.08);
            g.gain.setValueAtTime(0.12, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25);
            o.connect(f1); f1.connect(g); g.connect(ctx.destination);
            o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.25);
        });
    } catch (e) {}
}

    if (theme && theme[type]) {
        theme[type]();
        if (type === 'achievement') spawnConfetti();
        return;
    }
    switch (type) {
        case 'correct': playCorrectSound(); break;
        case 'wrong': playWrongSound(); break;
        case 'achievement': playAchievementSound(); spawnConfetti(); break;
        case 'pet': playMeowSound(); break;
        case 'meow': playMeowSound(); break;
    }
}

const saveState = () => {
    const data = {
        skills: state.skills, gems: state.gems, streak: state.streak,
        storiesCompleted: state.storiesCompleted, traps: state.traps,
        achievements: state.achievements, totalPets: state.totalPets,
        subject: state.subject, subjectSwitches: state.subjectSwitches,
        theme: state.theme,
        petSkin: state.petSkin,
        petAccessories: state.petAccessories,
        petOwnedSkins: state.petOwnedSkins,
        petOwnedAccessories: state.petOwnedAccessories,
        petRotation: state.petRotation,
        gameScores: state.gameScores
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
};

const loadState = () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    try {
        const data = JSON.parse(saved);
        if (data.skills) {
            // Мёржим сохранённые навыки поверх дефолтных —
            // новые навыки из конфига не теряются
            [SUBJECTS.MATH, SUBJECTS.RUSSIAN].forEach(subj => {
                const saved = data.skills[subj];
                if (saved) {
                    const defaults = state.skills[subj];
                    for (const key of Object.keys(saved)) {
                        if (defaults[key]) {
                            defaults[key].completed = saved[key]?.completed ?? defaults[key].completed;
                            defaults[key].score = saved[key]?.score ?? defaults[key].score;
                        }
                    }
                }
            });
        }
        if (data.gems !== undefined) state.gems = data.gems;
        if (data.streak !== undefined) state.streak = data.streak;
        if (data.storiesCompleted) state.storiesCompleted = { ...state.storiesCompleted, ...data.storiesCompleted };
        if (data.traps) state.traps = data.traps;
        if (data.achievements) Object.keys(data.achievements).forEach(key => {
            if (state.achievements[key] && data.achievements[key].unlocked) state.achievements[key].unlocked = true;
        });
        if (data.totalPets !== undefined) state.totalPets = data.totalPets;
        if (data.subject) state.subject = data.subject;
        if (data.subjectSwitches !== undefined) state.subjectSwitches = data.subjectSwitches;
        if (data.theme) state.theme = data.theme;
        if (data.petSkin) state.petSkin = data.petSkin;
        if (data.petAccessories) state.petAccessories = data.petAccessories;
        if (data.petOwnedSkins) state.petOwnedSkins = data.petOwnedSkins;
        if (data.petOwnedAccessories) state.petOwnedAccessories = data.petOwnedAccessories;
        if (data.petRotation !== undefined) state.petRotation = data.petRotation;
        if (data.gameScores) state.gameScores = data.gameScores;
    } catch (e) { console.warn('Ошибка загрузки:', e); }
};

const getCurrentSkills = () => state.skills[state.subject];

const unlockAchievement = (id, onUnlock) => {
    const ach = state.achievements[id];
    if (!ach || ach.unlocked) return false;
    ach.unlocked = true; state.gems += GEMS.ACHIEVEMENT_REWARD; saveState();
    if (onUnlock) onUnlock(ach.name, ach.desc);
    return true;
};

const checkAchievements = (onUnlock) => {
    const done = (state.storiesCompleted.math?1:0)+(state.storiesCompleted.rus1?1:0)+(state.storiesCompleted.rus2?1:0);
    const def = state.traps.reduce((s,t)=>s+t.defuses,0);
    const checks = {
        detective: done>=1, sherlock: done>=2, holmes: done>=3,
        saper: def>=1, hunter: def>=3, murmur: state.totalPets>=10, firstBlood: state.traps.length>0
    };
    Object.entries(checks).forEach(([id,cond]) => { if(cond) unlockAchievement(id, onUnlock); });
};

const getAvailableTraps = () => {
    return state.traps.filter(t=>t.defuses < TRAP.MAX_DEFUSES && t.subject === state.subject);
};

const getDefusedTraps = () => state.traps.filter(t=>t.defuses >= TRAP.MAX_DEFUSES && t.subject === state.subject);

const resetAllProgress = () => {

/** Применить тему к body и CSS-переменным */
const applyTheme = (themeId) => {
    const t = getTheme(themeId);
    if (!t) return;

    // Убираем все старые theme-классы
    Object.keys(THEMES).forEach(k => document.body.classList.remove('theme-' + k));
    document.body.classList.add('theme-' + themeId);

    // CSS-переменные
    const root = document.documentElement;
    root.style.setProperty('--bg', t.bg);
    root.style.setProperty('--card', t.card);
    root.style.setProperty('--text', t.text);
    root.style.setProperty('--text-light', t.textLight);
    root.style.setProperty('--theme-primary', t.primary);
    root.style.setProperty('--theme-accent', t.accent);

    // Обновляем фон body
    document.body.style.background = t.gradient;
    document.body.style.backgroundSize = '400% 400%';

    // Эмодзи кота
    const catBody = document.getElementById('catBody');
    const catAvatar = document.getElementById('catAvatar');
    if (catBody) catBody.textContent = t.catEmoji;
    if (catAvatar) catAvatar.textContent = t.catEmoji;

    // Сохраняем
    state.theme = themeId;
};

/** Проверить и разблокировать темы по прогрессу */
const checkThemeUnlocks = () => {
    const totalDone = countCompletedLessons(state.skills[SUBJECTS.MATH]) + countCompletedLessons(state.skills[SUBJECTS.RUSSIAN]);
    Object.values(THEMES).forEach(t => {
        if (!t.unlocked && t.unlockAt && totalDone >= t.unlockAt) {
            t.unlocked = true;
        }
    });
};

function applesSVG(count, color = '#EF4444') {
    const rows = Math.ceil(count / 5);
    const perRow = Math.min(count, 5);
    let circles = '';
    for (let r = 0; r < rows; r++) {
        const inRow = r === rows - 1 ? (count % 5 || 5) : 5;
        for (let c = 0; c < inRow; c++) {
            const cx = 20 + c * 28 + (rows > 1 && r === rows - 1 ? (5 - inRow) * 14 : 0);
            const cy = 25 + r * 32;
            circles += `<circle cx="${cx}" cy="${cy}" r="11" fill="${color}" stroke="#B91C1C" stroke-width="1.5"/>
            <line x1="${cx - 4}" y1="${cy - 5}" x2="${cx + 1}" y2="${cy - 9}" stroke="#7F1D1D" stroke-width="2" stroke-linecap="round"/>`;
        }
    }
    const h = Math.max(60, rows * 32 + 16);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 ${h}" width="150" height="${h}">${circles}</svg>`;
}

function applesTwoGroups(a, b) {
    const svgA = applesSVG(a, '#EF4444');
    const svgB = applesSVG(b, '#F59E0B');
    // Simple side-by-side via a wrapper div is easier, but for inline SVG we compose
    const rowsA = Math.ceil(a / 5); const perRowA = Math.min(a, 5);
    const rowsB = Math.ceil(b / 5); const perRowB = Math.min(b, 5);
    const H = Math.max(rowsA, rowsB) * 32 + 30;
    let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 ${H}" width="300" height="${H}">`;
    // group A label
    out += `<text x="75" y="14" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700">🍎 группа А</text>`;
    for (let r = 0; r < rowsA; r++) {
        const inRow = r === rowsA - 1 ? (a % 5 || 5) : 5;
        for (let c = 0; c < inRow; c++) {
            const cx = 35 + c * 28 + (rowsA > 1 && r === rowsA - 1 ? (5 - inRow) * 14 : 0);
            const cy = 30 + r * 32;
            out += `<circle cx="${cx}" cy="${cy}" r="11" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
            <line x1="${cx - 4}" y1="${cy - 5}" x2="${cx + 1}" y2="${cy - 9}" stroke="#7F1D1D" stroke-width="2" stroke-linecap="round"/>`;
        }
    }
    // group B label
    out += `<text x="225" y="14" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700">🍎 группа Б</text>`;
    for (let r = 0; r < rowsB; r++) {
        const inRow = r === rowsB - 1 ? (b % 5 || 5) : 5;
        for (let c = 0; c < inRow; c++) {
            const cx = 185 + c * 28 + (rowsB > 1 && r === rowsB - 1 ? (5 - inRow) * 14 : 0);
            const cy = 30 + r * 32;
            out += `<circle cx="${cx}" cy="${cy}" r="11" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
            <line x1="${cx - 4}" y1="${cy - 5}" x2="${cx + 1}" y2="${cy - 9}" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>`;
        }
    }
    out += '</svg>';
    return out;
}

function subSVG(total, eaten) {
    const H = Math.ceil(total / 5) * 32 + 30;
    let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 ${H}" width="280" height="${H}">`;
    out += `<text x="140" y="14" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700">Было ${total} 🍎</text>`;
    for (let r = 0; r < Math.ceil(total / 5); r++) {
        const inRow = r === Math.ceil(total / 5) - 1 ? (total % 5 || 5) : 5;
        for (let c = 0; c < (r < Math.ceil(total / 5) - 1 ? 5 : inRow); c++) {
            const idx = r * 5 + c;
            const cx = 40 + c * 36;
            const cy = 30 + r * 32;
            const isEaten = idx < eaten;
            const fill = isEaten ? '#E2E8F0' : '#EF4444';
            const stroke = isEaten ? '#CBD5E1' : '#B91C1C';
            out += `<circle cx="${cx}" cy="${cy}" r="11" fill="${fill}" stroke="${stroke}" stroke-width="1.5" stroke-dasharray="${isEaten ? '3 2' : 'none'}"/>`;
            if (isEaten) {
                out += `<line x1="${cx - 5}" y1="${cy - 5}" x2="${cx + 5}" y2="${cy + 5}" stroke="#CBD5E1" stroke-width="2"/>
                <line x1="${cx + 5}" y1="${cy - 5}" x2="${cx - 5}" y2="${cy + 5}" stroke="#CBD5E1" stroke-width="2"/>`;
            } else {
                out += `<line x1="${cx - 4}" y1="${cy - 5}" x2="${cx + 1}" y2="${cy - 9}" stroke="#7F1D1D" stroke-width="2" stroke-linecap="round"/>`;
            }
        }
    }
    out += '</svg>';
    return out;
}

function mulGridSVG(rows, cols) {
    const cellW = Math.min(32, (260) / cols);
    const cellH = 32;
    const W = cols * cellW + 24;
    const H = rows * cellH + 30;
    const r = Math.min(10, cellW / 2 - 2);
    let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
    out += `<text x="${W / 2}" y="14" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700">${rows} ряда × ${cols} 🍎</text>`;
    for (let rr = 0; rr < rows; rr++) {
        for (let cc = 0; cc < cols; cc++) {
            const cxc = 14 + cc * cellW + cellW / 2;
            const cy = 28 + rr * cellH;
            out += `<circle cx="${cxc}" cy="${cy}" r="${r}" fill="#F59E0B" stroke="#D97706" stroke-width="1.2"/>`;
            out += `<line x1="${cxc - r * 0.3}" y1="${cy - r * 0.4}" x2="${cxc + r * 0.1}" y2="${cy - r * 0.8}" stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>`;
        }
    }
    out += '</svg>';
    return out;
}

function divBasketsSVG(total, baskets) {
    const perBasket = Math.floor(total / baskets);
    const rem = total - perBasket * baskets;
    const W = baskets * 60 + 20;
    const H = (perBasket + (rem > 0 ? 1 : 0)) * 22 + 80;
    let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
    out += `<text x="${W / 2}" y="12" text-anchor="middle" font-size="10" fill="#94A3B8" font-weight="700">${total} 🍎 в ${baskets} корзинах</text>`;
    for (let b = 0; b < baskets; b++) {
        const bx = 14 + b * 60;
        // basket
        out += `<path d="M${bx} 40 L${bx + 10} ${H - 16} L${bx + 38} ${H - 16} L${bx + 48} 40 Z" fill="#D4A373" stroke="#B8845A" stroke-width="1.5"/>`;
        // apples in basket
        const count = b < rem ? perBasket + 1 : perBasket;
        for (let a = 0; a < count; a++) {
            const ax = bx + 14 + (a % 3) * 16;
            const ay = H - 28 - Math.floor(a / 3) * 18;
            out += `<circle cx="${ax}" cy="${ay}" r="5" fill="#EF4444" stroke="#B91C1C" stroke-width="0.8"/>`;
        }
    }
    out += '</svg>';
    return out;
}

function eqScaleSVG(leftExpr, rightVal) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
        <polygon points="120,15 135,30 105,30" fill="#94A3B8"/>

function geomRectSVG(w, h, label) {
    const scale = Math.min(200 / w, 120 / h, 30);
    const rw = w * scale;
    const rh = h * scale;
    const W = rw + 40;
    const H = rh + 50;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
        <rect x="20" y="25" width="${rw}" height="${rh}" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
        <text x="${20 + rw / 2}" y="20" text-anchor="middle" font-size="11" fill="#3B82F6" font-weight="700">${w}</text>
        <text x="${rw + 28}" y="${25 + rh / 2}" font-size="11" fill="#3B82F6" font-weight="700">${h}</text>
        <text x="${20 + rw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#3B82F6" font-weight="700">${label}</text>
    </svg>`;

}

function pizzaSVG(eaten, total) {
    const slices = [];
    for (let i = 0; i < total; i++) {
        const fromAngle = (i / total) * 360;
        const toAngle = ((i + 1) / total) * 360;
        const fromRad = (fromAngle - 90) * Math.PI / 180;
        const toRad = (toAngle - 90) * Math.PI / 180;
        const x1 = 100 + 70 * Math.cos(fromRad);
        const y1 = 100 + 70 * Math.sin(fromRad);
        const x2 = 100 + 70 * Math.cos(toRad);
        const y2 = 100 + 70 * Math.sin(toRad);
        const eatenSlice = i < eaten;
        slices.push(`<path d="M100 100 L${x1} ${y1} A70 70 0 0 1 ${x2} ${y2} Z" fill="${eatenSlice ? '#E2E8F0' : '#F59E0B'}" stroke="#92400E" stroke-width="1.5"/>`);
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
        ${slices.join('')}
        <text x="100" y="190" text-anchor="middle" font-size="12" fill="#94A3B8" font-weight="700">Съедено ${eaten} из ${total}</text>
    </svg>`;
    return svg;
}

function generateAddLesson() {
    const t = [];
    const add = (a, b) => a + b;

    // 1. Разминка
    {
        const [a, b] = [rnd(3, 15), rnd(3, 15)];
        t.push(choiceT('🔥', 'Разминка', 'badge-warmup', `${a} + ${b} = ?`, add(a, b), 'Просто складываем два числа'));
    }
    // 2. Визуальное — две группы яблок
    {
        const [a, b] = [rnd(3, 7), rnd(3, 7)];
        const svg = applesTwoGroups(a, b);
        t.push(visualT('🖼️', 'Визуальное', 'badge-visual', svg, `Сколько всего яблок?`, add(a, b), makeWrongs(add(a, b)), `${a} красных + ${b} жёлтых = ${add(a, b)}`));
    }
    // 3. Выбор
    {
        const [a, b] = [rnd(10, 40), rnd(10, 40)];
        t.push(choiceT('🎯', 'Выбор', 'badge-choice', `${a} + ${b} = ?`, add(a, b), `Складываем: ${a} + ${b}`));
    }
    // 4. Парное
    {
        const pd = []; const used = new Set();
        while (pd.length < 3) {
            const [a, b] = [rnd(5, 30), rnd(5, 30)];
            const ans = add(a, b);
            if (!used.has(ans)) { used.add(ans); pd.push({ left: `${a} + ${b}`, right: `${ans}`, answer: ans }); }
        }
        t.push(pairT('🔗', 'Парное', 'badge-pair', 'Соедини выражение с ответом:', pd, 'Сопоставляем суммы'));
    }
    // 5. Ввод
    {
        const [a, b] = [rnd(15, 60), rnd(10, 40)];
        t.push(inputT('✏️', 'Ввод', 'badge-input', `${a} + ${b} = ?`, add(a, b), `${a} + ${b} = ${add(a, b)}`));
    }
    // 6. Ловушка хитрая
    {
        const secret = rnd(10, 30);
        t.push(choiceT('⚠️', 'Ловушка', 'badge-trap',
            `Если у Маши ${secret} конфет, а Петя дал ей ещё 0, сколько стало?`,
            secret,
            'Если прибавить 0 — ничего не меняется! Не дай себя обмануть'));
    }
    // 7. Ввод сложнее
    {
        const [a, b, c] = [rnd(10, 30), rnd(10, 30), rnd(10, 30)];
        t.push(inputT('✏️', 'Ввод', 'badge-input',
            `${a} + ${b} + ${c} = ?`, add(add(a, b), c),
            `${a}+${b}=${add(a,b)}, +${c}=${add(add(a,b),c)}`));
    }
    // 8. Босс
    {
        const [apples, more] = [rnd(20, 50), rnd(10, 30)];
        t.push(inputT('⭐', 'Босс', 'badge-boss',
            `В саду было ${apples} яблок. Привезли ещё ${more}. Сколько всего?`,
            add(apples, more),
            `${apples} + ${more} = ${add(apples, more)}`));
    }
    return t;
}

//  ВЫЧИТАНИЕ

function generateSubLesson() {
    const t = [];
    const g = () => { const x = rnd(15, 50); const y = rnd(3, x - 3); return [x, y]; };
    const sub = (a, b) => a - b;

    // 1. Разминка
    {
        const [a, b] = g();
        t.push(choiceT('🔥', 'Разминка', 'badge-warmup', `${a} − ${b} = ?`, sub(a, b), 'Вычитаем меньшее из большего'));
    }
    // 2. Визуальное — яблоки, часть съедена
    {
        const total = rnd(8, 15);
        const eaten = rnd(2, total - 2);
        const svg = subSVG(total, eaten);
        t.push(visualT('🖼️', 'Визуальное', 'badge-visual', svg,
            `Сколько яблок осталось?`, total - eaten,
            makeWrongs(total - eaten),
            `Было ${total}, съели ${eaten} → осталось ${total - eaten}`));
    }
    // 3. Выбор
    {
        const [a, b] = g();
        t.push(choiceT('🎯', 'Выбор', 'badge-choice', `${a} − ${b} = ?`, sub(a, b), `${a} − ${b} = ${sub(a, b)}`));
    }
    // 4. Парное
    {
        const pd = []; const used = new Set();

        t.push(pairT('🔗', 'Парное', 'badge-pair', 'Соедини выражение с ответом:', pd, 'Сопоставляем разности'));
    }
    // 5. Ввод

        t.push(inputT('✏️', 'Ввод', 'badge-input', `${a} − ${b} = ?`, sub(a, b), `${a} − ${b} = ${sub(a, b)}`));
    }
    // 6. Ловушка хитрая
    {
        const n = rnd(10, 25);
        const decoy = rnd(3, 8);
        t.push(choiceT('⚠️', 'Ловушка', 'badge-trap',
            `${n} − ${decoy} + ${decoy} = ?`,
            n,
            `Сначала вычли ${decoy}, потом прибавили — вернулись к ${n}! Порядок действий важен`));
    }
    // 7. Ввод сложнее
    {
        const [money, book, pen] = [rnd(40, 90), rnd(10, 25), rnd(5, 12)];
        const ans7 = money - book - pen;
        t.push(inputT('✏️', 'Ввод', 'badge-input',
            `У Маши ${money} руб. Купила книгу за ${book} руб. и ручку за ${pen} руб. Осталось?`,
            ans7,
            `${money} − ${book} − ${pen} = ${ans7}`));
    }
    // 8. Босс
    {
        const [was, spent, earned] = [rnd(60, 150), rnd(20, 60), rnd(10, 40)];
        const ans8 = was - spent + earned;
        t.push(inputT('⭐', 'Босс', 'badge-boss',
            `На счету было ${was}₽. Потратили ${spent}₽, потом пришло ${earned}₽. Сколько стало?`,
            ans8,
            `${was} − ${spent} + ${earned} = ${ans8}`));
    }
    return t;
}

    // 1. Разминка
    {
        const x = rnd(2, 12); const a = rnd(1, 8);
        t.push(choiceT('🔥', 'Разминка', 'badge-warmup', `x + ${a} = ${x + a}. x = ?`, x, `x = ${x + a} − ${a} = ${x}`));
    }

    {
        const x = rnd(2, 10); const a = rnd(1, 6);
        const svg = eqScaleSVG(`x + ${a}`, x + a);
        t.push(visualT('🖼️', 'Визуальное', 'badge-visual', svg,
            `Чему равен x?`, x,
            makeWrongs(x),
            `На весах слева x + ${a}, справа ${x + a}. Значит x = ${x}`));
    }
    // 3. Выбор
    {
        const x = rnd(2, 10); const mul = rnd(2, 5);
        t.push(choiceT('🎯', 'Выбор', 'badge-choice', `${mul} × x = ${mul * x}. x = ?`, x, `x = ${mul * x} ÷ ${mul} = ${x}`));
    }
    // 4. Парное
    {
        const pd = []; const used = new Set();
        while (pd.length < 3) {
            const x = rnd(2, 10); const a = rnd(1, 6);
            const key = `x + ${a} = ${x + a}`;
            if (!used.has(x)) { used.add(x); pd.push({ left: key, right: `x = ${x}`, answer: x }); }
        }
        t.push(pairT('🔗', 'Парное', 'badge-pair', 'Соедини уравнение с ответом:', pd, 'Решаем уравнения'));
    }
    // 5. Ввод
    {
        const x = rnd(2, 12); const a = rnd(2, 8);
        t.push(inputT('✏️', 'Ввод', 'badge-input', `x + ${a} = ${x + a}. x = ?`, x, `x = ${x + a} − ${a} = ${x}`));
    }
    // 6. Ловушка хитрая
    {
        const x = rnd(3, 10);
        t.push(choiceT('⚠️', 'Ловушка', 'badge-trap',
            `2 × x + 3 = ${2 * x + 3}. x = ?`,
            x,
            `Сначала отними 3: 2x = ${2 * x}, потом раздели на 2 → x = ${x}`));
    }
    // 7. Ввод сложнее
    {
        const x = rnd(2, 8); const mul = rnd(2, 5);
        t.push(inputT('✏️', 'Ввод', 'badge-input',
            `${mul} × x − 2 = ${mul * x - 2}. x = ?`,
            x,
            `Сначала +2: ${mul}x = ${mul * x}, потом ÷${mul} → x = ${x}`));
    }
    // 8. Босс
    {
        const x = rnd(3, 8);
        t.push(inputT('⭐', 'Босс', 'badge-boss',
            `3 коробки с яблоками и ещё 2 яблока = ${3 * x + 2}. Сколько в коробке?`,
            x,
            `${3 * x + 2} − 2 = ${3 * x}, ÷3 = ${x}`));
    }
    return t;
}

//  ГЕОМЕТРИЯ (периметр и площадь)

function generateGeomLesson() {
    const t = [];
    const rect = () => [rnd(3, 8), rnd(3, 8)];
    const sq = () => rnd(3, 7);

    // 1. Разминка
    {
        const s = sq();
        t.push(choiceT('🔥', 'Разминка', 'badge-warmup', `Квадрат со стороной ${s}. Периметр?`, 4 * s, `P = 4 × ${s} = ${4 * s}`));
    }
    // 2. Визуальное — прямоугольник
    {
        const [w, h] = rect();
        const svg = geomRectSVG(w, h, `Периметр?`);
        t.push(visualT('🖼️', 'Визуальное', 'badge-visual', svg,
            `Чему равен периметр?`, 2 * (w + h),
            makeWrongs(2 * (w + h)),
            `P = 2×(${w}+${h}) = ${2 * (w + h)}`));
    }
    // 3. Выбор
    {
        const [w, h] = rect();
        t.push(choiceT('🎯', 'Выбор', 'badge-choice', `Прямоугольник ${w}×${h}. Площадь?`, w * h, `S = ${w} × ${h} = ${w * h}`));
    }
    // 4. Парное
    {
        const pd = [];
        for (let i = 0; i < 3; i++) {
            const [w, h] = rect();
            pd.push({ left: `Прям. ${w}×${h} — S`, right: `${w * h}`, answer: w * h });
        }
        t.push(pairT('🔗', 'Парное', 'badge-pair', 'Соедини фигуру с площадью:', pd, 'Сопоставляем площади'));
    }
    // 5. Ввод
    {
        const [w, h] = rect();
        t.push(inputT('✏️', 'Ввод', 'badge-input', `Прямоугольник ${w}×${h}. Периметр?`, 2 * (w + h), `P = 2×(${w}+${h}) = ${2 * (w + h)}`));
    }
    // 6. Ловушка хитрая
    {
        const s = sq();
        t.push(choiceT('⚠️', 'Ловушка', 'badge-trap',
            `Квадрат со стороной ${s}. Периметр = ? (НЕ площадь!)`,
            4 * s,
            `P = 4 × ${s} = ${4 * s}. Не перепутай с S = ${s * s}!`));
    }
    // 7. Ввод сложнее
    {
        const [w, h] = rect();
        t.push(inputT('✏️', 'Ввод', 'badge-input',
            `Прямоугольник ${w}×${h}. Площадь?`,
            w * h,
            `S = ${w} × ${h} = ${w * h}`));
    }
    // 8. Босс
    {
        const [w, h] = [rnd(4, 10), rnd(3, 8)];
        t.push(inputT('⭐', 'Босс', 'badge-boss',
            `Комната ${w}×${h} м. Периметр и площадь (через запятую)`,
            `${2 * (w + h)},${w * h}`,
            `P=${2 * (w + h)}, S=${w * h}`));
    }
    return t;
}

//  ДРОБИ

function generateFracLesson() {
    const t = [];

    // 1. Разминка
    t.push(choiceT('🔥', 'Разминка', 'badge-warmup',
        'Какая дробь больше: 1/4 или 3/4?', '3/4',
        'Одинаковый знаменатель → больше та, где больше числитель'));
    // 2. Визуальное — пицца
    {
        const total = 8;
        const eaten = rnd(2, 5);
        const svg = pizzaSVG(eaten, total);
        t.push(visualT('🖼️', 'Визуальное', 'badge-visual', svg,
            `Какая часть пиццы осталась? (в формате N/${total})`,
            `${total - eaten}/${total}`,
            [`${total - eaten}/${total}`, `${eaten}/${total}`, `${total - eaten - 1}/${total}`, `${total - eaten + 1}/${total}`],
            `Было ${total}, съели ${eaten} → осталось ${total - eaten}/${total}`));
    }
    // 3. Выбор
    {
        const num = rnd(2, 6); const den = num * rnd(2, 4);
        const g = gcd(num, den);
        const reducedNum = num / g; const reducedDen = den / g;
        t.push(choiceT('🎯', 'Выбор', 'badge-choice',
            `Сократи дробь: ${num}/${den}`,
            `${reducedNum}/${reducedDen}`,
            `Делим числитель и знаменатель на ${g} → ${reducedNum}/${reducedDen}`));
    }
    // 4. Парное
    {
        const pd = [
            { left: '1/2 от 10', right: '5', answer: '5' },
            { left: '1/3 от 9', right: '3', answer: '3' },
            { left: '1/4 от 8', right: '2', answer: '2' }
        ];
        t.push(pairT('🔗', 'Парное', 'badge-pair', 'Соедини дробь от числа с ответом:', pd, 'Находим дробь от числа'));
    }
    // 5. Ввод
    {
        const den = rnd(3, 6);
        const total = den * rnd(3, 7);
        t.push(inputT('✏️', 'Ввод', 'badge-input',
            `1/${den} от ${total} = ?`,
            total / den,
            `${total} ÷ ${den} = ${total / den}`));
    }
    // 6. Ловушка хитрая
    t.push(choiceT('⚠️', 'Ловушка', 'badge-trap',
        '1/2 + 1/2 = ? (не 2/4!)',
        '1',
        '1/2 + 1/2 = 2/2 = 1 целое! Знаменатели НЕ складываем!'));
    // 7. Ввод сложнее
    {
        const den = rnd(2, 5);
        const num = rnd(1, den - 1);
        const total = den * rnd(2, 6);
        t.push(inputT('✏️', 'Ввод', 'badge-input',
            `${num}/${den} от ${total} = ?`,
            Math.round(total * num / den),
            `${total} ÷ ${den} × ${num} = ${Math.round(total * num / den)}`));
    }
    // 8. Босс
    {
        const total = 12;
        const eaten = rnd(3, 8);
        t.push(inputT('⭐', 'Босс', 'badge-boss',
            `Торт на ${total} кусков. Съели ${eaten}. Осталось? (формат N/${total})`,
            `${total - eaten}/${total}`,
            `${total} − ${eaten} = ${total - eaten} → ${total - eaten}/${total}`));
    }
    return t;
}

function generateMathLesson(skillId) {
    const gens = { add: generateAddLesson, sub: generateSubLesson, mul: generateMulLesson, div: generateDivLesson, eq: generateEqLesson, geom: generateGeomLesson, frac: generateFracLesson };
    const gen = gens[skillId];
    return gen ? gen() : generateAddLesson();
}

//  SVG-заготовки для русского

function letterChoiceSVG(word, missingIdx, options) {
    const chars = word.split('');
    const boxSize = 28;
    const W = chars.length * boxSize + 20;
    const H = 62;
    let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
    chars.forEach((ch, i) => {
        const x = 10 + i * boxSize;
        if (i === missingIdx) {
            out += `<rect x="${x}" y="10" width="${boxSize - 4}" height="${boxSize}" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2"/>
            <text x="${x + (boxSize - 4) / 2}" y="32" text-anchor="middle" font-size="16" fill="#F59E0B" font-weight="800">?</text>`;
        } else {
            out += `<text x="${x + (boxSize - 4) / 2}" y="32" text-anchor="middle" font-size="16" fill="#1E293B" font-weight="600">${ch}</text>`;
        }
    });
    // Показываем варианты внизу
    out += `<text x="${W / 2}" y="58" text-anchor="middle" font-size="11" fill="#94A3B8">${options.join(' или ')}</text>`;
    out += '</svg>';
    return out;
}

function compareSVG(word1, word2, question) {
    const W = 280; const H = 80;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
        <rect x="10" y="6" width="120" height="32" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
        <text x="70" y="27" text-anchor="middle" font-size="14" fill="#1E293B" font-weight="700">${word1}</text>
        <rect x="150" y="6" width="120" height="32" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="210" y="27" text-anchor="middle" font-size="14" fill="#1E293B" font-weight="700">${word2}</text>
        <text x="140" y="62" text-anchor="middle" font-size="12" fill="#64748B" font-weight="600">${question}</text>
    </svg>`;
}

function ruleHintSVG(rule) {
    const W = 280; const H = 50;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
        <rect x="10" y="4" width="260" height="40" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>

}

function generateNNLesson() {
    const t = [];
    const dict = [
        { word: 'кури_ый', ans: 'н', hint: 'Суффикс -ИН- → одна Н', wrong: 'нн' },
        { word: 'соломе_ый', ans: 'нн', hint: 'Суффикс -ЕНН- → НН', wrong: 'н' },
        { word: 'стекля_ый', ans: 'нн', hint: 'Исключение! Стеклянный, оловянный, деревянный', wrong: 'н' },
        { word: 'ветре_ый', ans: 'н', hint: 'Исключение! Ветреный — одна Н', wrong: 'нн' },
        { word: 'пусты_ый', ans: 'нн', hint: 'Стык корня и суффикса: пустыН-Н-ый', wrong: 'н' },
        { word: 'кожа_ый', ans: 'н', hint: 'Суффикс -АН- → одна Н', wrong: 'нн' },
        { word: 'обеде_ый', ans: 'нн', hint: 'Суффикс -ЕНН- → НН', wrong: 'н' },
        { word: 'глиня_ый', ans: 'н', hint: 'Суффикс -ЯН- → одна Н', wrong: 'нн' }
    ];
    const sel = shuffle(dict).slice(0, 8);

    // 1. Разминка
    t.push(choiceStrT('🔥', 'Разминка', 'badge-warmup',
        `«${sel[0].word}» — Н или НН?`,
        sel[0].ans === 'н' ? 'Н' : 'НН',
        ['Н', 'НН'], 1, sel[0].hint));

    // 2. Визуальное
    {
        const correctAns = 'курИ-Н-ый → Н, солом-ЕНН-ый → НН';
        const opts = ['курИ-Н-ый → Н, солом-ЕНН-ый → НН', 'оба с НН', 'оба с Н', 'курИ-НН-ый → НН'];
        t.push(visualT('🖼️', 'Визуальное', 'badge-visual',
            compareSVG('кури_ый', 'соломе_ый', 'Где Н, а где НН?'),
            'Где Н, а где НН?', correctAns, opts,
            '-ИН- → Н, -ЕНН- → НН'));

    // 3. Выбор
    t.push(choiceStrT('🎯', 'Выбор', 'badge-choice',
        `«${sel[2].word}» — ?`, sel[2].ans === 'н' ? 'Н' : 'НН',
        ['Н', 'НН'], 1, sel[2].hint));

    // 4. Парное
    {
        const pd = [
            { left: 'кури_ый (-ИН-)', right: 'Н', answer: 'Н' },
            { left: 'соломе_ый (-ЕНН-)', right: 'НН', answer: 'НН' },
            { left: 'стекля_ый (искл.)', right: 'НН', answer: 'НН' }
        ];
        t.push(pairT('🔗', 'Парное', 'badge-pair', 'Соедини слово с количеством Н:', pd, '-АН/-ЯН/-ИН → Н, -ЕНН/-ОНН → НН'));
    }

    // 5. Ввод
    t.push(inputT('✏️', 'Ввод', 'badge-input',
        `Впиши (н/нн): «${sel[4].word}»`, sel[4].ans, sel[4].hint));

    // 6. Ловушка хитрая
    t.push(choiceStrT('⚠️', 'Ловушка', 'badge-trap',
        '«ветре_ый» — почему одна Н?',
        'Это исключение',
        ['Это исключение', 'Суффикс -ЕН-', 'Суффикс -ИН-', 'Краткая форма'],
        2,
        'Ветреный — исключение, одна Н. Но: безветреННый!'));

    // 7. Ввод сложнее
    t.push(inputT('✏️', 'Ввод', 'badge-input',
        `Впиши: «${sel[6].word}» и «${sel[7].word}» (через запятую)`,
        `${sel[6].ans},${sel[7].ans}`,
        `${sel[6].hint}; ${sel[7].hint}`));

    // 8. Босс
    t.push({
        type: 'boss_nn', emoji: '⭐', badge: 'Босс', badgeClass: 'badge-boss',
        question: 'Вставь Н или НН:',
        words: [
            { text: 'стекля_ый', answer: 'нн' },
            { text: 'кожа_ый', answer: 'н' },
            { text: 'деревя_ый', answer: 'нн' }
        ],
        explanation: 'стекляННый (искл), кожаНый (-АН-), деревяННый (искл)'
    });

    return t;
}

function generateRusLesson(skillId) {
    const gens = {
        zhishi: generateZhishiLesson, soft: generateSoftLesson,
        vowel: generateVowelLesson, silent: generateSilentLesson,
        tsya: generateTsyaLesson, prepri: generatePrepriLesson,
        nn: generateNNLesson
    };
    const gen = gens[skillId];
    return gen ? gen() : generateZhishiLesson();
}

function renderTask(container, task, options = {}) {
    const { isBonus = false, compact = false } = options;
    
    return new Promise((resolve) => {
        container.innerHTML = '';
        
        if (task.emoji) {
            const emojiEl = document.createElement('div');
            emojiEl.className = compact ? 'scene-emoji' : 'lesson-emoji';
            emojiEl.textContent = task.emoji;
            container.appendChild(emojiEl);
        }
        
        if (task.badge && !compact) {
            const badgeEl = document.createElement('div');
            badgeEl.className = `lesson-type-badge ${task.badgeClass || ''}`;
            badgeEl.textContent = task.badge;
            container.appendChild(badgeEl);
        }
        
        const questionEl = document.createElement('div');
        questionEl.className = compact ? 'scene-text' : 'lesson-question';
        if (task.question) questionEl.textContent = task.question;
        container.appendChild(questionEl);
        
        const explanationEl = document.createElement('div');
        explanationEl.className = compact ? 'explanation-box' : 'lesson-explanation';
        container.appendChild(explanationEl);
        
    if (task.type === 'visual') {
        renderVisual(container, task, explanationEl, resolve, isBonus, compact);
    } else if (task.type === 'choice') {
        renderChoice(container, task, explanationEl, resolve, isBonus, compact);
    } else if (task.type === 'input') {
        renderInput(container, task, explanationEl, resolve, isBonus, compact);
    } else if (task.type === 'pair') {
        renderPair(container, task, explanationEl, resolve, isBonus, compact);
    } else if (task.type && task.type.startsWith('boss')) {
        renderBoss(container, task, explanationEl, resolve, isBonus);
    }
    });
}

function renderVisual(container, task, explEl, resolve, isBonus, compact) {

        btn.className = optClass;

        btn.dataset.idx = idx;
        btn.dataset.value = String(optText);
        
        btn.addEventListener('click', () => {
            optsDiv.querySelectorAll('button').forEach(b => b.style.pointerEvents = 'none');

            } else {
                playSound('wrong', state.theme);
                btn.classList.add('wrong-pick');
                btn.textContent = '❌ ' + optText;
                optsDiv.querySelectorAll('button').forEach(b => {
                    if (String(b.dataset.value) === String(correctAnswer)) {
                        b.classList.add('correct-pick');
                        b.textContent = '✅ ' + b.dataset.value;
                    }
                });
                explEl.innerHTML = '<span style="font-size:16px;">🤔</span> ' + task.explanation;

function renderInput(container, task, explEl, resolve, isBonus, compact) {
    const rowDiv = document.createElement('div');
    rowDiv.className = compact ? 'task-input-row' : 'lesson-input-row';
    
    const input = document.createElement('input');
    input.type = 'text';
    input.className = compact ? 'task-input' : 'lesson-input';
    
    if (task.correctAns !== undefined && task.correctAns !== null) {
        const ansStr = String(task.correctAns).toLowerCase();
        if (ansStr === 'н' || ansStr === 'нн') input.placeholder = 'н/нн';
        else if (ansStr === 'ь' || ansStr === 'ъ') input.placeholder = 'ь/ъ';
        else if (ansStr === 'тся' || ansStr === 'ться') input.placeholder = 'тся/ться';
        else if (ansStr === 'и' || ansStr === 'е') input.placeholder = 'букву';
        else if (!isNaN(task.correctAns)) input.placeholder = 'Число';
        else input.placeholder = 'Ответ';
    } else {
        input.placeholder = 'Ответ';
    }
    input.autocomplete = 'off';
    
    const btn = document.createElement('button');
    btn.className = compact ? 'btn-submit' : 'btn-lesson-submit';
    btn.textContent = '✓';
    
    const submit = () => {
        const value = input.value.trim().toLowerCase();
        if (!value) {
            input.style.borderColor = 'var(--red)';
            input.style.animation = 'shake 0.5s ease';
            setTimeout(() => { input.style.animation = ''; input.style.borderColor = 'rgba(255,255,255,0.2)'; }, 500);
            return;
        }
        
        btn.disabled = true;
        input.disabled = true;
        
        const correctStr = String(task.correctAns).toLowerCase();
        // Убираем пробелы для сравнения чисел с запятой (например "12,16" vs "12, 16")
        const cleanValue = value.replace(/\s+/g, '');
        const cleanCorrect = correctStr.replace(/\s+/g, '');
        let isCorrect = (cleanValue === cleanCorrect);
        // Дополнительно: если ответ типа "периметр,площадь" — проверяем оба числа
        if (!isCorrect && cleanCorrect.includes(',')) {
            const correctParts = cleanCorrect.split(',');
            const valueParts = cleanValue.split(',');
            if (correctParts.length === valueParts.length) {
                isCorrect = correctParts.every((cp, i) => cp === valueParts[i]);
            }
        }
        
        if (isCorrect) {
            playSound('correct', state.theme);
            input.style.borderColor = 'var(--green)';
            input.style.background = 'rgba(16,185,129,0.2)';
            explEl.textContent = '✅ ' + task.explanation;
            explEl.className = (compact ? 'explanation-box' : 'lesson-explanation') + ' show good';
            resolve({ isCorrect: true, isBonus });
        } else {
            playSound('wrong', state.theme);
            input.style.borderColor = 'var(--red)';
            input.style.background = 'rgba(239,68,68,0.15)';
            explEl.textContent = '🤔 ' + task.explanation + ' ✅ ' + task.correctAns;
            explEl.className = (compact ? 'explanation-box' : 'lesson-explanation') + ' show bad';
            resolve({ isCorrect: false, isBonus });
        }
    };
    
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    
    rowDiv.appendChild(input);
    rowDiv.appendChild(btn);
    container.appendChild(rowDiv);
}

function renderPair(container, task, explEl, resolve, isBonus, compact) {
    const grid = document.createElement('div');
    grid.className = 'pair-grid';
    
    const leftDiv = document.createElement('div');
    leftDiv.className = 'pair-left';
    const rightDiv = document.createElement('div');
    rightDiv.className = 'pair-right';
    
    const leftItems = task.pairs.map((p, i) => ({ text: p.left, idx: i }));
    const rightItems = task.pairs.map((p, i) => ({ text: p.right, idx: i }));
    
    const shuf = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const shuffledLeft = shuf(leftItems);
    const shuffledRight = shuf(rightItems);
    
    let selectedLeft = null;
    let matchedCount = 0;
    const total = task.pairs.length;
    
    shuffledLeft.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'pair-item';
        btn.textContent = item.text;
        btn.dataset.pairIdx = item.idx;
        btn.dataset.side = 'left';
        leftDiv.appendChild(btn);
    });
    
    shuffledRight.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'pair-item';
        btn.textContent = item.text;
        btn.dataset.pairIdx = item.idx;
        btn.dataset.side = 'right';
        rightDiv.appendChild(btn);
    });
    
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:11px;opacity:0.5;margin-top:6px;text-align:center;';
    hint.textContent = 'Нажимай: левый → правый';
    
    const allLeftBtns = leftDiv.querySelectorAll('.pair-item');
    const allRightBtns = rightDiv.querySelectorAll('.pair-item');
    
    allLeftBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.classList.contains('matched')) return;
            allLeftBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedLeft = { el: btn, idx: parseInt(btn.dataset.pairIdx) };
        });
    });
    
    allRightBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.classList.contains('matched')) return;
            if (!selectedLeft) return;
            
            const rightIdx = parseInt(btn.dataset.pairIdx);
            
            if (selectedLeft.idx === rightIdx) {
                playSound('correct', state.theme);
                selectedLeft.el.classList.add('matched');
                btn.classList.add('matched');
                matchedCount++;
                selectedLeft = null;
                allLeftBtns.forEach(b => b.classList.remove('selected'));
                
                if (matchedCount >= total) {
                    explEl.textContent = '✅ ' + (task.explanation || 'Все пары верны!');
                    explEl.className = (compact ? 'explanation-box' : 'lesson-explanation') + ' show good';
                    resolve({ isCorrect: true, isBonus });
                }
            } else {
                playSound('wrong', state.theme);
                btn.classList.add('wrong-flash');
                setTimeout(() => btn.classList.remove('wrong-flash'), 500);
                selectedLeft.el.classList.remove('selected');
                selectedLeft = null;
            }
        });
    });
    
    grid.appendChild(leftDiv);
    grid.appendChild(rightDiv);
    container.appendChild(grid);
    container.appendChild(hint);
}

function renderBoss(container, task, explEl, resolve, isBonus) {
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'display:flex;flex-direction:column;gap:8px;width:100%;';
    
    const inputs = [];
    task.words.forEach((w) => {
        const row = document.createElement('div');
        row.className = 'boss-row';
        
        const label = document.createElement('span');
        label.className = 'boss-label';
        label.textContent = w.text;
        
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'boss-input';
        input.placeholder = 'буква';
        input.autocomplete = 'off';
        input.maxLength = 5;
        
        if (w.answer) {
            if (['н', 'нн'].includes(w.answer)) input.placeholder = 'н/нн';
            else if (['ь', 'ъ'].includes(w.answer)) input.placeholder = 'ь/ъ';
            else if (['тся', 'ться'].includes(w.answer)) input.placeholder = 'тся/ться';
            else if (['и', 'е'].includes(w.answer)) input.placeholder = 'и/е';
        }
        
        row.appendChild(label);
        row.appendChild(input);
        wrapper.appendChild(row);
        inputs.push({ input, answer: w.answer });
    });
    
    const submitBtn = document.createElement('button');
    submitBtn.className = 'btn-lesson-submit';
    submitBtn.textContent = '✓ Проверить';
    submitBtn.style.marginTop = '6px';
    
    submitBtn.addEventListener('click', () => {
        let allOk = true;
        inputs.forEach(({ input, answer }) => {
            const val = input.value.trim().toLowerCase();
            if (val !== answer) {
                allOk = false;
                input.style.borderColor = 'var(--red)';
                input.style.background = 'rgba(239,68,68,0.15)';
            } else {
                input.style.borderColor = 'var(--green)';
                input.style.background = 'rgba(16,185,129,0.2)';
            }
        });
        
        submitBtn.disabled = true;
        inputs.forEach(({ input }) => input.disabled = true);
        
        if (allOk) {
            playSound('correct', state.theme);
            explEl.textContent = '✅ ' + task.explanation;
            explEl.className = 'lesson-explanation show good';
            resolve({ isCorrect: true, isBonus });
        } else {
            playSound('wrong', state.theme);
            explEl.textContent = '🤔 ' + task.explanation;
            explEl.className = 'lesson-explanation show bad';
            resolve({ isCorrect: false, isBonus });
        }
    });
    
    inputs.forEach(({ input }) => {
        input.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });
    });
    
    wrapper.appendChild(submitBtn);
    container.appendChild(wrapper);
}

const steps = [
    { emoji: '🐱', title: 'Добро пожаловать!', text: 'Я Кот Учёный. Нажимай на доступный навык, чтобы начать урок.' },
    { emoji: '🧮', title: 'Два предмета', text: 'Переключайся между математикой и русским в шапке.' },
    { emoji: '🪤', title: 'Ловушки', text: 'Ошибки создают ловушки. Обезвреживай их и получай бонусы!' },
    { emoji: '🐱', title: 'Погладь меня!', text: 'Нажми на кота — я мурчу и даю достижения!' }
];

function startTutorial() {
    if (localStorage.getItem(TUTORIAL_KEY)) return;
    
    const overlay = $('#tutorialOverlay');
    let step = 0;
    
    const render = () => {
        const s = steps[step];
        $('#tutEmoji').textContent = s.emoji;
        $('#tutTitle').textContent = s.title;
        $('#tutText').textContent = s.text;
        $('#tutDots').innerHTML = steps.map((_, i) => `<span class="tutorial-dot ${i === step ? 'active' : ''}"></span>`).join('');
        $('#tutNext').textContent = step === steps.length - 1 ? 'Понял!' : 'Далее';
        overlay.classList.add('active');
    };
    
    const close = () => { overlay.classList.remove('active'); localStorage.setItem(TUTORIAL_KEY, '1'); };
    
    $('#tutNext').addEventListener('click', () => { step++; if (step >= steps.length) close(); else render(); });
    $('#tutSkip').addEventListener('click', close);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    
    render();
}

const LESSON_STORAGE_KEY = STORAGE_KEY + '_lesson_progress';
let stepHistory = [];

function generateLesson(skillId, subject) {
    if (subject === 'math') return generateMathLesson(skillId);
    return generateRusLesson(skillId);
}

function saveLessonProgress() {
    if (!state.currentLesson) return;
    const progress = {
        skillId: state.lessonSkillId, subject: state.subject,
        step: state.lessonStep, tasks: state.lessonTasks,
        correct: state.lessonCorrect, wrong: state.lessonWrong,
        stepHistory: stepHistory
    };
    localStorage.setItem(LESSON_STORAGE_KEY, JSON.stringify(progress));
}

function loadLessonProgress() {
    const saved = localStorage.getItem(LESSON_STORAGE_KEY);
    if (!saved) return false;
    try {
        const progress = JSON.parse(saved);
        if (!progress.skillId || !progress.tasks || progress.tasks.length === 0) return false;
        state.currentLesson = progress.skillId; state.lessonSkillId = progress.skillId;
        state.lessonStep = progress.step; state.lessonTasks = progress.tasks;
        state.lessonCorrect = progress.correct; state.lessonWrong = progress.wrong;
        stepHistory = progress.stepHistory || [];
        return true;
    } catch (e) { return false; }
}

function clearLessonProgress() { localStorage.removeItem(LESSON_STORAGE_KEY); }

function initStepHistory() {
    const total = state.lessonTasks.length;
    stepHistory = new Array(total).fill('pending');
}

function updateProgressBar() {
    const total = state.lessonTasks.length;
    const done = state.lessonStep;
    const percent = total > 0 ? Math.round((done / total) * 100) : 0;
    const bar = $('#lessonProgressBar');
    if (bar) { bar.style.width = percent + '%'; bar.classList.toggle('complete', percent >= 100); }
}

function renderDots() {
    const container = $('#lessonSteps');
    if (!container) return;
    const total = state.lessonTasks.length;
    let html = '';
    for (let i = 0; i < total; i++) {
        let dotClass = 'lstep-dot';
        if (stepHistory[i] === 'correct') dotClass += ' done';
        else if (stepHistory[i] === 'wrong') dotClass += ' wrong';
        else if (i === state.lessonStep && stepHistory[i] === 'pending') dotClass += ' current';
        html += `<span class="${dotClass}"></span>`;
    }
    container.innerHTML = html;
}

function startLesson(skillId) {
    const saved = localStorage.getItem(LESSON_STORAGE_KEY);
    if (saved) {
        try {
            const progress = JSON.parse(saved);
            if (progress.skillId === skillId && progress.tasks && progress.tasks.length > 0) {
                const skill = getCurrentSkills().find(s => s.id === skillId);
                const skillName = skill ? skill.name : 'Неизвестно';
                const resume = confirm(`🐱 У тебя есть незавершённый урок!\n\n📚 Тема: «${skillName}»\n📍 Пройдено: ${progress.step} из ${progress.tasks.length} заданий\n✅ Верных ответов: ${progress.correct}\n\nПродолжить урок?`);
                if (resume && loadLessonProgress()) {
                    const im = state.subject === 'math';
                    $('#lessonTitle').textContent = (im ? '🧮 ' : '📝 ') + skillName;
                    $('#lessonContainer').className = 'lesson-container ' + (im ? 'math-lesson' : 'rus-lesson');
                    $('#lessonHeader').className = 'lesson-header ' + (im ? 'math-bar' : 'rus-bar');
                    $('#lessonNextBtn').className = 'lesson-next ' + (im ? 'math-next' : 'rus-next');
                    $('#btnLessonFinish').className = 'btn-lesson-finish ' + (im ? 'math-finish' : 'rus-finish');
                    updateProgressBar(); renderDots();
                    $('#lessonOverlay').classList.add('active');
                    $('#lessonNextBtn').classList.remove('show');
                    $('#lessonFinishBlock').classList.remove('show');
                    $('#lessonScene').style.display = 'flex';
                    renderLessonStep();
                    return;
                }
            }
        } catch (e) {}
        clearLessonProgress();
    }

    const im = state.subject === 'math';
    state.currentLesson = skillId; state.lessonSkillId = skillId;
    state.lessonStep = 0; state.lessonCorrect = 0; state.lessonWrong = 0;
    state.lessonTasks = generateLesson(skillId, state.subject);
    initStepHistory();

    const skill = getCurrentSkills().find(s => s.id === skillId);
    $('#lessonTitle').textContent = (im ? '🧮 ' : '📝 ') + (skill ? skill.name : 'Урок');
    $('#lessonContainer').className = 'lesson-container ' + (im ? 'math-lesson' : 'rus-lesson');
    $('#lessonHeader').className = 'lesson-header ' + (im ? 'math-bar' : 'rus-bar');
    $('#lessonNextBtn').className = 'lesson-next ' + (im ? 'math-next' : 'rus-next');
    $('#btnLessonFinish').className = 'btn-lesson-finish ' + (im ? 'math-finish' : 'rus-finish');

    updateProgressBar(); renderDots();
    $('#lessonOverlay').classList.add('active');
    $('#lessonNextBtn').classList.remove('show');
    $('#lessonFinishBlock').classList.remove('show');
    $('#lessonScene').style.display = 'flex';
    saveLessonProgress();
    renderLessonStep();
}

async function closeLesson() {
    if (state.currentLesson && state.lessonTasks.length > 0) {
        const confirmExit = confirm('🐱 Ты уверен, что хочешь выйти из урока?\n\nПрогресс текущего урока будет потерян.');
        if (!confirmExit) return;
    }
    clearLessonProgress();
    $('#lessonOverlay').classList.remove('active');
    state.currentLesson = null; state.lessonTasks = []; stepHistory = [];
    renderSkillTree();
    checkAchievements((name, desc) => showAchievementToast(name, desc));
    updateTrapsBadge();
    saveState();
}

function unlockNext(currentSkill) {
    const skills = getCurrentSkills();
    const ci = skills.findIndex(s => s.id === currentSkill.id);
    if (ci >= 0 && ci + 1 < skills.length && skills[ci + 1].status === 'locked') {
        skills[ci + 1].status = 'current';
        showToast('🔓', 'Новый навык открыт!', $('#toast'));
        spawnLeaves();
    }
}

async function renderLessonStep() {
    const task = state.lessonTasks[state.lessonStep];
    if (!task) { finishLesson(); return; }

    $('#lessonNextBtn').classList.remove('show');
    $('#lessonFinishBlock').classList.remove('show');
    const scene = $('#lessonScene');

    if (scene.children.length > 0) {
        scene.classList.add('task-transition');
        await new Promise(r => setTimeout(r, 200));
        scene.classList.remove('task-transition');
    }
    scene.style.display = 'flex';
    scene.style.animation = 'none'; scene.offsetHeight; scene.style.animation = '';

    const result = await renderTask(scene, task, { isBonus: false });

    if (state.lessonStep < stepHistory.length) {
        stepHistory[state.lessonStep] = result.isCorrect ? 'correct' : 'wrong';
    }

    if (result.isCorrect) {
        state.lessonCorrect++;
        onCorrectAnswer();
    } else {
        state.lessonWrong++;
        addLessonTrap(task);
        onWrongAnswer();
    }

    renderDots(); updateProgressBar(); saveLessonProgress();
    setTimeout(() => $('#lessonNextBtn').classList.add('show'), 1000);
    scene.scrollTop = 0;
}

function addLessonTrap(task) {
    const id = 'lesson_' + state.lessonSkillId + '_' + Date.now();
    state.traps.push({
        id, question: task.question, options: task.options || null,
        correct: task.correctIdx ?? null, answer: task.correctAns,
        explanation: task.explanation,
        source: 'Урок: ' + ($('#lessonTitle')?.textContent || 'Неизвестно'),
        defuses: 0, nextDate: new Date().toISOString(),
        isInput: task.type === 'input' || (task.type && task.type.startsWith('boss')),
        subject: state.subject
    });
    unlockAchievement('firstBlood', (n, d) => showAchievementToast(n, d));
    saveState();
}

function nextLessonStep() {
    state.lessonStep++;
    if (state.lessonStep >= state.lessonTasks.length) { finishLesson(); }
    else { saveLessonProgress(); renderDots(); updateProgressBar(); renderLessonStep(); $('#lessonScene').scrollTop = 0; }
}

function finishLesson() {
    clearLessonProgress();
    $('#lessonScene').style.display = 'none';
    $('#lessonNextBtn').classList.remove('show');
    $('#lessonFinishBlock').classList.add('show');

    const c = state.lessonCorrect, w = state.lessonWrong;
    $('#lfinishCorrect').textContent = c; $('#lfinishWrong').textContent = w;
    const totalTasks = state.lessonTasks.length;
    const xp = c * GEMS.LESSON_XP_PER_CORRECT + (w === 0 ? GEMS.LESSON_PERFECT_BONUS : 0);
    $('#lfinishXP').textContent = '+' + xp + ' 💎';

    if (w === 0) {
        $('#lfinishTitle').textContent = 'Идеально! 🌟';
        $('#lfinishSubtitle').textContent = 'Навык пройден!';
    } else {
        $('#lfinishTitle').textContent = 'Урок пройден!';
        $('#lfinishSubtitle').textContent = `${c}/${c + w} верно. Ошибки → 🪤`;
    }

    state.gems += xp; updateStats();
    
    // Всплывающие +XP
    const finishBlock = $('#lessonFinishBlock');
    if (finishBlock) {
        const rect = finishBlock.getBoundingClientRect();
        spawnXP(xp, rect.left + rect.width / 2 - 20, rect.top + 40);
    }
    
    // Lottie галочка при идеальном прохождении
    if (w === 0) {
        const lottieWrap = document.createElement('div');
        lottieWrap.className = 'lottie-container lottie-fade';
        document.body.appendChild(lottieWrap);
        playLottie(lottieWrap, 'https://assets10.lottiefiles.com/packages/lf20_jbrw3hcz.json');
        setTimeout(() => lottieWrap.remove(), 2500);
    }
    
    unlockAchievement('student', (n, d) => showAchievementToast(n, d));
    if (w === 0) unlockAchievement('master', (n, d) => showAchievementToast(n, d));
    playSound(w === 0 ? 'achievement' : 'correct', state.theme);
    onLessonComplete();

    const skill = getCurrentSkills().find(s => s.id === state.lessonSkillId);
    if (skill) {
        const ratio = c / totalTasks;
        const np = Math.min(100, skill.progress + Math.round(ratio * 100));
        skill.progress = np;
        if (np >= SKILL.PROGRESS_TO_COMPLETE) { skill.status = 'completed'; unlockNext(skill); }
    }

    updateProgressBar();
    const catSpeech = $('#catSpeech');
    if (catSpeech) catSpeech.textContent = w === 0 ? CAT_SPEECH.lessonPerfect : CAT_SPEECH.lessonDone;

    stepHistory = []; updateTrapsBadge(); saveState();
    state.currentLesson = null; state.lessonTasks = [];
    renderSkillTree();
}

function checkSavedLesson() {
    const saved = localStorage.getItem(LESSON_STORAGE_KEY);
    if (!saved) return false;
    try {
        const progress = JSON.parse(saved);
        if (!progress.skillId || !progress.tasks || progress.tasks.length === 0) { clearLessonProgress(); return false; }
        const skill = getCurrentSkills().find(s => s.id === progress.skillId);
        const skillName = skill ? skill.name : 'Неизвестно';
        const resume = confirm(`🐱 У тебя есть незавершённый урок!\n\n📚 Тема: «${skillName}»\n📍 Пройдено: ${progress.step} из ${progress.tasks.length} заданий\n✅ Верных ответов: ${progress.correct}\n\nПродолжить урок?`);
        if (resume && loadLessonProgress()) {
            const im = state.subject === 'math';
            $('#lessonTitle').textContent = (im ? '🧮 ' : '📝 ') + skillName;
            $('#lessonContainer').className = 'lesson-container ' + (im ? 'math-lesson' : 'rus-lesson');
            $('#lessonHeader').className = 'lesson-header ' + (im ? 'math-bar' : 'rus-bar');
            $('#lessonNextBtn').className = 'lesson-next ' + (im ? 'math-next' : 'rus-next');
            $('#btnLessonFinish').className = 'btn-lesson-finish ' + (im ? 'math-finish' : 'rus-finish');
            updateProgressBar(); renderDots();
            $('#lessonOverlay').classList.add('active');
            $('#lessonNextBtn').classList.remove('show');
            $('#lessonFinishBlock').classList.remove('show');
            $('#lessonScene').style.display = 'flex';
            renderLessonStep();
            return true;
        }
    } catch (e) {}
    clearLessonProgress();
    return false;
}

function openStoryPanel() {

function startStory(id) {

    const im = scr.subj === SUBJECTS.MATH;

function closeStory() {

    updateTrapsBadge();
}

async function renderStoryStep() {
    const scr = storySrc[Object.keys(storySrc).find(k => storySrc[k].id === state.currentStory)];
    const step = scr.scenes[state.storyStep];
    if (!step) { finishStory(); return; }

    $('#storyNextBtn').classList.remove('show');
    $('#storyFinishBlock2').classList.remove('show');
    $('#storyScene').style.display = 'flex';
    state.storyAnswered = false;

    let html = `<div class="scene-emoji">${step.emoji}</div><div class="scene-speaker">${step.speaker}</div><div class="scene-text">${step.text}</div>`;
    if (step.type === 'dialogue') {
        $('#storyScene').innerHTML = html;
        setTimeout(() => $('#storyNextBtn').classList.add('show'), 500);
    } else {
        $('#storyScene').innerHTML = html;
        const taskBox = document.createElement('div');
        taskBox.className = 'story-task-box';
        const taskLabel = document.createElement('div');
        taskLabel.className = 'task-label';
        taskLabel.textContent = step.question || 'Твоё решение:';
        taskBox.appendChild(taskLabel);
        $('#storyScene').appendChild(taskBox);

        // Создаём задание с correctAns вместо correctIdx
        const task = {
            type: step.type,
            question: step.question,
            options: step.options,
            correctAns: step.correctAns,
            explanation: step.explanation
        };
        if (step.type === 'input') {
            task.correctAns = step.correctAns;
        }

        const result = await renderTask(taskBox, task, { compact: true });
        state.storyAnswered = true;

        if (result.isCorrect) {
            state.gems += GEMS.CORRECT_ANSWER;
            updateStats();
            setTimeout(() => $('#storyNextBtn').classList.add('show'), 1000);
        } else {
            if (step.trapId) addStoryTrap(step, scr.title);
            showToast('🤔', 'Ошибка → Ловушки!', $('#toast'));
            setTimeout(() => $('#storyNextBtn').classList.add('show'), 1800);
        }
    }
    updateStorySteps();
    $('#storyScene').scrollTop = 0;
}

function addStoryTrap(step, src) {
    if (!step.trapId || state.traps.find(t => t.id === step.trapId)) return;
    state.traps.push({
        id: step.trapId,
        question: step.question,
        options: step.options || null,
        correct: step.options ? step.options.indexOf(step.correctAns) : null,
        answer: step.correctAns || null,
        explanation: step.explanation,
        source: src,
        defuses: 0,
        nextDate: new Date().toISOString(),
        isInput: step.type === 'input',
        subject: state.currentStory.startsWith('rus') ? SUBJECTS.RUSSIAN : SUBJECTS.MATH

function updateStorySteps() {

        d.classList.remove('done', 'current');
        if (i < state.storyStep) d.classList.add('done');
        else if (i === state.storyStep) d.classList.add('current');
    });
}

function nextStoryStep() {
    const scr = storySrc[Object.keys(storySrc).find(k => storySrc[k].id === state.currentStory)];
    state.storyStep++;
    if (state.storyStep >= scr.scenes.length) finishStory();
    else { renderStoryStep(); $('#storyScene').scrollTop = 0; }
}

function finishStory() {

    $('#finishSubtitle').textContent = im ? 'Торт найден!' : 'Ты герой! 📚';
    state.gems += im ? GEMS.STORY_MATH_REWARD : GEMS.STORY_RUS_REWARD;
    updateStats();
    $$('#storySteps .step-dot').forEach(d => { d.classList.add('done'); d.classList.remove('current'); });
    const catSpeech = $('#catSpeech');
    if (catSpeech) catSpeech.textContent = CAT_SPEECH.storyDone;
    checkAchievements((n, d) => showAchievementToast(n, d));
    updateTrapsBadge();
    saveState();
}
